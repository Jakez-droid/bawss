<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Diffusion · Kaier</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#12304A">
<link rel="icon" href="icons/favicon-32.png">
<style>
@font-face{font-family:Gloock;src:url(fonts/gloock.woff2) format("woff2");font-display:swap}
@font-face{font-family:Figtree;src:url(fonts/figtree.woff2) format("woff2");font-weight:300 900;font-display:swap}
:root{--sel:#F2F4F3;--surface:#fff;--sunk:#E6EBEC;--ink:#12304A;--ink-2:#4C6274;--ink-3:#7B8E9C;--line:#D5DDE1;--cire:#FFC72C;--bar:#12304A;--bar-2:#9DB0BF;--algue:#2F7A55;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--sel:#0D1F2E;--surface:#15293B;--sunk:#0A1825;--ink:#EEF2F3;--ink-2:#AFC0CB;--ink-3:#7F95A4;--line:#26405A;--bar:#E3EAEE;--bar-2:#4F6A80;--algue:#7FCBA2;color-scheme:dark}}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{margin:0;background:var(--sel);color:var(--ink);font:400 16px/1.5 Figtree,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:24px 16px 80px}
@media (min-width:720px){.wrap{padding:40px 32px 80px}}
h1{font:400 clamp(2.4rem,8vw,3.6rem)/1 Gloock,Georgia,serif;margin:0 0 8px;letter-spacing:-.02em}
h2{font:400 26px/1.1 Gloock,Georgia,serif;margin:0 0 4px}
.sub{color:var(--ink-2);margin:0 0 4px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:28px}
.top a{display:flex;align-items:center;gap:8px;text-decoration:none;font:400 22px/1 Gloock,serif}
.top img{width:30px;height:30px;border-radius:8px}
.top span{margin-left:auto;font-size:14px;color:var(--ink-3)}
form.code{display:flex;gap:8px;margin:24px 0;max-width:420px}
form.code input{flex:1;height:50px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);padding:0 14px;min-width:0}
.btn{height:50px;padding:0 18px;border-radius:14px;border:0;background:var(--ink);color:var(--sel);font-weight:700;cursor:pointer;white-space:nowrap}
.btn.cire{background:var(--cire);color:#12304A}
.btn.line{background:none;border:1.5px solid var(--line);color:var(--ink)}
.err{color:#C0392B;font-weight:600}
.box{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;margin-top:16px}
.hero{display:grid;gap:18px;margin:8px 0 8px}
.big{font:400 clamp(4rem,16vw,7rem)/.9 Gloock,serif;letter-spacing:-.03em}
.big small{display:block;font:600 17px/1.3 Figtree,sans-serif;color:var(--ink-2);letter-spacing:0;margin-top:10px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:720px){.hero{grid-template-columns:1fr 1.4fr;align-items:end}.kpis{grid-template-columns:repeat(3,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.kpi b{display:block;font:400 32px/1 Gloock,serif}
.kpi span{font-size:14px;color:var(--ink-2)}
.grid2{display:grid;gap:16px}
@media (min-width:860px){.grid2{grid-template-columns:1fr 1fr}}
.chart{position:relative;margin-top:14px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.axis{font-size:11px;fill:var(--ink-3)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--sel);padding:6px 10px;border-radius:8px;font-size:13px;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .1s}
.rows{display:grid;gap:10px;margin-top:14px}
.row{display:grid;grid-template-columns:minmax(90px,38%) 1fr 44px;gap:10px;align-items:center;font-size:14.5px}
.row .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .tr{height:12px;background:var(--sunk);border-radius:4px;overflow:hidden}
.row .fi{height:100%;background:var(--bar);border-radius:0 4px 4px 0}
.row .n{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.tree{overflow-x:auto;margin:14px -20px 0;padding:0 20px}
.tree svg{display:block}
.tree circle{cursor:default}
table{width:100%;border-collapse:collapse;font-size:14.5px;margin-top:12px}
th,td{text-align:right;padding:9px 6px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
th{font-size:13px;color:var(--ink-2);font-weight:600}
.tw{overflow-x:auto}
.amb{display:grid;gap:8px;margin-top:12px}
.amb div{display:flex;gap:12px;align-items:center;padding:10px 12px;background:var(--sel);border-radius:12px;font-size:15px}
.amb b{font:400 26px/1 Gloock,serif;min-width:34px}
.mine{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.note{font-size:14px;color:var(--ink-3);margin-top:10px}
.empty{color:var(--ink-2)}
code{background:var(--sunk);padding:2px 6px;border-radius:6px;font-size:14px;word-break:break-all}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="./"><img src="icons/icon-192.png" alt="">Kaier</a><span>Page réservée à Jakez</span></div>
  <h1>Où va ton cahier</h1>
  <p class="sub">Qui l'ouvre, qui le fait tourner, quelles recettes marchent. Tout est anonyme : chaque téléphone n'est qu'un numéro au hasard.</p>
  <form class="code" id="f"><input id="code" type="password" placeholder="Ton code" autocomplete="current-password" aria-label="Code"><button class="btn">Voir</button></form>
  <p class="err" id="err" hidden></p>
  <div id="out"></div>
</div>
<script>
const SB_URL = 'https://ppbyclkztomepipemhdy.supabase.co';
const SB_KEY = 'sb_publishable_RiL4oWlS4C5Pye5Gz-joBw_zure_NBr';
const TITRES = {"aubergine-rotie-miel-harissa": "Aubergine rôtie miel harissa", "bagel-poulet-bacon-avocat": "Bagel poulet bacon avocat", "base-de-curry-japonais": "Base de curry japonais", "bechamel": "Béchamel", "bouillon-de-volaille": "Bouillon de volaille", "celeri-roti": "Céleri rôti", "chakchouka-verte-ou-rouge": "Chakchouka verte ou rouge", "chou-farci": "Chou farci", "chou-fleur-roti": "Chou-fleur rôti", "croissant-aplati-grille-au-miel": "Croissant aplati grillé au miel", "croque-au-bleu-et-tomate-confite": "Croque au bleu et tomate confite", "cuisson-du-riz": "Cuisson du riz", "curry-japonais": "Curry japonais", "donburi-asperge": "Donburi asperge", "flan-vanille": "Flan vanille", "focaccia": "Focaccia", "grilled-cheese": "Grilled cheese", "gua-bao-au-porc-braise": "Gua bao au porc braisé", "huile-pimentee-mala": "Huile pimentée mala", "karaage": "Karaage", "krapao": "Krapao", "lasagnes-a-la-bolognaise": "Lasagnes à la bolognaise", "lasagnes-vegetariennes": "Lasagnes végétariennes", "matcha-latte-maison": "Matcha latte maison", "nouilles-sautees-pak-choi-poulet": "Nouilles sautées pak choï poulet", "papillotes-de-saumon-au-citron-confit": "Papillotes de saumon au citron confit", "parmigiana-d-aubergines": "Parmigiana d'aubergines", "porc-braise-au-soja": "Porc braisé au soja", "pot-au-feu": "Pot-au-feu", "potimarron-farci-au-mont-d-or": "Potimarron farci au Mont d'Or", "poulet-roti": "Poulet rôti", "pudding-de-tapioca-au-lait-de-coco": "Pudding de tapioca au lait de coco", "quiche-brocoli-jambon-gorgonzola": "Quiche brocoli jambon gorgonzola", "quiche-lorraine": "Quiche lorraine", "ragu-a-la-bolognaise": "Ragù à la bolognaise", "ragu-birria": "Ragù Birria", "raviolis-wonton": "Raviolis wonton", "risotto-aux-asperges": "Risotto aux asperges", "roti-de-porc-puree-sauce-moutarde": "Rôti de porc, purée, sauce moutarde", "rouleaux-de-printemps-blt": "Rouleaux de printemps BLT", "salade-de-fenouil-oignon-rouge-thon-et-capres": "Salade de fenouil, oignon rouge, thon et câpres", "salade-de-lentilles-tomates-concombre-feta": "Salade de lentilles, tomates, concombre, feta", "salade-de-pommes-de-terre-japonaise": "Salade de pommes de terre japonaise", "salade-de-pommes-de-terre-olives-et-lardons": "Salade de pommes de terre, olives et lardons", "salade-grecque": "Salade grecque", "sandwich-focaccia": "Sandwich focaccia", "saucisse-et-lentilles": "Saucisse et lentilles", "tartare-de-thon": "Tartare de thon", "tarte-a-la-tomate": "Tarte à la tomate", "tarte-aux-champignons": "Tarte aux champignons", "tartiflette": "Tartiflette", "tatin-d-aubergine": "Tatin d'aubergine", "tourte-au-poulet": "Tourte au poulet", "tuna-melt": "Tuna melt", "veloute-de-butternut": "Velouté de butternut", "veloute-de-potimarron": "Velouté de potimarron"};
const SITE = new URL('./', location.href).href;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ls = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };
const PL = { ios: 'iPhone', android: 'Android', ordi: 'Ordinateur', '?': 'Inconnu' };
const CANAL = { natif: 'Bouton Envoyer', whatsapp: 'WhatsApp', copie: 'Lien copié', qr: 'QR code', liste: 'Liste de courses' };
const dfmt = t => new Date(t).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });

async function charger(code) {
  if (new URLSearchParams(location.search).has('demo')) return demo();
  const r = await fetch(SB_URL + '/rest/v1/rpc/kaier_stats', { method: 'POST', headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ code }) });
  if (r.status === 404) throw new Error('La base n\'est pas encore prête : colle le fichier outils/supabase_kaier.sql dans Supabase (SQL Editor), puis réessaie.');
  if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(/code incorrect/.test(j.message || '') ? 'Code incorrect.' : 'Impossible de joindre la base (' + r.status + ').'); }
  return r.json();
}

$('#f').onsubmit = async e => {
  e.preventDefault();
  const code = $('#code').value.trim();
  $('#err').hidden = true;
  try { const d = await charger(code); ls.set('kaier.code', code); afficher(d); $('#f').hidden = true; }
  catch (x) { $('#err').textContent = x.message; $('#err').hidden = false; }
};
if (ls.get('kaier.code') || new URLSearchParams(location.search).has('demo')) { $('#code').value = ls.get('kaier.code') || ''; $('#f').requestSubmit(); }

function barsJour(d) {
  const W = 640, H = 180, pad = 22, n = d.length, bw = (W - 8) / n;
  const max = Math.max(1, ...d.map(x => x.nouveaux));
  const step = max <= 4 ? 1 : Math.ceil(max / 4);
  let g = '';
  for (let v = 0; v <= max; v += step) { const y = H - pad - (v / max) * (H - pad - 8); g += `<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text class="axis" x="${W}" y="${y - 4}" text-anchor="end">${v}</text>`; }
  const bars = d.map((x, i) => {
    const h = (x.nouveaux / max) * (H - pad - 8), X = 4 + i * bw;
    return `<g data-t="${dfmt(x.jour)} : ${x.nouveaux} nouvelle${x.nouveaux > 1 ? 's' : ''}, ${x.actifs} active${x.actifs > 1 ? 's' : ''}" data-x="${X + bw / 2}"><rect x="${X}" y="8" width="${bw}" height="${H - pad - 8}" fill="transparent"/>${h ? `<path d="M${X + 1} ${H - pad}v${-h + 3}q0 -3 3 -3h${bw - 8}q3 0 3 3v${h - 3}z" fill="var(--bar)"/>` : ''}</g>`;
  }).join('');
  const lab = [0, Math.floor(n / 2), n - 1].map(i => `<text class="axis" x="${4 + i * bw + bw / 2}" y="${H - 4}" text-anchor="middle">${dfmt(d[i].jour)}</text>`).join('');
  return `<div class="chart" data-hover><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Nouvelles personnes par jour sur 30 jours">${g}${bars}${lab}</svg><div class="tip"></div></div>`;
}
function liste(obj, nom = k => k) {
  const e = Object.entries(obj).sort((a, b) => b[1] - a[1]);
  if (!e.length) return '<p class="empty">Rien pour l\'instant.</p>';
  const max = e[0][1];
  return `<div class="rows">${e.map(([k, v]) => `<div class="row"><span class="lab">${esc(nom(k))}</span><span class="tr"><span class="fi" style="width:${(v / max) * 100}%;display:block"></span></span><span class="n">${v}</span></div>`).join('')}</div>`;
}
function arbre(noeuds) {
  // arbre partant de Jakez ; les gens arrivés sans lien sont rattachés à une racine « sans parrain »
  const kids = {}; const by = Object.fromEntries(noeuds.map(n => [n.v, n]));
  noeuds.forEach(n => { const p = n.p === 'jakez' ? 'jakez' : (n.p && by[n.p] ? n.p : '∅'); (kids[p] ||= []).push(n.v); });
  const pos = {}; let leaf = 0, maxD = 0;
  function place(id, depth) {
    maxD = Math.max(maxD, depth);
    const k = kids[id] || [];
    if (!k.length) { pos[id] = { x: leaf++, y: depth }; return; }
    k.forEach(c => place(c, depth + 1));
    const xs = k.map(c => pos[c].x); pos[id] = { x: (Math.min(...xs) + Math.max(...xs)) / 2, y: depth };
  }
  const roots = ['jakez', ...(kids['∅'] ? ['∅'] : [])];
  roots.forEach(r => { place(r, 0); leaf += .6; });
  const sx = 26, sy = 64, W = Math.max(320, leaf * sx + 40), H = (maxD + 1) * sy + 30;
  const X = id => 20 + pos[id].x * sx, Y = id => 24 + pos[id].y * sy;
  let lines = '', dots = '';
  for (const [p, ks] of Object.entries(kids)) for (const c of ks) lines += `<path d="M${X(p)} ${Y(p)}C${X(p)} ${Y(p) + sy / 2} ${X(c)} ${Y(c) - sy / 2} ${X(c)} ${Y(c)}" fill="none" stroke="var(--line)" stroke-width="2"/>`;
  for (const id of Object.keys(pos)) {
    if (id === 'jakez') { dots += `<circle cx="${X(id)}" cy="${Y(id)}" r="13" fill="#FFC72C" stroke="var(--surface)" stroke-width="2"><title>Toi</title></circle><text x="${X(id)}" y="${Y(id) + 4}" text-anchor="middle" font-size="11" font-weight="800" fill="#12304A">J</text>`; continue; }
    if (id === '∅') { dots += `<circle cx="${X(id)}" cy="${Y(id)}" r="9" fill="var(--sunk)" stroke="var(--ink-3)" stroke-dasharray="3 2"><title>Arrivés sans lien de parrainage</title></circle>`; continue; }
    const n = by[id], r = 5 + Math.min(9, Math.sqrt(n.d) * 2.2);
    dots += `<circle cx="${X(id)}" cy="${Y(id)}" r="${r}" fill="${n.d ? 'var(--bar)' : 'var(--bar-2)'}" stroke="var(--surface)" stroke-width="2"><title>${PL[n.pl] || ''}, arrivé le ${dfmt(n.t)}${n.d ? ` · a fait venir ${n.d} personne${n.d > 1 ? 's' : ''}` : ''}</title></circle>`;
  }
  return `<div class="tree"><svg width="${W}" height="${H}" role="img" aria-label="Arbre de diffusion">${lines}${dots}</svg></div>`;
}

function afficher(d) {
  const gen = Object.fromEntries(d.generations.map(g => [g.gen, g.n]));
  const amb = [...d.noeuds].filter(n => n.d > 0).sort((a, b) => b.d - a.d).slice(0, 5);
  const recs = d.recettes.filter(r => TITRES[r.recette] || r.vues).slice(0, 25);
  const moi = ls.get('kaier.v') === '"jakez"';
  const titreGen = d.gen_max >= 2 ? `Ton cahier est allé jusqu'à ${d.gen_max} rebonds de toi` : d.gen_max === 1 ? 'Pour l\'instant, ce sont tes contacts directs' : 'Le premier partage reste à faire';
  $('#out').innerHTML = `
  <section class="hero">
    <div class="big">${d.personnes}<small>personne${d.personnes > 1 ? 's' : ''} ont ouvert Kaier</small></div>
    <div class="kpis">
      <div class="kpi"><b>${d.nouveaux_7j}</b><span>nouvelles cette semaine</span></div>
      <div class="kpi"><b>${d.actifs_7j}</b><span>actives cette semaine</span></div>
      <div class="kpi"><b>${d.via_lien}</b><span>venues par un lien partagé</span></div>
      <div class="kpi"><b>${d.partages}</b><span>partages</span></div>
      <div class="kpi"><b>${d.faites}</b><span>recettes réussies</span></div>
      <div class="kpi"><b>${d.installes}</b><span>l'ont sur l'écran d'accueil</span></div>
    </div>
  </section>

  <div class="box"><h2>Nouvelles personnes par jour</h2><p class="sub">Les 30 derniers jours.</p>${barsJour(d.par_jour)}</div>

  <div class="box"><h2>${titreGen}</h2>
    <p class="sub">Chaque point est un téléphone, relié à celui qui lui a envoyé le lien. Les gros points ont fait venir du monde.</p>
    ${d.noeuds.length ? arbre(d.noeuds) : '<p class="empty">Personne encore. Envoie ton lien perso (plus bas) à quelques potes.</p>'}
    <div class="rows" style="margin-top:18px">${Object.keys(gen).sort((a, b) => a - b).map(g => `<div class="row"><span class="lab">${g == 0 ? 'Sans parrain' : g == 1 ? 'Reçu de toi' : g == 2 ? 'Reçu d\'un de tes contacts' : 'À ' + g + ' rebonds'}</span><span class="tr"><span class="fi" style="width:${gen[g] / Math.max(...Object.values(gen)) * 100}%;display:block"></span></span><span class="n">${gen[g]}</span></div>`).join('')}</div>
  </div>

  <div class="grid2">
    <div class="box"><h2>Tes meilleurs ambassadeurs</h2><p class="sub">Les téléphones qui ont fait venir le plus de monde, eux et leurs contacts compris.</p>
      ${amb.length ? `<div class="amb">${amb.map((n, i) => `<div><b>${n.d}</b><span>personne${n.d > 1 ? 's' : ''} grâce à un ${PL[n.pl] || 'téléphone'} arrivé le ${dfmt(n.t)}${n.g ? (n.g === 1 ? ', à qui tu l\'avais envoyé' : `, à ${n.g} rebonds de toi`) : ''}</span></div>`).join('')}</div>` : '<p class="empty">Pas encore d\'ambassadeur.</p>'}
    </div>
    <div class="box"><h2>Comment ça se partage</h2>${liste(d.canaux, k => CANAL[k] || k)}<h2 style="margin-top:22px">Sur quels appareils</h2>${liste(d.plateformes, k => PL[k] || k)}</div>
  </div>

  <div class="box"><h2>Les recettes</h2><p class="sub">Nombre de personnes, sauf les partages.</p>
    ${recs.length ? `<div class="tw"><table><thead><tr><th>Recette</th><th>Ouvertes</th><th>Cuisinées</th><th>Réussies</th><th>Partagées</th><th>Gardées</th></tr></thead><tbody>${recs.map(r => `<tr><td>${esc(TITRES[r.recette] || r.recette)}</td><td>${r.vues}</td><td>${r.cuisinees}</td><td>${r.faites}</td><td>${r.partages}</td><td>${r.favoris}</td></tr>`).join('')}</tbody></table></div>` : '<p class="empty">Aucune recette ouverte pour l\'instant.</p>'}
  </div>

  <div class="box"><h2>Ce que les gens cherchent</h2><p class="sub">Des idées de prochaines recettes à ajouter au cahier.</p>
    ${d.recherches.length ? liste(Object.fromEntries(d.recherches.map(s => [s.terme, s.n]))) : '<p class="empty">Aucune recherche encore.</p>'}
  </div>

  <div class="box"><h2>Ton lien perso</h2>
    <p class="sub">Les gens qui arrivent par ce lien sont comptés comme « reçu de toi ». Partage-le tel quel.</p>
    <p><code>${SITE}?de=jakez</code></p>
    <div class="mine"><button class="btn cire" id="copy">Copier mon lien</button>
    <button class="btn ${moi ? 'line' : ''}" id="moi">${moi ? 'Ce téléphone est le tien ✓' : 'Ce téléphone est le mien'}</button></div>
    <p class="note">« Ce téléphone est le mien » : tes propres visites ne sont plus comptées, et tout ce que tu partages depuis l'appli part avec ton lien perso. À faire sur chaque appareil que tu utilises.</p>
  </div>`;

  $('#copy').onclick = async () => { try { await navigator.clipboard.writeText(SITE + '?de=jakez'); $('#copy').textContent = 'Copié'; } catch (e) {} };
  $('#moi').onclick = () => { ls.set('kaier.v', '"jakez"'); ls.set('kaier.de', 'null'); afficher(d); };
  document.querySelectorAll('[data-hover]').forEach(c => {
    const tip = c.querySelector('.tip'), svg = c.querySelector('svg');
    c.addEventListener('pointermove', e => {
      const g = e.target.closest('g[data-t]'); if (!g) { tip.style.opacity = 0; return; }
      const k = svg.getBoundingClientRect().width / svg.viewBox.baseVal.width;
      tip.textContent = g.dataset.t; tip.style.left = (+g.dataset.x * k) + 'px'; tip.style.top = '14px'; tip.style.opacity = 1;
    });
    c.addEventListener('pointerleave', () => tip.style.opacity = 0);
  });
}

function demo() {
  const ids = Object.keys(TITRES); const now = Date.now(); const noeuds = []; let c = 0;
  const pl = ['ios', 'ios', 'android', 'ordi'];
  function add(p, g, t0) { const v = 'd' + (c++); const n = { v, p, g, t: new Date(t0).toISOString(), pl: pl[c % 4], d: 0 }; noeuds.push(n); return n; }
