nt de couper, pour que les couches se tiennent."],"notes":["Meilleure le lendemain, réchauffée ou même tiède.","Égoutter la mozzarella et la sécher dans du papier : elle rend moins d'eau. Ou prends directement de la mozzarella à gratiner, celle des pizzas : elle rend moins d'eau, elle est moins spongieuse, plus filante et plus fondante."],"courses":[["Aubergine","fl",[0]],["Tomates concassées","se",[1]],["Oignon","fl",[2]],["Ail","fl",[3]],["Basilic","fl",[4]],["Mozzarella","fr",[5]],["Parmesan","fr",[6]],["Huile d'olive","se",[7]],["Sel","ep",[8]],["Poivre","ep",[8]]],"shop":null,"img":{"s":"img/parmigiana-d-aubergines-s-25c8d2.webp","l":"img/parmigiana-d-aubergines-25c8d2.webp","c":"#82756b"}},{"id":"porc-braise-au-soja","t":"Porc braisé au soja","e":"🥘","type":"Plat","base":["Porc"],"orig":["Asie"],"saison":["Automne","Hiver"],"effort":"Plus d'1 h","pantheon":false,"intro":"","tip":"Réduire jusqu'à ce que la sauce laque le porc ; pour aller vite, sortir le porc et réduire la sauce seule à feu vif.","serves":"4 portions (ou 8 gua bao)","n":4,"ingr":[{"group":null,"items":["500 g de poitrine de porc fraîche (non fumée, non salée)","4 gousses d'ail émincées","3 cm de gingembre en julienne","5 c. à soupe de sauce soja (~75 ml)","4 c. à soupe de sucre roux (~50 g)","1 bâton de cannelle","1 à 2 étoiles de badiane","Eau, à hauteur"]}],"steps":["**Couper le porc** en gros lardons, une belle bouchée chacun.","**Saisir en cocotte** jusqu'à ce que les morceaux soient dorés sur toutes les faces.","**Ajouter l'ail et le gingembre**, puis la sauce soja et le sucre roux.","**Mouiller à hauteur** d'eau, ajouter le bâton de cannelle et la badiane.","**Cuire à couvert, à feu doux**, au moins 1 h.","**Réduire à découvert** jusqu'à ce que la sauce nappe. Pour aller plus vite : sortir le porc, réduire la sauce seule à feu vif, puis remettre le porc et bien l'enrober."],"notes":["La poitrine perd environ un tiers de son poids à la cuisson : 500 g cru donnent ~350 g de porc braisé.","À servir avec du riz blanc, ou en garniture de [[Gua bao au porc braisé]]."],"courses":[["Poitrine de porc","fr",[0]],["Ail","fl",[1]],["Gingembre","fl",[2]],["Sauce soja","se",[3]],["Sucre","se",[4]],["Cannelle","ep",[5]],["Badiane","ep",[6]]],"shop":null,"img":{"s":"img/porc-braise-au-soja-s-1557b2.webp","l":"img/porc-braise-au-soja-1557b2.webp","c":"#905e43"}},{"id":"pot-au-feu","t":"Pot-au-feu","e":"🍲","type":"Plat","base":["Boeuf"],"orig":["France"],"saison":["Hiver"],"effort":"Plus d'1 h","pantheon":false,"intro":"","tip":"Départ à l'eau froide, et jamais d'ébullition franche : un vrai bouillon émulsionne le gras et trouble définitivement. Les légumes entrent en décalé, pas tous au début.","serves":"6 personnes","n":6,"ingr":[{"group":null,"items":["1,5 kg de bœuf à pot-au-feu (jarret, paleron, plat de côtes)","3 os à moelle","6 carottes","4 poireaux","4 navets","2 branches de céleri","2 oignons","4 clous de girofle","3 gousses d'ail","2 feuilles de laurier","Quelques branches de thym","1 c. à soupe de poivre en grains","Gros sel","8 pommes de terre","Pour servir : cornichons, moutarde"]}],"steps":["**Départ à l'eau froide.** Mettre la viande dans un grand faitout, couvrir largement d'eau froide, monter doucement. L'eau froide fait sortir les impuretés et donne un bouillon de goût.","**Écumer** patiemment pendant les 20 premières minutes, jusqu'à ce que la surface soit nette. C'est ce qui décide de la limpidité du bouillon.","**Aromates.** Oignons coupés en deux et piqués des clous de girofle, ail, laurier, thym, céleri, poivre en grains, gros sel.","**Frémir 3 h à découvert.** Petits bouillons en surface, jamais d'ébullition franche : une ébullition émulsionne le gras et trouble le bouillon définitivement.","**Légumes en décalé.** Carottes et navets la dernière heure, poireaux ficelés les 30 dernières minutes. Tout ensemble depuis le début donne de la bouillie.","**Pommes de terre à part**, cuites dans une louche de bouillon. Dans le faitout, leur amidon le rend trouble.","**Os à moelle** pochés 20 min à la fin, sel dessus.","**Servir** : le bouillon en premier, puis la viande et les légumes, cornichons et moutarde à côté."],"notes":["Un mélange de morceaux vaut mieux qu'un seul : le jarret pour la gélatine, le paleron pour le moelleux, le plat de côtes pour le gras.","Ne saler qu'à moitié au départ — 3 h de réduction concentrent tout.","Meilleur réchauffé le lendemain. Le bouillon se dégraisse à froid : le gras figé se retire à la cuillère."],"courses":[["Bœuf à pot-au-feu","fr",[0]],["Os à moelle","fr",[1]],["Carotte","fl",[2]],["Poireau","fl",[3]],["Navet","fl",[4]],["Céleri branche","fl",[5]],["Oignon","fl",[6]],["Clou de girofle","ep",[7]],["Ail","fl",[8]],["Laurier","ep",[9]],["Thym","ep",[10]],["Poivre","ep",[11]],["Sel","ep",[12]],["Pommes de terre","fl",[13]],["Cornichons","se",[14]],["Moutarde","se",[14]]],"shop":null,"img":null},{"id":"potimarron-farci-au-mont-d-or","t":"Potimarron farci au Mont d'Or","e":"🎃","type":"Plat","base":["Veggie","Fromage"],"orig":["France"],"saison":["Automne","Hiver"],"effort":"Normal","pantheon":false,"intro":"","tip":"Deux cuissons : le potimarron rôtit seul 35-40 min, le Mont d'Or n'entre que pour les 15-20 dernières. Et couper un chapeau large à l'ouverture, sinon le fromage ne passe pas.","serves":"4 personnes","n":4,"ingr":[{"group":null,"items":["1 potimarron de 1,2 à 1,5 kg","1 Mont d'Or de 500 g (la petite boîte)","2 gousses d'ail","3 c. à soupe d'huile d'olive","1 c. à café de paprika fumé","4 ou 5 branches de thym","Gros sel, poivre du moulin","½ baguette, pour les croûtons"]}],"steps":["**Préchauffer à 200 °C**, chaleur tournante.","**Ouvrir le potimarron.** Le brosser sous l'eau et le sécher. Couper un chapeau **large** autour de la tige — trop étroit, le fromage ne passera pas. Évider graines et filaments à la cuillère sans entamer la chair.","**Assaisonner l'intérieur.** Huile d'olive, gros sel, paprika fumé, les branches de thym et une gousse d'ail écrasée en chemise. Frotter les parois.","**Première cuisson : 35 à 40 min**, chapeau posé à côté dans le plat. La chair doit se laisser percer au couteau tout en tenant encore.","**Installer le fromage.** Le sortir de sa boîte, retirer la croûte du dessus, le poser entier dans le potimarron. S'il est trop large, le couper en gros quartiers et les empiler.","**Seconde cuisson : 15 à 20 min**, jusqu'à ce que le fromage bouillonne sur les bords.","**Les croûtons**, pendant ce temps. Trancher la baguette, filet d'huile d'olive, 5 min au four, puis frotter chaque tranche à l'ail cru.","**Servir dans le plat**, poivre au moulin. On trempe les croûtons, puis on racle la chair contre la paroi à la cuillère."],"notes":["**Ne pas éplucher** : la peau du potimarron se mange, et c'est elle qui tient la structure.","Choisir un potimarron trapu et stable. Raser légèrement la base au couteau s'il bascule dans le plat.","Le Mont d'Or est saisonnier : vendu du 10 septembre au 10 mai.","Version carnée : 150 g de lardons fumés revenus à la poêle, déposés au fond avant le fromage."],"courses":[["Potimarron","fl",[0]],["Mont d'Or","fr",[1]],["Ail","fl",[2]],["Huile d'olive","se",[3]],["Paprika fumé","ep",[4]],["Thym","ep",[5]],["Sel","ep",[6]],["Poivre","ep",[6]],["Baguette","au",[7]]],"shop":null,"img":null},{"id":"poulet-roti","t":"Poulet rôti","e":"🍗","type":"Plat","base":["Poulet"],"orig":["France"],"saison":["Toute saison"],"effort":"Normal","pantheon":false,"intro":"","tip":"180 °C maximum, et l'arroser au moins 5 ou 6 fois : c'est ce qui le garde juteux.","serves":"4 à 6 portions","n":4,"ingr":[{"group":null,"items":["1 poulet entier (≈ 1,6 kg)","80 à 100 g de beurre salé","4 à 5 c. à soupe de sauce soja","Huile d'olive (sur le poulet et sur les légumes)","Un petit fond d'eau"]},{"group":"Garniture","items":["800 g de pommes de terre, en morceaux","2 oignons, en quartiers","½ potimarron, en cubes (non épluché)","250 g de champignons de Paris, entiers ou coupés en deux","Céleri (facultatif)"]}],"steps":["**Garnir le plat.** Le poulet au centre ; autour, pommes de terre, oignons, potimarron, champignons et céleri, avec un filet d'huile d'olive sur les légumes.","**Beurrer.** Beaucoup de beurre salé sur le poulet : il va fondre et servir à l'arroser.","**Assaisonner.** Une bonne dose de sauce soja et un filet d'huile d'olive par-dessus.","**Mouiller.** Juste un petit fond d'eau dans le plat.","**Cuire doucement.** 180 °C maximum, entre 1 h et 1 h 30, jusqu'à ce que la peau soit bien dorée.","**Arroser, arroser.** Sortir le plat au moins 5 ou 6 fois pendant la cuisson. Incliner le plat pour faire un creux sur un bord, récupérer le jus et en arroser le poulet. C'est le secret : une chair tendre et juteuse, pas du tout sèche."],"notes":["Le four doux est la clé : au-delà de 180 °C, le beurre et la soja brûlent avant que le poulet soit cuit.","La sauce soja caramélise : si le dessus fonce trop vite, poser une feuille d'aluminium sur le poulet."],"courses":[["Poulet entier","fr",[0]],["Beurre salé","fr",[1]],["Sauce soja","se",[2]],["Huile d'olive","se",[3]],["Pommes de terre","fl",[5]],["Oignon","fl",[6]],["Potimarron","fl",[7]],["Champignons de Paris","fl",[8]]],"shop":null,"img":{"s":"img/poulet-roti-s-0658fb.webp","l":"img/poulet-roti-0658fb.webp","c":"#6d5646"}},{"id":"pudding-de-tapioca-au-lait-de-coco","t":"Pudding de tapioca au lait de coco","e":"🥥","type":"Dessert","base":["Veggie"],"orig":["Asie"],"saison":["Toute saison"],"effort":"Normal","pantheon":false,"intro":"","tip":"Cuisson 100 % lait, zéro eau : feu très doux et on racle le fond sans arrêt, sinon ça attache. La moitié du lait de coco s'ajoute hors du feu pour garder le parfum.","serves":"6 portions","n":6,"ingr":[{"group":null,"items":["150 g de perles de tapioca (petites, ~2 mm)","450 ml de lait entier","400 ml de lait de coco (1 boîte), à séparer en deux fois","55 g de sucre de canne blond","¼ c. à café de sel fin","1 c. à café d'extrait de vanille","100 ml de lait en réserve, pour détendre"]}],"steps":["**Ne pas rincer les perles.** L'amidon en surface est ce qui lie le pudding — sans eau de cuisson, c'est lui qui fait tout le travail.","**Chauffer la base.** Dans une casserole à fond épais : le lait, la moitié du lait de coco, le sel et la vanille. Feu moyen jusqu'au frémissement, sans bouillir.","**Cuire les perles.** Verser en pluie en fouettant, baisser à feu très doux, cuire ~20 min en remuant quasi sans arrêt et en raclant le fond. Les perles deviennent translucides avec un point blanc au centre.","**Sucrer.** Ajouter le sucre et poursuivre 5 à 7 min, jusqu'à disparition des points blancs. Le sucre ralentit l'hydratation, d'où l'ajout tardif.","**Monter au coco.** Hors du feu, incorporer le reste du lait de coco, bien froid.","**Refroidir.** Tiédir 20 min à couvert, puis au frigo 2 h minimum. Détendre avec le lait réservé si c'est trop compact."],"notes":["Ça épaissit **beaucoup** en refroidissant. À la casserole, le mélange doit sembler nettement trop liquide — c'est normal.","Ratio de base : 1 volume de perles pour 5 à 6 de liquide.","Une pincée de sel et la vanille réveillent le coco : sans eux, c'est un peu plat.","Excellent avec de la mangue fraîche et un zeste de citron vert au moment de servir.","Au service, on peut ajouter de la mangue ou de la banane coupée dessus."],"courses":[["Perles de tapioca","se",[0]],["Lait de coco","se",[2]],["Lait entier","fr",[1]],["Sucre","se",[3]],["Sel","ep",[4]],["Extrait de vanille","se",[5]]],"shop":null,"img":null},{"id":"quiche-brocoli-jambon-gorgonzola","t":"Quiche brocoli jambon gorgonzola","e":"🥦","type":"Plat","base":["Porc","Fromage","Pain & pâte"],"orig":["Fusion maison"],"saison":["Automne","Hiver"],"effort":"Normal","pantheon":false,"intro":"","tip":"Le brocoli se précuit, à la vapeur de préférence, sans trop le cuire, puis bien égoutté et séché : sinon le mélange œufs-crème rend de l'eau. Pas de sel : le jambon et le gorgonzola s'en chargent.","serves":"6 parts","n":6,"ingr":[{"group":null,"items":["1 pâte brisée","1 brocoli (≈ 400 g de bouquets)","4 tranches de jambon blanc","120 g de gorgonzola","3 œufs","200 ml de crème fraîche","150 ml de lait entier","Noix de muscade","Poivre"]},{"group":"Pour servir","items":["2 poignées de roquette","Un filet d'huile d'olive"]}],"steps":["**Préchauffer à 200 °C.**","**Foncer et cuire à blanc.** Pâte dans le moule, fond piqué, 15 min avec des poids sur du papier cuisson.","**Précuire le brocoli.** De préférence à la vapeur, 4 à 5 min : il doit rester un peu ferme. Sinon, bouquets 3 min dans l'eau bouillante salée, puis eau glacée. Bien égoutter et sécher dans un torchon.","**Mélange œufs-crème.** Battre les œufs, la crème et le lait, muscade et poivre. Pas de sel.","**Garnir.** Jambon en lanières au fond, brocoli par-dessus, gorgonzola émietté entre les bouquets. Verser le mélange œufs-crème.","**Cuire 30 à 35 min à 180 °C**, jusqu'à ce que le dessus soit bien doré et que le centre tremble encore légèrement.","**Tiédir 10 min** avant de couper. Servir avec la roquette assaisonnée d'huile d'olive."],"notes":["Même ratio que la [[Quiche lorraine]] : 3 œufs pour 350 ml de liquide."],"courses":[["Pâte brisée","fr",[0]],["Brocoli","fl",[1]],["Jambon blanc","fr",[2]],["Gorgonzola","fr",[3]],["Œufs","fr",[4]],["Crème fraîche","fr",[5]],["Lait entier","fr",[6]],["Noix de muscade","ep",[7]],["Poivre","ep",[8]],["Roquette","fl",[9]],["Huile d'olive","se",[10]]],"shop":null,"img":{"s":"img/quiche-brocoli-jambon-gorgonzola-s-0d22a9.webp","l":"img/quiche-brocoli-jambon-gorgonzola-0d22a9.webp","c":"#736d58"}},{"id":"quiche-lorraine","t":"Quiche lorraine","e":"🥧","type":"Plat","base":["Porc","Pain & pâte"],"orig":["France"],"saison":["Toute saison"],"effort":"Normal","pantheon":false,"intro":"","tip":"Cuire le fond à blanc 15 min, et sortir la quiche quand le centre tremble encore — elle finit de prendre hors du four. Ratio : 3 œufs pour 350 ml de liquide.","serves":"6 personnes","n":6,"ingr":[{"group":null,"items":["1 pâte brisée","250 g de lardons fumés","3 œufs","200 ml de crème fraîche épaisse","150 ml de lait entier","Noix de muscade","Sel, poivre"]}],"steps":["**Préchauffer à 200 °C.**","**Foncer le moule**, piquer le fond à la fourchette, **cuire à blanc 15 min** avec des billes ou des légumes secs sur du papier. Sans cette étape, le mélange œufs-crème détrempe la pâte et le fond reste cru.","**Rissoler les lardons** à sec, sans matière grasse, jusqu'à ce qu'ils soient dorés. Les égoutter sur papier — leur gras rendrait le mélange gras et mou.","**Mélange œufs-crème.** Battre les œufs, ajouter crème et lait, muscade râpée, poivre généreux. Saler peu : les lardons salent déjà.","**Monter.** Lardons sur le fond précuit, mélange œufs-crème par-dessus, sans remplir à ras bord — ça gonfle.","**Cuire 30 à 35 min à 180 °C.** Le centre doit encore trembler légèrement quand on secoue le moule ; il finit de prendre hors du four.","**Tiédir 10 min** avant de couper."],"notes":["Le ratio qui marche : 3 œufs pour 350 ml de liquide. Plus d'œufs donne un flan caoutchouteux, moins donne une quiche qui ne prend pas.","Trop cuit, le mélange œufs-crème granule et rend de l'eau. Il faut sortir la quiche encore tremblante.","Se mange tiède, jamais brûlante."],"courses":[["Pâte brisée","fr",[0]],["Lardons fumés","fr",[1]],["Œufs","fr",[2]],["Crème fraîche","fr",[3]],["Lait entier","fr",[4]],["Noix de muscade","ep",[5]],["Sel","ep",[6]],["Poivre","ep",[6]]],"shop":null,"img":null},{"id":"ragu-a-la-bolognaise","t":"Ragù à la bolognaise","e":"🍅","type":"Base","base":["Boeuf"],"orig":["Italie"],"saison":["Automne","Hiver"],"effort":"Plus d'1 h","pantheon":false,"intro":"","tip":"Réduire la viande à sec avant de déglacer, puis mouiller comme une soupe et laisser réduire tout doucement, 4 à 8 h.","serves":"6 portions","n":6,"ingr":[{"group":null,"items":["600 g de viande hachée de bœuf","2 carottes","2 branches de céleri","2 oignons","3 gousses d'ail","3 c. à soupe d'huile d'olive","200 ml de vin blanc (ou rouge)","1 petite boîte de concentré de tomate (~70 g)","1 boîte de tomates concassées ou de pulpe (400 g)","1,5 à 2 L de bouillon (volaille, légumes, ou eau + 1 bouillon cube)","2-3 feuilles de laurier","Sel, poivre"]}],"steps":["**Soffritto.** Couper carottes, céleri et oignons vraiment tout petit, avec l'ail. Faire suer dans la casserole à l'huile d'olive.","**Ajouter la viande hachée.** Elle lâche beaucoup de jus : laisser réduire jusqu'à ce qu'il n'y ait plus de liquide.","**Déglacer au vin** en grattant tous les sucs du fond.","**Ajouter la tomate.** Concentré et tomates concassées, bien mélanger.","**Mouiller au bouillon**, à peu près deux fois la hauteur de la préparation, comme une soupe. Ajouter le laurier.","**Écumer à feu fort**, puis passer à feu doux.","**Réduire le plus longtemps possible.** 2 h minimum, idéalement 4 à 8 h tout doucement, jusqu'à obtenir une vraie consistance de ragoût."],"notes":["Vin blanc ou rouge : les deux marchent, le blanc est plus proche de la recette bolognaise d'origine.","Saler en fin de cuisson : la réduction concentre le sel du bouillon.","Se congèle très bien. Vu le temps de cuisson, autant en faire une double dose.","Sert de base aux [[Lasagnes à la bolognaise]]."],"courses":[["Viande hachée de bœuf","fr",[0]],["Carotte","fl",[1]],["Céleri branche","fl",[2]],["Oignon","fl",[3]],["Ail","fl",[4]],["Huile d'olive","se",[5]],["Vin blanc","se",[6]],["Concentré de tomate","se",[7]],["Tomates concassées","se",[8]],["Bouillon de volaille","se",[9]],["Laurier","ep",[10]],["Sel","ep",[11]],["Poivre","ep",[11]]],"shop":null,"img":null},{"id":"ragu-birria","t":"Ragù Birria","e":"🌶️","type":"Plat","base":["Boeuf","Pâtes & riz"],"orig":["Amériques","Fusion maison"],"saison":["Hiver"],"effort":"Plus d'1 h","pantheon":false,"intro":"","tip":"Griller les piments sans les brûler, et garder l'huile rouge de surface pour le service.","serves":"6 portions","n":6,"ingr":[{"group":"Birria","items":["1,2 kg de paleron de bœuf, en gros cubes","6 piments guajillo","3 piments ancho","1 oignon","5 gousses d'ail","2 tomates","2 c. à soupe de concentré de tomate","2 c. à soupe de vinaigre de vin","1 bâton de cannelle","3 clous de girofle","1 c. à café de cumin","1 c. à café d'origan","3 feuilles de laurier","2 c. à soupe d'huile d'olive","Sel, poivre"]},{"group":"Pour servir","items":["500 g de rigatoni","80 g de parmesan râpé","1 oignon rouge, finement ciselé","1 bouquet de coriandre","2 citrons verts"]}],"steps":["**Préparer les piments.** Retirer queues et graines. Les griller à sec 1 min de chaque côté dans une poêle chaude, jusqu'à ce qu'ils sentent bon sans noircir. Les couvrir d'eau bouillante 15 min.","**Mixer la sauce.** Mixer les piments égouttés avec l'oignon, l'ail, les tomates, le concentré, le vinaigre, le cumin, l'origan et 250 ml de leur eau de trempage, jusqu'à obtenir une sauce lisse. Passer au tamis pour une texture soyeuse.","**Saisir la viande.** Saler et poivrer le paleron, le saisir par petites quantités dans l'huile d'olive jusqu'à ce qu'il soit bien coloré sur toutes les faces.","**Braiser.** Remettre toute la viande dans la cocotte, verser la sauce, ajouter cannelle, girofle, laurier et de l'eau à hauteur. Couvrir et cuire à 160 °C au four (ou à petit feu), 3 h 30 à 4 h, jusqu'à ce que la viande s'effiloche à la fourchette.","**Effilocher.** Sortir la viande et l'effilocher. Retirer cannelle, girofle et laurier. Dégraisser le jus en récupérant la graisse rouge de surface dans un bol : c'est l'huile de birria.","**Réduire en ragù.** Remettre la viande dans le jus et faire réduire à feu moyen jusqu'à ce que ça nappe, comme un ragù. Rectifier en sel.","**Les pâtes.** Cuire les rigatoni très al dente, les finir 2 min dans le ragù avec une louche d'eau de cuisson.","**Servir** avec le parmesan, l'oignon rouge, la coriandre, un filet d'huile de birria et un quartier de citron vert. Un bol de consommé chaud à côté pour tremper."],"notes":["Les piments séchés se trouvent en épicerie mexicaine ou en ligne. Guajillo et ancho sont doux : ils donnent la couleur et le fruité, pas le piquant.","Pour du piquant, ajouter 2-3 piments de árbol à l'étape 1.","Meilleur le lendemain ; se congèle très bien."],"courses":[["Paleron de bœuf","fr",[0]],["Piments guajillo","ep",[1]],["Piments ancho","ep",[2]],["Oignon","fl",[3,17]],["Ail","fl",[4]],["Tomate","fl",[5,6]],["Concentré de tomate","se",[6]],["Vinaigre de vin","se",[7]],["Cannelle","ep",[8]],["Clou de girofle","ep",[9]],["Cumin","ep",[10]],["Origan","ep",[11]],["Laurier","ep",[12]],["Huile d'olive","se",[13]],["Sel","ep",[14]],["Poivre","ep",[14]],["Rigatoni","se",[15]],["Parmesan","fr",[16]],["Oignon rouge","fl",[17]],["Coriandre","fl",[18]],["Citron vert","fl",[19]]],"shop":null,"img":null},{"id":"raviolis-wonton","t":"Raviolis wonton","e":"🥟","type":"Plat","base":["Poulet","Pain & pâte"],"orig":["Asie"],"saison":["Toute saison"],"effort":"Plus d'1 h","pantheon":false,"intro":"","tip":"Pocher une boulette témoin avant de monter : c'est le seul moment où l'assaisonnement de la farce est rattrapable. Et garder les pâtes sous un torchon humide, elles sèchent en quelques minutes.","serves":"~50 raviolis","n":50,"ingr":[{"group":null,"items":["1 paquet de pâtes à wonton (carrés, ~50 feuilles)","1 kg de hauts de cuisse de poulet, soit ~750 g une fois désossés et sans peau","2 c. à soupe d'huile de sésame","3 c. à soupe de sauce soja","1 bouquet de coriandre","4 ou 5 cébettes","3 gousses d'ail","5 cm de gingembre frais","Un bol d'eau, pour souder les pâtes"]}],"steps":["**Préparer le poulet.** Désosser les hauts de cuisse, retirer la peau, couper la chair en gros cubes.","**Mixer.** Au robot, avec l'huile de sésame et la sauce soja. Par à-coups plutôt qu'en continu : on veut une farce qui garde du grain, pas une purée.","**Ajouter le vert et les aromates.** Coriandre et cébette hachées, ail et gingembre râpés. Mélanger à la main, sans mixer cette fois.","**Goûter la farce.** Pocher une petite boulette 2 min à l'eau bouillante et l'assaisonner à ce moment-là — rajouter du soja si c'est plat. C'est le seul moment où c'est rattrapable.","**Monter.** Une cuillère à café de farce au centre du carré, un doigt mouillé sur deux bords, replier en triangle en chassant l'air, puis ramener les deux pointes de la base l'une sur l'autre et les souder. Garder le paquet de pâtes sous un torchon humide, elles sèchent vite.","**Cuire.** 5 min à l'eau bouillante — ils remontent à la surface quand c'est prêt — ou 10 min au panier vapeur sur du papier cuisson perforé."],"notes":["**Congélation.** Ce qu'on ne mange pas part cru, espacé sur un plateau au congélateur, puis en sac une fois durs. Ils se cuisent sans décongeler, en ajoutant 2 min.","Le haut de cuisse plutôt que le blanc : la farce reste moelleuse, un blanc mixé ressort sec.","La vapeur donne une pâte plus ferme et une farce plus concentrée, l'eau bouillante une texture plus souple.","La même farce sert pour le [[Chou farci]]."],"courses":[["Pâtes à wonton","fr",[0]],["Hauts de cuisse de poulet","fr",[1]],["Huile de sésame","se",[2]],["Sauce soja","se",[3]],["Coriandre","fl",[4]],["Cébette","fl",[5]],["Ail","fl",[6]],["Gingembre","fl",[7]]],"shop":null,"img":{"s":"img/raviolis-wonton-s-14c6ec.webp","l":"img/raviolis-wonton-14c6ec.webp","c":"#94896b"}},{"id":"risotto-aux-asperges","t":"Risotto aux asperges","e":"🍚","type":"Plat","base":["Veggie","Pâtes & riz"],"orig":["Italie"],"saison":["Printemps"],"effort":"Normal","pantheon":false,"intro":"","tip":"Faire un bouillon avec les épluchures et les talons d'asperges, et le garder frissonnant à côté. Mantecare hors du feu, avec du beurre très froid : c'est ça le crémeux, pas la crème.","serves":"4 personnes","n":4,"ingr":[{"group":null,"items":["320 g de riz arborio ou carnaroli","1 botte d'asperges vertes (500 g)","1 échalote","150 ml de vin blanc sec","1,2 L de bouillon de volaille","60 g de parmesan","50 g de beurre bien froid","2 c. à soupe d'huile d'olive","1 citron","Sel, poivre"]}],"steps":["**Préparer les asperges.** Casser les talons là où ils cèdent, éplucher le bas des tiges. Garder épluchures et talons. Couper les pointes sur 4 cm, le reste des tiges en rondelles.","**Infuser le bouillon.** Y jeter épluchures et talons, laisser frémir 15 min, filtrer. Maintenir chaud — un bouillon froid casse la cuisson du riz à chaque louche.","**Blanchir les pointes** 2 min dans ce bouillon, les sortir et les réserver dans l'eau glacée.","**Suer l'échalote** ciselée dans l'huile d'olive, sans coloration.","**Nacrer le riz** 2 min en remuant : les grains deviennent translucides sur les bords. Étape courte mais décisive, c'est elle qui fait que le riz tient.","**Déglacer au vin blanc**, laisser absorber entièrement.","**Ajouter le bouillon louche par louche**, en remuant, chaque fois que le précédent est absorbé. 18 min environ. Les rondelles de tige entrent à mi-cuisson.","**Mantecare.** Hors du feu, beurre très froid et parmesan râpé, battre vigoureusement 1 min. Le risotto doit couler lentement dans l'assiette, pas tenir en tas.","**Finir** avec les pointes réchauffées, du zeste de citron, du poivre."],"notes":["Garde le bouillon frémissant à côté : froid, il casse la cuisson du riz à chaque louche.","Un risotto attend mal. Le servir dans les deux minutes, ou le riz continue d'absorber et se fige.","Ne pas rincer le riz. Son amidon est tout l'intérêt."],"courses":[["Riz arborio","se",[0]],["Asperges vertes","fl",[1]],["Échalote","fl",[2]],["Vin blanc","se",[3]],["Bouillon de volaille","se",[4]],["Parmesan","fr",[5]],["Beurre","fr",[6]],["Huile d'olive","se",[7]],["Citron","fl",[8]],["Sel","ep",[9]],["Poivre","ep",[9]]],"shop":null,"img":{"s":"img/risotto-aux-asperges-s-d2bb30.webp","l":"img/risotto-aux-asperges-d2bb30.webp","c":"#6e6658"}},{"id":"roti-de-porc-puree-sauce-moutarde","t":"Rôti de porc, purée, sauce moutarde","e":"🥩","type":"Plat","base":["Porc"],"orig":["France"],"saison":["Automne","Hiver"],"effort":"Plus d'1 h","pantheon":false,"intro":"","tip":"La moutarde s'ajoute hors du feu, sinon elle devient amère. Pour la purée : le beurre froid d'abord, le lait chaud ensuite, et jamais de robot.","serves":"6 personnes","n":6,"ingr":[{"group":null,"items":["1,2 kg de rôti de porc dans l'échine","2 oignons","3 gousses d'ail","Quelques branches de thym","2 feuilles de laurier","150 ml de vin blanc sec","200 ml de bouillon de volaille","3 c. à soupe de moutarde","150 ml de crème fraîche","2 c. à soupe d'huile d'olive","Sel, poivre"]},{"group":"Purée","items":["1,2 kg de pommes de terre à chair farineuse","150 g de beurre bien froid","250 ml de lait entier","Noix de muscade"]}],"steps":["**Sortir le rôti 1 h avant**, le saler généreusement sur toutes les faces.","**Colorer** dans une cocotte, huile d'olive, feu vif, toutes les faces. Réserver.","**Le fond.** Oignons émincés dans la même cocotte, ail en chemise, thym, laurier. Déglacer au vin blanc, gratter les sucs.","**Cuisson douce.** Rôti sur ce lit, bouillon versé autour, couvercle, **1 h 15 à 150 °C**. Une cuisson lente évite au porc de se contracter et de sécher.","**Reposer 15 min** sous une feuille d'aluminium, hors du four. Non négociable : à chaud, tout le jus part sur la planche.","**Sauce.** Filtrer le jus, le faire réduire de moitié, ajouter la crème, puis la moutarde **hors du feu**. Bouillie, la moutarde devient amère et perd son piquant.","**Purée.** Pommes de terre cuites entières avec la peau, départ eau froide salée, 30 min. Peler chaudes, passer au presse-purée ou au moulin. Beurre froid en morceaux d'abord, en travaillant à la spatule, puis le lait chaud petit à petit. Muscade, sel.","**Trancher** le rôti épais, nappé de sauce, purée à côté."],"notes":["L'échine a le gras qu'il faut pour rester moelleuse ; le filet, plus maigre, sèche facilement.","Le beurre avant le lait : la matière grasse enrobe l'amidon et empêche la purée de devenir élastique.","Jamais de robot pour la purée — les lames éclatent l'amidon et donnent de la colle."],"courses":[["Rôti de porc","fr",[0]],["Oignon","fl",[1]],["Ail","fl",[2]],["Thym","ep",[3]],["Laurier","ep",[4]],["Vin blanc","se",[5]],["Bouillon de volaille","se",[6]],["Moutarde","se",[7]],["Crème fraîche","fr",[8]],["Huile d'olive","se",[9]],["Pommes de terre","fl",[11]],["Beurre","fr",[12]],["Lait entier","fr",[13]],["Noix de muscade","ep",[14]],["Sel","ep",[10]],["Poivre","ep",[10]]],"shop":null,"img":null},{"id":"rouleaux-de-printemps-blt","t":"Rouleaux de printemps BLT","e":"🥬","type":"Entrée","base":["Porc"],"orig":["Asie","Fusion maison"],"saison":["Printemps","Été"],"effort":"Normal","pantheon":false,"intro":"","tip":"Épépiner les tomates, sinon le rouleau rend de l'eau et se déchire. Et sortir la galette de l'eau encore un peu raide : elle finit de s'assouplir toute seule.","serves":"8 rouleaux","n":8,"ingr":[{"group":null,"items":["8 galettes de riz (22 cm)","12 tranches de bacon","1 cœur de laitue","3 tomates","4 c. à soupe de mayonnaise","80 g de vermicelles de riz","1 botte de cébette","Quelques brins de coriandre","Sel, poivre"]}],"steps":["**Cuire le bacon** à la poêle jusqu'au vraiment croustillant, puis l'égoutter sur du papier absorbant. C'est le seul élément croquant du rouleau, il doit le rester.","**Vermicelles** : 3 min dans l'eau bouillante, rincer à l'eau froide, bien égoutter.","**Préparer le reste.** Tomates épépinées et coupées en lanières — les pépins et leur jus détrempent la galette. Laitue en chiffonnade, cébette en biseau.","**Réhydrater une galette** 10 secondes dans l'eau tiède. Elle doit ressortir encore un peu raide : elle continue de s'assouplir sur le plan de travail.","**Garnir.** Dans le tiers bas : mayonnaise, vermicelles, laitue, tomate, bacon, cébette, coriandre. Ne pas surcharger, c'est ce qui fait craquer les galettes.","**Rouler.** Un tour serré sur la garniture, rabattre les côtés, finir de rouler.","**Servir aussitôt**, ou couvrir d'un torchon humide en attendant."],"notes":["Les galettes collent entre elles. Poser chaque rouleau fini à distance des autres, ou les séparer d'un film.","Se prépare au maximum 2 h à l'avance, sous un torchon humide au frais. Au-delà, la galette durcit."],"courses":[["Galettes de riz","se",[0]],["Bacon","fr",[1]],["Laitue","fl",[2]],["Tomate","fl",[3]],["Mayonnaise","se",[4]],["Vermicelles de riz","se",[5]],["Cébette","fl",[6]],["Coriandre","fl",[7]],["Sel","ep",[8]],["Poivre","ep",[8]]],"shop":null,"img":null},{"id":"salade-de-fenouil-oignon-rouge-thon-et-capres","t":"Salade de fenouil, oignon rouge, thon et câpres","e":"🥗","type":"Entrée","base":["Poisson","Veggie"],"orig":["Moyen-Orient"],"saison":["Toute saison"],"effort":"Express","pantheon":false,"intro":"","tip":"Tout passe à la mandoline, fenouil comme oignon. C'est la finesse de coupe qui fait la salade.","serves":"2 portions","n":2,"ingr":[{"group":null,"items":["1 bulbe de fenouil","½ oignon rouge","½ bouquet de persil plat (ou de coriandre) haché","1 citron (le jus)","1 c. à café de harissa","3 c. à soupe d'huile d'olive","1 c. à soupe de câpres","1 boîte de thon à l'huile (~110 g égoutté)","Sel, poivre"]}],"steps":["**Passer le fenouil à la mandoline.** Lamelles fines.","**Faire de même avec l'oignon rouge.**","**Hacher le persil** — ou la coriandre, selon l'envie du jour.","**Tout assaisonner.** Jus de citron, harissa, huile d'olive, câpres et thon à l'huile égoutté.","**Mélanger.** Rectifier sel et poivre."],"notes":["Des câpres au sel : les rincer et les laisser dessaler 10 min. Au vinaigre : les égoutter, simplement.","Saler en tout dernier — le thon et les câpres en apportent déjà beaucoup.","Se garde 24 h au frigo, mais le fenouil rend de l'eau. Idéalement, assembler au moment de servir."],"courses":[["Fenouil","fl",[0]],["Oignon rouge","fl",[1]],["Persil plat","fl",[2]],["Citron","fl",[3]],["Harissa","se",[4]],["Huile d'olive","se",[5]],["Câpres","se",[6]],["Thon à l'huile","se",[7]],["Sel","ep",[8]],["Poivre","ep",[8]]],"shop":null,"img":null},{"id":"salade-de-lentilles-tomates-concombre-feta","t":"Salade de lentilles, tomates, concombre, feta","e":"🥗","type":"Entrée","base":["Légumineuses","Veggie","Fromage"],"orig":[],"saison":["Été"],"effort":"Express","pantheon":false,"intro":"","tip":"Des lentilles al dente, jamais trop cuites, et des tomates épépinées pour ne pas noyer la salade.","serves":"4 portions","n":4,"ingr":[{"group":null,"items":["250 g de lentilles vertes (type Puy)","1 L de bouillon de légumes ou de volaille","3 tomates (~300 g), épépinées et coupées en petits dés","½ concombre (~200 g), en dés","½ oignon doux, finement émincé (facultatif)","150 g de feta","½ bouquet de persil plat, ciselé","½ bouquet d'aneth, ciselé","1 citron (le jus, ~3 c. à soupe)","4 c. à soupe d'huile d'olive","1 c. à café de paprika fumé (ou piment fumé)","Sel, poivre"]}],"steps":["**Cuire les lentilles dans le bouillon.** Départ bouillon froid, puis ~20 min à frémissement. Elles doivent rester al dente : surcuites, elles s'écrasent au mélange.","**Rincer et refroidir.** Égoutter, rincer à l'eau froide pour stopper la cuisson, laisser refroidir complètement.","**Préparer les légumes.** Épépiner les tomates et les couper en petits dés (sans les pépins, la salade ne rend pas d'eau). Concombre en dés, oignon doux finement émincé.","**Ciseler les herbes.** Persil et aneth.","**Faire la vinaigrette.** Jus de citron, huile d'olive, paprika fumé, sel, poivre.","**Assembler.** Lentilles, légumes et herbes, arroser de vinaigrette, mélanger. Émietter la feta par-dessus au dernier moment."],"notes":["Le bouillon et la feta sont déjà salés : goûter avant de saler.","Se garde 2 jours au frais, mais ajouter la feta et les herbes au moment de servir si on prépare à l'avance."],"courses":[["Lentilles vertes","se",[0]],["Bouillon de volaille","se",[1]],["Tomate","fl",[2]],["Concombre","fl",[3]],["Oignon doux","fl",[4]],["Feta","fr",[5]],["Persil plat","fl",[6]],["Aneth","fl",[7]],["Citron","fl",[8]],["Huile d'olive","se",[9]],["Paprika fumé","ep",[10]],["Sel","ep",[11]],["Poivre","ep",[11]]],"shop":null,"img":null},{"id":"salade-de-pommes-de-terre-japonaise","t":"Salade de pommes de terre japonaise","e":"🥔","type":"Entrée","base":["Veggie"],"orig":["Asie"],"saison":["Toute saison"],"effort":"Express","pantheon":false,"intro":"","tip":"Kewpie ou mayo maison plutôt qu'une mayo classique (une mayo du commerce passe aussi), et écraser grossièrement : il doit rester de gros morceaux.","serves":"4 portions","n":4,"ingr":[{"group":null,"items":["800 g de pommes de terre","4 c. à soupe de mayonnaise japonaise (Kewpie), ou une mayonnaise maison","4 œufs","2 cébettes (ou ½ oignon jaune)","1 c. à soupe de vinaigre de riz","1 c. à café d'huile de sésame","1 c. à soupe de graines de sésame","½ concombre, pour les pickles","Sel, poivre"]}],"steps":["**Cuire les pommes de terre.** Épluchées, jusqu'à ce qu'elles soient tendres. Réserver.","**Écraser grossièrement.** Il doit rester de gros morceaux — c'est tout l'intérêt de la texture.","**Ajouter la mayonnaise.** Kewpie, ou une mayo maison : c'est elle qui donne le goût japonais. Une mayo du commerce passe aussi.","**Faire les œufs mollets.** Le jaune doit rester bien coulant (~6 min dans l'eau frémissante).","**Concasser une partie des œufs** et les incorporer à la salade.","**Ajouter la cébette** ciselée, ou de l'oignon jaune.","**Assaisonner.** Vinaigre de riz, huile de sésame, graines de sésame.","**Au moment de servir**, poser un pickle de concombre si on en a, et un œuf mollet coupé en deux sur le dessus."],"notes":["Pourquoi la Kewpie ? Elle est faite avec des jaunes seuls et du vinaigre de riz : plus riche et plus acidulée qu'une mayo française. Mais si t'as que de la mayo normale, ça passe aussi."],"courses":[["Pommes de terre","fl",[0]],["Mayonnaise japonaise (Kewpie)","se",[1]],["Œufs","fr",[2]],["Cébette","fl",[3]],["Vinaigre de riz","se",[4]],["Huile de sésame","se",[5]],["Graines de sésame","se",[6]],["Concombre","fl",[7]],["Sel","ep",[8]],["Poivre","ep",[8]]],"shop":null,"img":null},{"id":"salade-de-pommes-de-terre-olives-et-lardons","t":"Salade de pommes de terre, olives et lardons","e":"🫒","type":"Entrée","base":["Porc"],"orig":["Fusion maison"],"saison":["Été"],"effort":"Express","pantheon":false,"intro":"","tip":"Trois herbes fraîches : cébette, persil, aneth. Et du paprika fumé, pas du piment.","serves":"4 portions","n":4,"ingr":[{"group":null,"items":["800 g de pommes de terre","1 oignon rouge","100 g d'olives noires, kalamata si possible","150 g de lardons fumés","1 c. à café de paprika fumé","4 c. à soupe d'huile d'olive","½ citron (le jus)","2 cébettes","½ bouquet de persil plat","½ bouquet d'aneth","Sel, poivre"]}],"steps":["**Cuire les pommes de terre.** Épluchées, jusqu'à ce qu'elles soient tendres.","**Ajouter l'oignon rouge** coupé en lamelles.","**Ajouter les olives.** Noires ou kalamata — on fait avec ce qu'on a.","**Ajouter les lardons**, rissolés.","**Assaisonner.** Paprika fumé, huile d'olive, un tout petit peu de jus de citron.","**Finir aux herbes.** Cébette, persil, aneth."],"notes":["À ne pas confondre avec la [[Salade de pommes de terre japonaise]] : ici, zéro mayonnaise."],"courses":[["Pommes de terre","fl",[0]],["Oignon rouge","fl",[1]],["Olives noires (kalamata)","se",[2]],["Lardons fumés","fr",[3]],["Paprika fumé","ep",[4]],["Huile d'olive","se",[5]],["Citron","fl",[6]],["Cébette","fl",[7]],["Persil plat","fl",[8]],["Aneth","fl",[9]],["Sel","ep",[10]],["Poivre","ep",[10]]],"shop":null,"img":null},{"id":"salade-grecque","t":"Salade grecque","e":"🥗","type":"Entrée","base":["Veggie","Fromage"],"orig":[],"saison":["Été"],"effort":"Express","pantheon":false,"intro":"","tip":"La feta en bloc, émiettée au dernier moment, et on ne mélange pas : l'huile et l'origan se versent dessus.","serves":"4 en entrée","n":4,"ingr":[{"group":null,"items":["3 tomates bien mûres","1 concombre","1 poivron rouge","½ oignon rouge","12 olives kalamata","200 g de feta en bloc","1 c. à café d'origan séché","4 c. à soupe d'huile d'olive","1 c. à soupe de jus de citron jaune","Sel, poivre"]}],"steps":["**Couper en gros.** Tomates en quartiers, concombre en demi-rondelles épaisses, poivron en lanières, oignon rouge en fines rondelles.","**Assaisonner les légumes.** Sel, poivre, jus de citron, la moitié de l'huile. Mélanger délicatement.","**Ajouter les olives.**","**Finir à la feta.** L'émietter grossièrement sur le dessus, sans mélanger. Origan frotté entre les doigts, reste de l'huile d'olive."],"notes":["Saler peu : la feta et les olives salent déjà.","Se prépare au dernier moment, sinon les tomates et le concombre rendent leur eau."],"courses":[["Tomate","fl",[0]],["Concombre","fl",[1]],["Poivron","fl",[2]],["Oignon rouge","fl",[3]],["Olives noires (kalamata)","se",[]],["Feta","fr",[5]],["Origan","ep",[6]],["Huile d'olive","se",[7]],["Citron","fl",[8]],["Sel","ep",[9]],["Poivre","ep",[9]]],"shop":null,"img":{"s":"img/salade-grecque-s-a2f392.webp","l":"img/salade-grecque-a2f392.webp","c":"#90897b"}},{"id":"sandwich-focaccia","t":"Sandwich focaccia","e":"🥪","type":"Sandwich & snack","base":["Pain & pâte"],"orig":["Italie"],"saison":["Toute saison"],"effort":"Normal","pantheon":false,"intro":"","tip":"La mortadelle en voiles lâches, jamais à plat, et la burrata bien égouttée.","serves":"2 sandwichs","n":2,"ingr":[{"group":null,"items":["2 grands carrés de [[Focaccia]] (~12 × 12 cm)","150 g de mortadelle à la pistache, tranchée très fin","1 burrata (125 g)","3 c. à soupe de pesto rouge, pesto vert ou crème de pistache salée","1 poignée de roquette","Huile d'olive, poivre","Quelques pistaches concassées"]}],"steps":["**Réchauffer la focaccia** 5 min au four à 200 °C, puis l'ouvrir en deux dans l'épaisseur.","**Tartiner** la base de pesto (rouge ou vert) ou de crème de pistache.","**Mortadelle en voiles** : la poser en plis lâches, sans l'aplatir. C'est le volume qui fait la texture.","**Burrata** : la déchirer par-dessus, avec sa crème.","**Finir** : roquette assaisonnée d'un filet d'huile d'olive, pistaches concassées, poivre. Refermer et couper en deux."],"notes":["À manger tout de suite, la burrata détrempe la focaccia au bout de 30 min."],"courses":[["Farine","se",[]],["Levure boulangère","se",[]],["Sel","ep",[]],["Huile d'olive","se",[5]],["Romarin","fl",[]],["Mortadelle","fr",[1]],["Burrata","fr",[2]],["Pesto ou crème de pistache","se",[3]],["Roquette","fl",[4]],["Pistaches","se",[1,3,6]],["Poivre","ep",[5]]],"shop":null,"img":{"s":"img/sandwich-focaccia-s-3df693.webp","l":"img/sandwich-focaccia-3df693.webp","c":"#898a81"}},{"id":"saucisse-et-lentilles","t":"Saucisse et lentilles","e":"🥓","type":"Plat","base":["Porc","Légumineuses"],"orig":["France"],"saison":["Hiver"],"effort":"Normal","pantheon":false,"intro":"","tip":"Saler seulement en fin de cuisson, sinon les lentilles explosent et ça fait une purée. Et ne jamais piquer la Morteau : elle poche entière et parfume tout le plat.","serves":"4 personnes","n":4,"ingr":[{"group":null,"items":["1 saucisse de Morteau (ou 2 Montbéliard)","300 g de lentilles vertes du Puy","2 carottes","1 oignon","2 gousses d'ail","1 branche de céleri","2 clous de girofle","2 feuilles de laurier","Quelques branches de thym","1 c. à soupe d'huile d'olive","1 c. à soupe de moutarde","Sel, poivre"]}],"steps":["**Ne pas tremper les lentilles**, juste les rincer et trier. Le trempage les fait éclater.","**Suer la garniture.** Oignon, carottes et céleri en petits dés dans l'huile d'olive, 8 min à feu moyen.","**Ajouter les lentilles**, l'ail, le laurier, le thym, l'oignon piqué de girofle. Couvrir d'eau froide de trois centimètres. **Ne pas saler.**","**Poser la Morteau entière** par-dessus, non piquée. Elle va pocher et rendre son fumé dans les lentilles — c'est elle qui assaisonne le plat.","**Frémir 30 à 35 min**, à couvert, jusqu'à ce que les lentilles soient tendres sans se défaire.","**Saler seulement maintenant.** Salées trop tôt, les lentilles explosent et ça fait une purée.","**Sortir la saucisse**, la trancher épais, la remettre dans la casserole.","**Une cuillère de moutarde** hors du feu, poivre, et c'est prêt."],"notes":["Le sel en fin de cuisson : ça vaut pour toutes les légumineuses, sinon elles explosent et ça fait une purée.","Ne pas piquer la Morteau. Piquée, elle rend tout son gras et se dessèche.","Meilleur réchauffé. Si ça s'assèche trop, un peu d'eau chaude, jamais froide."],"courses":[["Saucisse de Morteau","fr",[0]],["Lentilles vertes","se",[1]],["Carotte","fl",[2]],["Oignon","fl",[3]],["Ail","fl",[4]],["Céleri branche","fl",[5]],["Clou de girofle","ep",[6]],["Laurier","ep",[7]],["Thym","ep",[8]],["Huile d'olive","se",[9]],["Moutarde","se",[10]],["Sel","ep",[11]],["Poivre","ep",[11]]],"shop":null,"img":{"s":"img/saucisse-et-lentilles-s-4105d4.webp","l":"img/saucisse-et-lentilles-4105d4.webp","c":"#5e5748"}},{"id":"tartare-de-thon","t":"Tartare de thon","e":"🍣","type":"Entrée","base":["Poisson"],"orig":["Asie"],"saison":["Toute saison"],"effort":"Express","pantheon":false,"intro":"Si t'as la flemme, va manger le Real ahi tuna bowl de chez [Canal Poké](https://deliveroo.fr/fr/menu/paris/paris-10eme-gare-de-lest/canal-poke).","tip":"Le thon bien froid, taillé au couteau en dés réguliers, et assaisonné juste avant de servir : l'acide du citron vert le cuit s'il attend.","serves":"2 portions en plat (4 en entrée)","n":2,"ingr":[{"group":null,"items":["300 g de thon frais","2 c. à soupe de sauce soja","1 c. à café d'huile de sésame","1 citron vert (zeste et 1 c. à soupe de jus)","1 cm de gingembre frais râpé","2 cébettes","½ bouquet de coriandre","1 c. à soupe de graines de sésame","150 g de riz jasmin, pour servir en plat"]}],"steps":["**Tailler le thon** au couteau bien aiguisé en dés de 1 cm. Réserver au frais.","**Préparer l'assaisonnement.** Soja, huile de sésame, gingembre râpé, jus de citron vert.","**Ciseler** la cébette et la coriandre.","**Mélanger au dernier moment.** Thon, assaisonnement, la moitié des herbes. 5 min au frais maximum.","**Servir.** Sur du riz tiède ou seul, avec le reste des herbes, le sésame et le zeste de citron vert."],"notes":["Le couteau, la planche et le bol bien froids : le thon reste ferme."],"courses":[["Thon frais","fr",[0]],["Sauce soja","se",[1]],["Huile de sésame","se",[2]],["Citron vert","fl",[3]],["Gingembre","fl",[4]],["Cébette","fl",[5]],["Coriandre","fl",[6]],["Graines de sésame","se",[7]],["Riz jasmin","se",[8]]],"shop":null,"img":{"s":"img/tartare-de-thon-s-366fa8.webp","l":"img/tartare-de-thon-366fa8.webp","c":"#91754e"}},{"id":"tarte-a-la-tomate","t":"Tarte à la tomate","e":"🍅","type":"Plat","base":["Veggie","Pain & pâte"],"orig":["France"],"saison":["Été"],"effort":"Normal","pantheon":false,"intro":"","tip":"Égoutter les rondelles de tomate salées 20 min sur du papier : c'est ce qui évite le fond détrempé.","serves":"6 parts","n":6,"ingr":[{"group":null,"items":["1 pâte brisée","5 à 6 tomates (≈ 700 g)","3 c. à soupe de moutarde","2 œufs","15 cl de crème fraîche","60 g de comté râpé","1 c. à café d'herbes de Provence","1 c. à soupe d'huile d'olive","Sel, poivre"]}],"steps":["**Égoutter les tomates.** Les couper en rondelles de 5 mm, les saler légèrement et les laisser 20 min sur du papier absorbant.","**Foncer et précuire.** Pâte brisée dans le moule, fond piqué, 10 min à 190 °C à blanc.","**Tartiner la moutarde** sur le fond précuit.","**Appareil.** Battre les œufs, la crème et le comté, poivrer. Verser sur la moutarde.","**Disposer les tomates** en rosace qui se chevauche. Herbes de Provence, poivre, un filet d'huile d'olive.","**Cuire** 35 à 40 min à 190 °C, jusqu'à ce que les tomates soient confites et légèrement noircies sur les bords.","**Tiédir 10 min** avant de couper."],"notes":["Se mange tiède ou froide, avec une salade verte."],"courses":[["Pâte brisée","fr",[0]],["Tomate","fl",[1]],["Moutarde","se",[2]],["Œufs","fr",[3]],["Crème fraîche","fr",[4]],["Comté","fr",[5]],["Herbes de Provence","ep",[6]],["Huile d'olive","se",[7]],["Sel","ep",[8]],["Poivre","ep",[8]]],"shop":null,"img":{"s":"img/tarte-a-la-tomate-s-b740e6.webp","l":"img/tarte-a-la-tomate-b740e6.webp","c":"#ab7d53"}},{"id":"tarte-aux-champignons","t":"Tarte aux champignons","e":"🍄","type":"Plat","base":["Veggie","Pain & pâte"],"orig":["France"],"saison":["Automne"],"effort":"Normal","pantheon":false,"intro":"","tip":"Concasser au couteau et sécher les champignons à fond avant la crème : c'est ce qui garde la mâche.","serves":"6 portions","n":6,"ingr":[{"group":null,"items":["≈ 1 kg de champignons de Paris, dont 2 ou 3 beaux gardés entiers pour le dessus","2 échalotes, ciselées","2 gousses d'ail, hachées","30 g de beurre","Thym (quelques branches pour l'appareil + une pincée pour le dessus)","20 cl de crème fraîche","1 c. à soupe de moutarde","1 œuf","1 pâte brisée","Huile d'olive (un coup de pinceau)","Sel, poivre"]}],"steps":["**Concasser les champignons au couteau.** En petits morceaux, jamais au mixeur : l'intérêt du plat, c'est de garder de la mâche. Réserver quelques beaux champignons entiers pour le dessus.","**Faire suer ail et échalotes.** Dans le beurre, à la poêle, sans coloration.","**Ajouter les champignons et saler.** Le sel les fait dégorger ; laisser cuire jusqu'à ce que toute l'eau rendue soit évaporée et que la préparation soit bien sèche. Ajouter le thym.","**Crémer.** Verser la crème et la moutarde, mélanger : c'est l'appareil.","**Laisser refroidir, puis lier à l'œuf.** L'œuf s'ajoute une fois l'appareil refroidi (sinon il cuit dans la poêle) ; il fixe l'appareil à la cuisson.","**Précuire la pâte à blanc.** Foncer le plat, piquer le fond, couvrir de papier cuisson et de poids. 15 min à 180 °C, puis retirer papier et poids.","**Garnir.** Étaler l'appareil sur le fond précuit.","**Couvrir de lamelles.** Trancher les champignons réservés et les superposer en rosace ou en rangs serrés sur toute la surface.","**Finir.** Un coup de pinceau d'huile d'olive sur les lamelles, un peu de thym saupoudré.","**Cuire.** Environ 20 minutes au four (~200 °C), sans trop cuire."],"notes":["1 kg de champignons rend beaucoup d'eau : bien attendre qu'elle soit évaporée avant la crème, sinon l'appareil détrempe la pâte."],"courses":[["Champignons de Paris","fl",[0]],["Échalote","fl",[1]],["Ail","fl",[2]],["Beurre","fr",[3]],["Thym","ep",[4]],["Crème fraîche","fr",[5]],["Moutarde","se",[6]],["Œufs","fr",[7]],["Pâte brisée","fr",[8]],["Huile d'olive","se",[9]]],"shop":null,"img":{"s":"img/tarte-aux-champignons-s-0bba44.webp","l":"img/tarte-aux-champignons-0bba44.webp","c":"#6a6556"}},{"id":"tartiflette","t":"Tartiflette","e":"🧀","type":"Plat","base":["Fromage","Porc"],"orig":["France"],"saison":["Hiver"],"effort":"Normal","pantheon":false,"intro":"","tip":"Faire sauter les pommes de terre précuites avant de monter le plat — c'est ça qui évite le gratin mou. Le reblochon coupé en deux, croûte vers le haut.","serves":"4 personnes","n":4,"ingr":[{"group":null,"items":["1,2 kg de pommes de terre à chair ferme","1 reblochon entier (450 g)","250 g de lardons fumés","2 oignons","100 ml de vin blanc sec","100 ml de crème fraîche","1 c. à soupe d'huile d'olive","Poivre"]}],"steps":["**Précuire les pommes de terre** 15 min à l'eau salée, départ eau froide. Elles doivent rester fermes — elles finissent au four. Les peler tièdes et les couper en rondelles épaisses.","**Rissoler les lardons** à sec, les réserver. Faire fondre les oignons émincés dans la graisse rendue, 10 min.","**Déglacer au vin blanc**, laisser réduire presque à sec. Le vin est ce qui empêche le plat de n'être que gras.","**Sauter les pommes de terre** à la poêle, huile d'olive, jusqu'à coloration sur les faces. C'est elle qui fait la différence entre une tartiflette et un gratin mou.","**Monter le plat.** Une couche de pommes de terre, lardons et oignons, poivre, la crème, puis le reste.","**Le reblochon.** Le couper en deux dans l'épaisseur, le poser **croûte vers le haut** sur le dessus. La croûte retient le fromage et dore.","**Cuire 25 à 30 min à 200 °C**, jusqu'à ce que le dessus soit doré et bouillonnant.","**Reposer 5 min** avant de servir."],"notes":["Ne pas saler : les lardons et le reblochon s'en chargent largement.","Des pommes de terre à chair ferme, obligatoirement. Une pomme de terre farineuse s'écrase et donne de la purée."],"courses":[["Pommes de terre","fl",[0]],["Reblochon","fr",[1]],["Lardons fumés","fr",[2]],["Oignon","fl",[3]],["Vin blanc","se",[4]],["Crème fraîche","fr",[5]],["Huile d'olive","se",[6]],["Poivre","ep",[7]]],"shop":null,"img":{"s":"img/tartiflette-s-4a96a3.webp","l":"img/tartiflette-4a96a3.webp","c":"#936b3c"}},{"id":"tatin-d-aubergine","t":"Tatin d'aubergine","e":"🍆","type":"Plat","base":["Veggie","Pain & pâte"],"orig":["France"],"saison":["Été"],"effort":"Normal","pantheon":false,"intro":"","tip":"Précuire les aubergines avant de les mettre sous la pâte, sinon elles rendent de l'eau.","serves":"4 portions (moule de 24 cm)","n":4,"ingr":[{"group":null,"items":["3 aubergines (~900 g)","1 pâte feuilletée pur beurre","3 c. à soupe d'huile d'olive","30 g de beurre","3 c. à soupe de miel","2 c. à soupe de vinaigre balsamique","2 gousses d'ail, émincées","4 branches de thym","Sel, poivre"]},{"group":"Farce","items":["100 g de feta","½ bouquet de menthe","30 g de pignons de pin","6 tomates séchées"]}],"steps":["**Précuire les aubergines.** En couper 2 en lanières dans la longueur (environ 1 cm d'épaisseur), et la troisième en cubes. Badigeonner d'huile d'olive, saler. Four à 200 °C, 20 min, jusqu'à ce qu'elles soient dorées et fondantes.","**Faire la farce.** Hacher grossièrement les cubes d'aubergine cuits. Mélanger avec la feta émiettée, la menthe ciselée, les pignons concassés et les tomates séchées coupées en petits morceaux. Poivrer.","**Faire le caramel.** Dans le moule (ou une poêle qui va au four), fondre beurre et miel jusqu'à ce que ça mousse et blondisse, 2-3 min. Hors du feu, ajouter le balsamique, l'ail et les feuilles de thym.","**Disposer les lanières** serrées sur le caramel, en les chevauchant.","**Étaler la farce** par-dessus, en tassant légèrement.","**Couvrir de pâte feuilletée**, rentrer les bords à l'intérieur du moule, piquer et faire 2-3 entailles pour la vapeur.","**Cuire** à 200 °C, 25 à 30 min, jusqu'à ce que la pâte soit bien dorée et gonflée.","**Retourner** après 5 min de repos : poser le plat de service dessus et renverser d'un coup."],"notes":["Précuire les aubergines est indispensable : crues sous la pâte, elles rendent de l'eau et la pâte reste molle.","Retourner tiède, pas froid : le caramel figé colle au moule.","Se sert chaud ou tiède, avec une salade verte."],"courses":[["Aubergine","fl",[0]],["Pâte feuilletée","fr",[1]],["Huile d'olive","se",[2]],["Beurre","fr",[1,3]],["Miel","se",[4]],["Vinaigre balsamique","se",[5]],["Ail","fl",[6]],["Thym","ep",[7]],["Feta","fr",[9]],["Menthe","fl",[10]],["Pignons de pin","se",[11]],["Tomates séchées","se",[12]],["Sel","ep",[8]],["Poivre","ep",[8]]],"shop":null,"img":{"s":"img/tatin-d-aubergine-s-01575b.webp","l":"img/tatin-d-aubergine-01575b.webp","c":"#877a6c"}},{"id":"tourte-au-poulet","t":"Tourte au poulet","e":"🥧","type":"Plat","base":["Poulet","Pain & pâte"],"orig":["France"],"saison":["Automne","Hiver"],"effort":"Plus d'1 h","pantheon":false,"intro":"","tip":"Le bouillon cube de volaille dans la béchamel, en plus de la recette classique. Et sortir le poulet de la poêle avant cuisson complète : il finit dans la tourte.","serves":"6 portions","n":6,"ingr":[{"group":null,"items":["800 g de hauts de cuisse de poulet désossés","3 carottes","2 oignons","½ bouquet de persil plat","1 L de lait entier","90 g de beurre","90 g de farine","1 bouillon cube de volaille","50 g de parmesan râpé","2 pâtes feuilletées","2 c. à soupe d'huile d'olive","Sel, poivre"]}],"steps":["**Faire la béchamel.** Un roux beurre-farine, puis le lait. Ajouter un bouillon cube de volaille en plus de la recette classique — c'est ce qui donne le goût.","**Pré-cuire les légumes à la poêle.** Carottes et oignons taillés.","**Saisir le poulet.** Faire griller les hauts de cuisse ; les sortir avant cuisson complète, ils finiront dans la tourte. Couper en morceaux.","**Monter l'appareil.** Mélanger béchamel, légumes et poulet. Ajouter le persil haché et le parmesan.","**Foncer le moule.** Une pâte feuilletée au fond d'un moule à manqué ou de n'importe quel moule.","**Garnir et couvrir.** Verser l'appareil, poser la seconde pâte par-dessus et bien souder les bords.","**Faire la cheminée.** Un trou au centre, avec un petit tube de papier sulfurisé ou d'alu planté dedans.","**Enfourner au moins 45 min** (~200 °C).","**Laisser refroidir avant de couper.** Chaude, elle coule."],"notes":["Le bouillon cube apporte beaucoup de sel : goûter la béchamel avant de saler.","1 L de béchamel, c'est généreux — il faut un moule haut. Pour un moule à manqué standard de 26 cm, compter plutôt 700 ml.","La cheminée laisse sortir la vapeur : sans elle, le couvercle se soulève et la garniture bout à l'intérieur."],"courses":[["Hauts de cuisse de poulet","fr",[0]],["Carotte","fl",[1]],["Oignon","fl",[2]],["Persil plat","fl",[3]],["Lait entier","fr",[4]],["Beurre","fr",[5]],["Farine","se",[6]],["Bouillon de volaille","se",[7]],["Parmesan","fr",[8]],["Pâte feuilletée","fr",[9]],["Huile d'olive","se",[10]],["Sel","ep",[11]],["Poivre","ep",[11]]],"shop":null,"img":null},{"id":"tuna-melt","t":"Tuna melt","e":"🥪","type":"Sandwich & snack","base":["Poisson","Fromage"],"orig":["Amériques"],"saison":["Toute saison"],"effort":"Express","pantheon":false,"intro":"","tip":"Égoutter le thon à fond et griller le pain avant de garnir : c'est ce qui empêche le sandwich de se détremper.","serves":"2 sandwichs","n":2,"ingr":[{"group":null,"items":["4 tranches de pain de mie","2 boîtes de thon au naturel (2 × 140 g égouttés)","3 c. à soupe de mayonnaise","120 g de cheddar râpé","1 c. à soupe de câpres","2 cébettes","1 c. à café de moutarde","½ citron","Poivre"]}],"steps":["**Égoutter le thon à fond**, en pressant dans une passoire. Le liquide qui reste détremperait le pain.","**Salade de thon.** Émietter à la fourchette, ajouter mayonnaise, moutarde, câpres et cébettes hachées, jus de citron, poivre. Goûter : ça doit être vif, pas seulement crémeux.","**Griller le pain** d'un côté, à sec ou au grille-pain.","**Monter** sur la face grillée : salade de thon en couche régulière, cheddar par-dessus.","**Passer sous le gril** 3 à 4 min, jusqu'à ce que le fromage bouillonne et colore.","**Poivre**, et on mange chaud."],"notes":["Les câpres apportent l'acidité : c'est elles qui réveillent le sandwich.","Du thon au naturel plutôt qu'à l'huile — on ajoute déjà de la mayonnaise.","Version fermée possible, cuite à la poêle comme un [[Grilled cheese]]."],"courses":[["Pain de mie","au",[0]],["Thon en conserve","se",[]],["Mayonnaise","se",[2]],["Cheddar","fr",[3]],["Câpres","se",[4]],["Cébette","fl",[5]],["Moutarde","se",[6]],["Citron","fl",[7]],["Poivre","ep",[8]]],"shop":null,"img":null},{"id":"veloute-de-butternut","t":"Velouté de butternut","e":"🍠","type":"Entrée","base":["Veggie"],"orig":["France","Fusion maison"],"saison":["Automne","Hiver"],"effort":"Normal","pantheon":false,"intro":"","tip":"La crème de coco et le curry : c'est ça qui le distingue du potimarron. Et le butternut s'épluche.","serves":"6 portions","n":6,"ingr":[{"group":null,"items":["1 butternut (~1,2 kg), épluché, vidé de ses graines, taillé en cubes","2 oignons émincés","3 gousses d'ail émincées","2 c. à soupe d'huile d'olive","~1 L de bouillon de volaille (à hauteur des cubes)","1 c. à café de grains de poivre de Sichuan","2 feuilles de laurier","15 cl de crème de coco","1 c. à café de curry","Sel, poivre"]},{"group":"Pour la garniture","items":["250 g de champignons de Paris émincés","2 c. à soupe de sauce soja","Quelques brins de persil plat ciselé"]}],"steps":["**Préparer le butternut.** L'éplucher, le couper en deux, retirer les graines et les filaments, détailler en cubes. Contrairement au potimarron, la peau est trop épaisse pour être mixée.","**Faire suer l'ail et l'oignon.** Dans un grand faitout avec l'huile d'olive, à feu moyen, jusqu'à ce qu'ils soient translucides sans colorer.","**Ajouter le butternut.** Mélanger pour enrober les cubes.","**Mouiller à hauteur** avec le bouillon de volaille. Ajouter les grains de poivre de Sichuan et le laurier.","**Cuire** jusqu'à ce que les cubes soient bien fondants.","**Séparer le solide du liquide.** Récupérer tous les morceaux et les mettre dans le blender. Garder le jus dans le faitout.","**Réduire le jus.** À feu vif, le faire réduire longuement jusqu'à ce qu'il se concentre en goût. C'est l'étape qui fait la recette.","**Mixer.** Verser le jus réduit sur les morceaux dans le blender, ajouter la crème de coco et le curry. Mixer jusqu'à obtenir une consistance veloutée — entre la purée et la soupe. Rectifier l'assaisonnement.","**Griller les champignons.** À la poêle bien chaude, puis déglacer à la sauce soja.","**Dresser.** Le velouté en assiette creuse, les champignons par-dessus et le persil ciselé."],"notes":["Le butternut est plus doux et plus sucré que le potimarron, qui a lui un goût de châtaigne. D'où le curry, qui vient contrebalancer.","La crème de coco (plus épaisse et plus grasse) n'est pas le lait de coco : avec du lait, compter 20 à 25 cl et réduire le jus davantage.","Se garde 3 jours au frais et se congèle bien — mais garnir seulement au moment de servir."],"courses":[["Butternut","fl",[0]],["Oignon","fl",[1]],["Ail","fl",[2]],["Huile d'olive","se",[3]],["Bouillon de volaille","se",[4]],["Poivre de Sichuan","ep",[5]],["Laurier","ep",[6]],["Crème de coco","se",[7]],["Curry","ep",[8]],["Sel","ep",[9]],["Poivre","ep",[5,9]],["Champignons de Paris","fl",[10]],["Sauce soja","se",[11]],["Persil plat","fl",[12]]],"shop":null,"img":{"s":"img/veloute-de-butternut-s-58dc6c.webp","l":"img/veloute-de-butternut-58dc6c.webp","c":"#ae853a"}},{"id":"veloute-de-potimarron","t":"Velouté de potimarron","e":"🎃","type":"Entrée","base":["Veggie","Fromage"],"orig":["France"],"saison":["Automne","Hiver"],"effort":"Normal","pantheon":false,"intro":"","tip":"Séparer le solide du liquide, réduire le jus à fond, puis tout remixer ensemble. De la crème à 30 % et du cumin : le curry, c'est pour le butternut.","serves":"6 portions","n":6,"ingr":[{"group":null,"items":["1 potimarron entier (~1,2 kg), non épluché, vidé de ses graines, taillé en cubes","2 oignons émincés","3 gousses d'ail émincées","2 c. à soupe d'huile d'olive","~1 L de bouillon de volaille (à hauteur des cubes)","1 c. à café de grains de poivre de Sichuan","2 feuilles de laurier","15 cl de crème fraîche à 30 %","1 c. à café de cumin","Sel, poivre"]},{"group":"Pour la garniture","items":["250 g de champignons de Paris émincés","2 c. à soupe de sauce soja","60 g de bleu émietté","Quelques brins de persil plat ciselé"]}],"steps":["**Préparer le potimarron.** Le laver, le couper, retirer les graines et les filaments. **Ne pas l'éplucher** : la peau fond à la cuisson et apporte du goût. Détailler en cubes.","**Faire suer l'ail et l'oignon.** Dans un grand faitout avec l'huile d'olive, à feu moyen, jusqu'à ce qu'ils soient translucides sans colorer.","**Ajouter le potimarron.** Mélanger pour enrober les cubes.","**Mouiller à hauteur** avec le bouillon de volaille. Ajouter les grains de poivre de Sichuan et le laurier.","**Cuire** jusqu'à ce que les cubes soient bien fondants.","**Séparer le solide du liquide.** Récupérer tous les morceaux et les mettre dans le blender. Garder le jus dans le faitout.","**Réduire le jus.** À feu vif, le faire réduire longuement jusqu'à ce qu'il se concentre en goût. C'est l'étape qui fait la recette.","**Mixer.** Verser le jus réduit sur les morceaux dans le blender, ajouter la crème et le cumin. Mixer jusqu'à obtenir une consistance veloutée — entre la purée et la soupe. Rectifier l'assaisonnement.","**Griller les champignons.** À la poêle bien chaude, puis déglacer à la sauce soja.","**Dresser.** Le velouté en assiette creuse, les champignons par-dessus, le persil ciselé et quelques miettes de bleu."],"notes":["La peau du potimarron ne s'épluche jamais — c'est ce qui le distingue du [[Velouté de butternut]].","Se garde 3 jours au frais et se congèle bien — mais garnir seulement au moment de servir."],"courses":[["Potimarron","fl",[0]],["Oignon","fl",[1]],["Ail","fl",[2]],["Huile d'olive","se",[3]],["Bouillon de volaille","se",[4]],["Poivre de Sichuan","ep",[5]],["Laurier","ep",[6]],["Crème fraîche","fr",[7]],["Cumin","ep",[8]],["Sel","ep",[9]],["Poivre","ep",[5,9]],["Champignons de Paris","fl",[10]],["Sauce soja","se",[11]],["Bleu","fr",[12]],["Persil plat","fl",[13]]],"shop":null,"img":{"s":"img/veloute-de-potimarron-s-87c01f.webp","l":"img/veloute-de-potimarron-87c01f.webp","c":"#6a6047"}}],"expr":[{"br":"Demeremad !","fr":"Bonjour, bienvenue !"},{"br":"Jsuis miaodal","fr":"Je suis complètement bourré."},{"br":"Un lamb miao","fr":"\"Une chute de barrique\" : une chute, en état d'ébriété"},{"br":"Mezo skuize","fr":"Je suis fatigué."},{"br":"Skuizdal","fr":"Mort de fatigue."},{"br":"Da gousket !","fr":"Au lit !"},{"br":"Moenic","fr":"Mince (et petit, grâce au -ic)."},{"br":"Le chupen","fr":"La veste."},{"br":"Defessoné","fr":"en bordel, n'a aucune allure."},{"br":"Founouss !","fr":"C’est copieux et délicieux !"},{"br":"Avoir du furness","fr":"Avoir de l’intelligence, de la pertinence, de la réussite."},{"br":"Droch poud !","fr":"Bête comme un pot à lait."},{"br":"Pen mor !","fr":"Tête de cochon."},{"br":"Pen toussik !","fr":"Tête de crapaud."},{"br":"Lochkit","fr":"Que dalle, rien du tout."},{"br":"Forz penoz","fr":"N’importe comment."},{"br":"Amzer zo","fr":"Il y a le temps."},{"br":"des Rabiou","fr":"Un peu d’argent de poche."},{"br":"Avoir drouk","fr":"Avoir mal."},{"br":"Prendre un lamb","fr":"Pris un gadin, une chute."},{"br":"Le chidouen","fr":"Le chaudron."},{"br":"Pen dijonj","fr":"\"Tête qui oublie\" = tête en l'air"},{"br":"C’est maaaaanit’ !","fr":"C’est très bon !"},{"br":"C’est dispar' !","fr" const $ = (s, el = document) => el.querySelector(s);

const norm = s => (s || '').toLowerCase().replace(/œ/g, 'oe').replace(/æ/g, 'ae').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
const BY_TITLE = Object.fromEntries(R.map(r => [norm(r.t), r]));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const icon = (id, cls = '') => `<svg class="${cls}" aria-hidden="true"><use href="#i-${id}"/></svg>`;
const store = {

  set(k, v) { try { localStorage.setItem('kaier.' + k, JSON.stringify(v)); } catch (e) {} }
};
function md(s, { links = true } = {}) {
  let h = esc(s);
  h = h.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  h = h.replace(/\[\[(.+?)\]\]/g, (m, t) => {
    const r = BY_TITLE[norm(t.replace(/&#39;/g, "'").replace(/&amp;/g, '&'))];
    return r && links ? `<a href="#/r/${r.id}">${t}</a>` : t;
  });
  h = h.replace(/\[(.+?)\]\((https?:[^)\s]+)\)/g, (m, t, u) => links ? `<a href="${u}" target="_blank" rel="noopener">${t}</a>` : t);
  return h;
}
const plain = s => (s || '').replace(/\*\*(.+?)\*\*/g, '$1').replace(/\[\[(.+?)\]\]/g, '$1').replace(/\[(.+?)\]\(.+?\)/g, '$1');

const MOIS_SAISON = ['Hiver', 'Hiver', 'Printemps', 'Printemps', 'Printemps', 'Été', 'Été', 'Été', 'Automne', 'Automne', 'Automne', 'Hiver'];
const SAISON = MOIS_SAISON[new Date().getMonth()];

/* ================= suivi de diffusion (anonyme) =================
   Chaque appareil reçoit un identifiant au hasard. Les liens partagés portent ?de=<identifiant>,
   ce qui permet de voir la chaîne « untel a envoyé à untel qui a envoyé à… » sans rien savoir des gens. */
const T = (() => {
  const url = new URL(location.href);
  const deUrl = (url.searchParams.get('de') || '').replace(/[^a-z0-9]/gi, '').slice(0, 24);
  let v = store.get('v');
  const nouveau = !v;
  if (!v) { v = Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4); store.set('v', v); }
  if (nouveau) store.set('de', deUrl && deUrl !== v ? deUrl : null);
  // l'adresse affichée porte désormais le lien de CET appareil : si on la copie, on devient le parrain
  if (url.searchParams.has('de') || url.searchParams.has('app')) {
    url.searchParams.delete('de'); url.searchParams.delete('app');
    history.replaceState(null, '', url.pathname + url.search + url.hash);
  }
  const ua = navigator.userAgent;
  const plateforme = /iphone|ipad|ipod/i.test(ua) ? 'ios' : /android/i.test(ua) ? 'android' : 'ordi';
  const appli = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  function send(type, extra = {}) {
    if (v === 'jakez' && type !== 'visite') return;
    const body = { v, de: store.get('de'), type, plateforme, appli, ...extra };
    try {
      fetch(SB_URL + '/rest/v1/kaier_events', {
        method: 'POST', keepalive: true,
        headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
        body: JSON.stringify(body)
      }).catch(() => {});
    } catch (e) {}
  }
  const jour = new Date().toISOString().slice(0, 10);
  if (store.get('jour') !== jour) { store.set('jour', jour); send('visite', { nouveau }); }
  return { v, send, plateforme, appli, nouveau };
})();
function lienPartage(id) {
  return SITE + (id ? 'r/' + id + '.html' : '') + '?de=' + T.v;
}

/* ================= quantités ================= */
const FRAC = { '½': .5, '¼': .25, '¾': .75, '⅓': 1 / 3, '⅔': 2 / 3 };
const NUM = String.raw`(\d+(?:[.,]\d+)?(?:\s?[½¼¾⅓⅔])?|[½¼¾⅓⅔]|\d+\/\d+)`;
function parseNum(s) {
  s = s.replace(/\s/g, '');
  if (/^\d+\/\d+$/.test(s)) { const [a, b] = s.split('/'); return +a / +b; }
  let v = 0; const f = s.match(/[½¼¾⅓⅔]/);
  if (f) { v += FRAC[f[0]]; s = s.replace(f[0], ''); }
  if (s) v += parseFloat(s.replace(',', '.'));
  return v;
}
function fmtNum(v, unit) {
  if (unit && /^(g|ml|cl)$/i.test(unit)) {
    if (v >= 500) return String(Math.round(v / 50) * 50);
    if (v >= 100) return String(Math.round(v / 10) * 10);
    if (v >= 20) return String(Math.round(v / 5) * 5);
    return String(Math.max(1, Math.round(v)));
  }
  if (unit && /^(kg|l)$/i.test(unit)) return (Math.round(v * 10) / 10).toString().replace('.', ',');
  const q = v < 1 ? Math.round(v * 4) / 4 : Math.round(v * 2) / 2;
  const ent = Math.floor(q), fr = q - ent;
  const fs = fr === .25 ? '¼' : fr === .5 ? '½' : fr === .75 ? '¾' : '';

  return (ent ? String(ent) : '') + fs;
}
const UNIT = /^\s*(kg|g|ml|cl|l|L)\b/;
function scaleLine(line, f) {
  if (Math.abs(f - 1) < 1e-6) return { html: md(line), changed: false };
  let out = line, changed = false;
  // quantité en tête de ligne, éventuellement « 2 à 3 »
  out = out.replace(new RegExp('^([~≈]\\s*)?' + NUM + '(?:(\\s*(?:à|-)\\s*)' + NUM + ')?'), (m, pre, a, sep, b, off, all) => {
    const rest = all.slice(m.length); const u = (rest.match(UNIT) || [])[1];
    if (/^\s*(°|cm\b.*moule|%)/.test(rest)) return m;
    changed = true;
    return '⟦' + (pre || '') + fmtNum(parseNum(a) * f, u) + (b ? sep + fmtNum(parseNum(b) * f, u) : '') + '⟧';
  });
  // quantités entre parenthèses avec une unité de poids/volume : (≈ 750 g)
  // autres quantités en poids/volume dans la ligne : (≈ 750 g), soit ~750 g
  out = out.replace(new RegExp('([^\\d⟦,.½¼¾⅓⅔])' + NUM + '(\\s*(?:kg|g|ml|cl|l|L)\\b)', 'g'), (m, pre, a, u, off, all) => {
    if (all.lastIndexOf('⟦', off) > all.lastIndexOf('⟧', off)) return m;
    changed = true; return pre + fmtNum(parseNum(a) * f, u.trim()) + u;
  });
  let html = md(out).replace(/⟦(.+?)⟧/g, '<span class="q">$1</span>');
  return { html, changed };
}
function qtyHtml(line, f) {
  const { html } = scaleLine(line, f);
  // met en gras la quantité de tête même sans mise à l'échelle
  if (Math.abs(f - 1) < 1e-6) {
    return md(line).replace(new RegExp('^((?:[~≈]\\s*)?' + NUM + '(?:\\s*(?:à|-)\\s*' + NUM + ')?(?:\\s*(?:kg|g|ml|cl|l|L|c\\. à (?:soupe|café)|cm)\\b)?)'), '<span class="q">$1</span>');
  }

}
function portions(r) { return store.get('p.' + r.id, r.n) || r.n; }
function facteur(r) { return r.n ? portions(r) / r.n : 1; }
function servesLabel(r, p) {

  if (p === r.n) return r.serves.replace(/\s*\(.*\)$/, '');

/* ================= minuteurs ================= */
const DUR = /(\d+(?:[.,]\d+)?)(?:\s*(?:à|-)\s*(\d+))?\s*(h(?:eures?)?|min(?:utes?)?|secondes?)\b(?:\s*(\d{1,2})(?!\s*(?:°|cm|g\b)))?/gi;
function durations(text) {
  const out = []; const t = plain(text); let m; DUR.lastIndex = 0;
  while ((m = DUR.exec(t))) {
    const before = t.slice(Math.max(0, m.index - 3), m.index);
    if (/[°x×]\s*$/.test(before)) continue;
    const a = parseFloat(m[1].replace(',', '.')); const u = m[3].toLowerCase();
    let s = u.startsWith('h') ? a * 3600 + (m[4] ? +m[4] * 60 : 0) : u.startsWith('min') ? a * 60 : a;
    if (s < 20 || s > 6 * 3600) continue;
    let label = m[0].replace(/\s+/g, ' ').trim();
    if (m[2]) label = label.replace(/\s*(?:à|-)\s*\d+/, '');
    if (!out.some(o => o.s === s)) out.push({ s, label });
  }
  return out.slice(0, 3);
}
let timers = store.get('timers', []).filter(t => t.end > Date.now() - 3600e3);
let actx;
function bip() {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'triangle'; o.frequency.value = 880; g.gain.value = .0001;
    o.connect(g); g.connect(actx.destination); o.start();
    const n = actx.currentTime;
    for (let i = 0; i < 3; i++) { g.gain.setValueAtTime(.35, n + i * .35); g.gain.exponentialRampToValueAtTime(.0001, n + i * .35 + .25); }
    o.stop(n + 1.1);
  } catch (e) {}
  if (navigator.vibrate) navigator.vibrate([300, 150, 300, 150, 300]);
}
function startTimer(sec, label, rid) {
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); } catch (e) {}
  timers.push({ id: Math.random().toString(36).slice(2), end: Date.now() + sec * 1000, label, rid, rung: false });
  store.set('timers', timers); drawTimers();
  toast('Minuteur lancé : ' + fmtDur(sec));
}
const fmtDur = s => { s = Math.max(0, Math.round(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return h ? `${h} h ${String(m).padStart(2, '0')}` : `${m}:${String(x).padStart(2, '0')}`; };
function drawTimers() {
  const box = $('#timers');
  box.innerHTML = timers.map(t => {
    const left = (t.end - Date.now()) / 1000;
    return `<div class="tm ${left <= 0 ? 'ring' : ''}" data-id="${t.id}"><span class="t">${left <= 0 ? 'Fini !' : fmtDur(left)}</span><span class="l">${esc(t.label)}</span><button data-stop="${t.id}" aria-label="Arrêter le minuteur">${icon('x')}</button></div>`;
  }).join('');
}
setInterval(() => {
  if (!timers.length) return;
  timers.forEach(t => { if (!t.rung && t.end <= Date.now()) { t.rung = true; bip(); store.set('timers', timers); t.again = setInterval(() => timers.includes(t) ? bip() : clearInterval(t.again), 6000); } });

}, 1000);
document.addEventListener('click', e => {
  const b = e.target.closest('[data-stop]'); if (!b) return;

function resultats() {

    list = list.map(x => {

const RAYONS = [['fl', '🥬 Fruits & légumes'], ['fr', '🧀 Frais'], ['se', '🥫 Épicerie'], ['ep', '🧂 Épices'], ['au', '🛒 Le reste']];
function listeCourses() {
  const items = new Map();
  for (const [id, p] of Object.entries(panier.recettes)) {
    const r = BY_ID[id]; if (!r) continue;
    const f = r.n ? p / r.n : 1;
    const lignes = r.ingr.flatMap(g => g.items);
    for (const [label, ray, idx] of r.courses) {
      const key = norm(label);
      const it = items.get(key) || { key, label, ray, src: [] };
      it.src.push({ r, lignes: idx.map(i => lignes[i]).filter(Boolean), f });
      items.set(key, it);
    }
  }
  for (const e of panier.extras) items.set('x:' + norm(e), { key: 'x:' + norm(e), label: e, ray: 'au', src: [], extra: true });
  return [...items.values()].map(i => ({ ...i, done: !!panier.coche[i.key] }));
}
