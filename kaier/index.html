/* ================= mode cuisine ================= */
let cook = null, wake = null;
async function wakeLock(on) {
  try { if (on && 'wakeLock' in navigator) { wake = await navigator.wakeLock.request('screen'); } else if (wake) { await wake.release(); wake = null; } } catch (e) {}
}
document.addEventListener('visibilitychange', () => { if (cook && document.visibilityState === 'visible') wakeLock(true); });
function openCook(id, step) {
  const r = BY_ID[id]; if (!r) return;
  if (!cook || cook.id !== id) T.send('cuisine', { recette: id });
  cook = { id, step };
  history.pushState({ cook: 1 }, '', location.hash.split('/cuisine')[0] + '/cuisine');
  document.body.classList.add('cooking');
  $('#cook').hidden = false;
  wakeLock(true);
  drawCook();
}
function closeCook(fromPop) {
  if (!cook) return;
  cook = null; $('#cook').hidden = true; document.body.classList.remove('cooking'); wakeLock(false);
  if (!fromPop && /\/cuisine$/.test(location.hash)) history.back();
}
function drawCook() {
  const r = BY_ID[cook.id], f = facteur(r);
  const total = r.steps.length + 2; // préparation + étapes + fin
  const s = cook.step;
  let body;
  if (s === 0) {
    let k = 0;
    body = `<div class="cook-k">Avant de commencer</div><h2>Sors tout ça</h2>
      ${r.n ? `<p style="opacity:.75;margin:0 0 6px">Pour ${esc(servesLabel(r, portions(r)))}.</p>` : ''}
      ${r.ingr.map(g => `${g.group ? `<div class="ig-group">${esc(g.group)}</div>` : ''}<ul class="ig">${g.items.map(it => { const i = k++; return `<li><label><input type="checkbox" data-cck="${i}"><span>${qtyHtml(it, f)}</span></label></li>`; }).join('')}</ul>`).join('')}`;
  } else if (s <= r.steps.length) {
    const txt = r.steps[s - 1];
    body = `<div class="cook-k">Étape ${s} sur ${r.steps.length}</div><p class="cook-step">${md(txt)}</p>
      ${durations(txt).map(d => `<button class="timer-chip" data-timer="${d.s}" data-label="${esc(r.t)} · étape ${s}">${icon('timer')}Lancer ${esc(d.label)}</button>`).join('')}`;
  } else {
    const ex = DATA.expr[Math.floor(Math.random() * DATA.expr.length)];
    const fait = faites.includes(r.id);
    body = `<div class="cook-end"><div class="cook-k">C'est prêt</div><h2>À table&nbsp;!</h2>
      <p class="cook-step" style="font-size:20px;opacity:.85">${r.notes[0] ? md(r.notes[0]) : 'Goûte, rectifie l\'assaisonnement, et sers bien chaud.'}</p>
      <div class="row"><button class="btn ${fait ? 'ok btn-ink' : 'btn-cire'}" id="cfait">${fait ? icon('check') + 'Faite' : 'Je l\'ai faite'}</button><button class="btn btn-line" data-share="${r.id}">${icon('share')}Envoyer à un pote</button></div>
      ${ex ? `<div class="breton"><small>Le mot de la fin, en breton</small><q>${esc(ex.br)}</q><p>${esc(ex.fr)}</p></div>` : ''}</div>`;
  }
  $('#cook').innerHTML = `<div class="cook-top"><button class="icon-btn" id="cclose" aria-label="Quitter le mode cuisine">${icon('x')}</button><b>${esc(r.t)}</b></div>
    <div class="prog" aria-hidden="true">${Array.from({ length: total }, (_, i) => `<i class="${i <= s ? 'on' : ''}"></i>`).join('')}</div>
    <div class="cook-main" id="cmain"><div class="wrapc">${body}</div></div>
    <div class="cook-nav"><button class="btn prev" id="cprev" aria-label="Étape précédente" ${s === 0 ? 'disabled' : ''}>${icon('back')}</button>
    ${s < total - 1 ? `<button class="btn btn-cire" id="cnext">${s === 0 ? 'C\'est parti' : s === r.steps.length ? 'Terminé' : 'Étape suivante'}</button>` : `<button class="btn btn-cire" id="cdone">Revenir à la recette</button>`}</div>`;
  $('#cclose').onclick = () => closeCook();
  $('#cprev').onclick = () => { cook.step = Math.max(0, s - 1); drawCook(); };
  const n = $('#cnext'); if (n) n.onclick = () => { cook.step = s + 1; drawCook(); };
  const d = $('#cdone'); if (d) d.onclick = () => closeCook();
  const cf = $('#cfait'); if (cf) cf.onclick = () => { if (!faites.includes(r.id)) { faites = [...faites, r.id]; store.set('faites', faites); T.send('faite', { recette: r.id }); toast('Bien joué 👏'); } drawCook(); };
  $$('#cook [data-timer]').forEach(b => b.onclick = () => startTimer(+b.dataset.timer, b.dataset.label, r.id));
  const ck = JSON.parse(sessionStorage.getItem('ck.' + r.id) || '[]');
  $$('[data-cck]').forEach(c => { c.checked = ck.includes(+c.dataset.cck); c.onchange = () => { const v = $$('[data-cck]').filter(x => x.checked).map(x => +x.dataset.cck); sessionStorage.setItem('ck.' + r.id, JSON.stringify(v)); }; });
  $('#cmain').scrollTop = 0;
  // glisser pour changer d'étape
  let x0 = null, y0 = null;
  const m = $('#cmain');
  m.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
  m.addEventListener('touchend', e => {
    if (x0 == null) return; const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
    if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.5) { cook.step = Math.min(total - 1, Math.max(0, s + (dx < 0 ? 1 : -1))); if (cook.step !== s) drawCook(); }
  });
}
document.addEventListener('keydown', e => {
  if (!cook) return;
  const r = BY_ID[cook.id], total = r.steps.length + 2;
  if (e.key === 'ArrowRight' && cook.step < total - 1) { cook.step++; drawCook(); }
  if (e.key === 'ArrowLeft' && cook.step > 0) { cook.step--; drawCook(); }
  if (e.key === 'Escape') closeCook();
});

/* ================= partage ================= */
async function copier(t) {
  try { await navigator.clipboard.writeText(t); return true; } catch (e) {
    const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select();
    try { document.execCommand('copy'); } catch (x) {} a.remove(); return true;
  }
}
function sheet(html) {
  const bg = document.createElement('div'); bg.className = 'sheet-bg';
  bg.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`;
  document.body.appendChild(bg);
  const close = () => bg.remove();
  bg.addEventListener('click', e => { if (e.target === bg) close(); });
  document.addEventListener('keydown', function k(e) { if (e.key === 'Escape') { close(); document.removeEventListener('keydown', k); } });
  return { el: bg, close };
}
function share(id) {
  const r = id ? BY_ID[id] : null;
  const url = lienPartage(id);
  const titre = r ? r.t : 'Kaier, le cahier de recettes de Jakez';
  const texte = r ? `${r.e} ${r.t} : une recette du cahier de Jakez, testée et expliquée pas à pas.` : 'Le cahier de recettes de Jakez : des recettes testées, expliquées pour les réussir. Gratuit, sans inscription.';
  const s = sheet(`<h2>${r ? 'Envoyer cette recette' : 'Faire tourner Kaier'}</h2><p>${r ? 'Ton pote l\'ouvrira directement, sans rien installer.' : 'Pas de compte, pas d\'appli à télécharger : un lien suffit.'}</p>
    <div class="opts">
      ${navigator.share ? `<button class="opt" data-o="natif"><span class="ic">${icon('share')}</span><span>Envoyer<small>Messages, WhatsApp, mail…</small></span></button>` : ''}
      <a class="opt" data-o="whatsapp" href="https://wa.me/?text=${encodeURIComponent(texte + '\n' + url)}" target="_blank" rel="noopener"><span class="ic" style="color:#25D366">${icon('wa')}</span><span>WhatsApp</span></a>
      <button class="opt" data-o="copie"><span class="ic">${icon('copy')}</span><span>Copier le lien</span></button>
      <button class="opt" data-o="qr"><span class="ic">${icon('qr')}</span><span>Montrer un QR code<small>Ton pote le scanne avec son téléphone</small></span></button>
    </div>`);
  s.el.addEventListener('click', async e => {
    const o = e.target.closest('[data-o]'); if (!o) return;
    const canal = o.dataset.o;
    T.send('partage', { recette: id || null, canal });
    if (canal === 'natif') { e.preventDefault(); try { await navigator.share({ title: titre, text: texte, url }); s.close(); } catch (x) {} }
    if (canal === 'copie') { e.preventDefault(); await copier(url); toast('Lien copié'); s.close(); }
    if (canal === 'whatsapp') setTimeout(s.close, 300);
    if (canal === 'qr') {
      e.preventDefault();
      await loadQr();
      const qr = qrcode(0, 'M'); qr.addData(url); qr.make();
      s.el.querySelector('.sheet').innerHTML = `<div class="grab"></div><h2>${r ? esc(r.t) : 'Kaier'}</h2><p>Scanne avec l'appareil photo du téléphone.</p><div class="qr">${qr.createSvgTag({ cellSize: 6, margin: 2, scalable: true })}</div><button class="btn btn-ink btn-wide" data-close>Fermer</button>`;
      s.el.querySelector('[data-close]').onclick = s.close;
    }
  });
}
function loadQr() {
  if (window.qrcode) return Promise.resolve();
  return new Promise((ok, ko) => { const sc = document.createElement('script'); sc.src = 'vendor/qrcode.js'; sc.onload = ok; sc.onerror = ko; document.head.appendChild(sc); });

document.addEventListener('click', e => {

/* ================= routeur ================= */
let onScroll = null, homeScroll = 0, current = '', cameFromApp = false, lastRoute = '';
addEventListener('scroll', () => { if (onScroll) onScroll(); }, { passive: true });
function route() {
  $$('.sheet-bg').forEach(x => x.remove());
  const h = location.hash || '#/';
  const m = h.match(/^#\/r\/([\w-]+)(\/cuisine)?/);
  if (cook && !(m && m[2])) closeCook(true);
  if (m && m[2] && !cook) { history.replaceState(null, '', '#/r/' + m[1]); }
  if (lastRoute === '#/' || lastRoute === '') homeScroll = lastRoute === '#/' ? scrollY : 0;
  if (m && m[2] && cook) return;
  const key = m ? 'r:' + m[1] : h.split('?')[0];
  if (key === current && m) return;
  current = key;
  cameFromApp = !!lastRoute;
  lastRoute = h.startsWith('#/r/') ? '#/r' : h.split('?')[0];
  document.body.classList.remove('on-recipe'); onScroll = null;
  if (m) { viewRecipe(m[1]); scrollTo(0, 0); }
  else if (h.startsWith('#/carnet')) { viewCarnet(); scrollTo(0, 0); }
  else if (h.startsWith('#/courses')) { viewCourses(); scrollTo(0, 0); }
  else { lastRoute = '#/'; viewHome(); if (!homeScroll) scrollTo(0, 0); }
  if (m) document.title = BY_ID[m[1]] ? BY_ID[m[1]].t + ' · Kaier' : 'Kaier';
  else document.title = 'Kaier · le cahier de recettes de Jakez';
}
// anciens liens « #id » (format Bawss)
if (/^#[\w-]+$/.test(location.hash) && BY_ID[location.hash.slice(1)]) history.replaceState(null, '', '#/r/' + location.hash.slice(1));
addEventListener('hashchange', route);
addEventListener('popstate', () => { if (cook && !/\/cuisine$/.test(location.hash)) closeCook(true); });
route(); badges(); drawTimers();

if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
