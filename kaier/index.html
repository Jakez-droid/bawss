<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kaier · le cahier de recettes de Jakez</title>
<meta name="description" content="Les recettes testées dans la cuisine de Jakez, à refaire chez toi. Gratuit, sans inscription, marche hors ligne.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Kaier">
<meta property="og:title" content="Kaier, le cahier de recettes de Jakez">
<meta property="og:description" content="Les recettes testées dans sa cuisine, à refaire chez toi. Gratuit, sans inscription.">
<meta property="og:image" content="https://jakez-droid.github.io/bawss/kaier/icons/icon-512.png">
<meta property="og:url" content="https://jakez-droid.github.io/bawss/kaier/">
<meta name="theme-color" content="#F2F4F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1F2E" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kaier">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/gloock.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/figtree.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:Gloock;src:url(fonts/gloock.woff2) format("woff2");font-display:swap}
@font-face{font-family:Figtree;src:url(fonts/figtree.woff2) format("woff2");font-weight:300 900;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:Figtree;src:url(fonts/figtree-ext.woff2) format("woff2");font-weight:300 900;font-display:swap;unicode-range:U+0100-02AF,U+0304,U+0308,U+0329,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}

:root{
  --sel:#F2F4F3; --surface:#FFFFFF; --sunk:#E6EBEC;
  --ink:#12304A; --ink-2:#4C6274; --ink-3:#7B8E9C; --line:#D5DDE1;
  --cire:#FFC72C; --cire-ink:#12304A; --cire-soft:#FFF1C7;
  --homard:#D63A2A; --algue:#2F7A55; --algue-soft:#DDEFE5;
  --scrim:rgba(18,48,74,.55);
  --r-photo:20px; --r-box:14px;
  --shadow:0 1px 2px rgba(18,48,74,.08),0 8px 24px -12px rgba(18,48,74,.25);
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  --serif:Gloock,Georgia,"Times New Roman",serif;
  --sans:Figtree,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --sel:#0D1F2E; --surface:#15293B; --sunk:#0A1825;
    --ink:#EEF2F3; --ink-2:#AFC0CB; --ink-3:#7F95A4; --line:#26405A;
    --cire-soft:#3A3318; --algue:#7FCBA2; --algue-soft:#16362A; --homard:#FF6B5A;
    --scrim:rgba(5,14,22,.6);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --sel:#0D1F2E; --surface:#15293B; --sunk:#0A1825;
  --ink:#EEF2F3; --ink-2:#AFC0CB; --ink-3:#7F95A4; --line:#26405A;
  --cire-soft:#3A3318; --algue:#7FCBA2; --algue-soft:#16362A; --homard:#FF6B5A;
  --scrim:rgba(5,14,22,.6);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:72px}
body{margin:0;background:var(--sel);color:var(--ink);font:400 17px/1.55 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{display:block;max-width:100%}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--cire);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
@media (min-width:720px){.wrap{padding:0 32px}}

/* ---------- barre du haut ---------- */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--sel) 88%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);padding-top:var(--safe-t)}
.top .wrap{display:flex;align-items:center;gap:12px;height:60px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;margin-right:auto}
.brand svg{width:32px;height:32px}
.brand b{font:400 26px/1 var(--serif);letter-spacing:-.01em}
.nav-d{display:none;gap:4px}
.nav-d a{text-decoration:none;font-weight:600;font-size:15px;padding:8px 14px;border-radius:99px;color:var(--ink-2);position:relative}
.nav-d a[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
@media (min-width:720px){.nav-d{display:flex}}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none}
.icon-btn svg{width:22px;height:22px}
.badge{position:absolute;top:2px;right:2px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--cire);color:var(--cire-ink);font-size:11px;font-weight:800;display:grid;place-items:center;line-height:1}
.badge:empty{display:none}

/* ---------- nav mobile ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;padding:6px 8px calc(6px + var(--safe-b))}
.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;font-size:12px;font-weight:600;color:var(--ink-3);padding:4px 0;position:relative}
.tabs a svg{width:24px;height:24px}
.tabs a[aria-current="page"]{color:var(--ink)}
.tabs a[aria-current="page"] svg{stroke-width:2.2}
.tabs .badge{top:0;right:calc(50% - 26px)}
@media (min-width:720px){.tabs{display:none}}
main{padding-bottom:calc(96px + var(--safe-b))}
@media (min-width:720px){main{padding-bottom:64px}}
body.cooking .tabs,body.cooking .top{visibility:hidden}

/* ---------- accueil ---------- */
.hero{padding:20px 0 8px}
.hero h1{font:400 clamp(2.5rem,10.5vw,4.6rem)/.98 var(--serif);letter-spacing:-.02em;margin:0 0 14px;max-width:11ch;text-wrap:balance}
.hero p{margin:0;color:var(--ink-2);max-width:42ch;font-size:17px}
@media (min-width:720px){.hero{padding:44px 0 12px}}
.search{position:relative;display:block;grid-area:s}
.search input{width:100%;height:56px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);padding:0 48px 0 50px;font-size:17px;box-shadow:var(--shadow);-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--ink-3)}
.search input:focus{outline:none;border-color:var(--ink)}
.search>svg{position:absolute;left:16px;top:17px;width:22px;height:22px;color:var(--ink-3);pointer-events:none}
.search .clear{position:absolute;right:6px;top:6px;width:44px;height:44px;border-radius:12px;display:none;place-items:center;color:var(--ink-3)}
.search.has .clear{display:grid}
.search .clear svg{width:18px;height:18px}
.search input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.roll{display:flex;align-items:center;gap:12px;width:100%;background:var(--cire);color:var(--cire-ink);border-radius:16px;padding:14px 16px;text-align:left;font-weight:700;font-size:17px}
.roll small{display:block;font-weight:500;font-size:14px;opacity:.8}
.roll .dice{width:44px;height:44px;flex:none;border-radius:12px;background:var(--cire-ink);color:var(--cire);display:grid;place-items:center;font-size:24px;transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
.roll.spin .dice{transform:rotate(540deg) scale(1.1)}
.roll .go{margin-left:auto}
.hero-row{display:grid;gap:12px;grid-template-areas:'t' 's' 'r'}
.hero-row>div{grid-area:t;margin-bottom:10px}.roll{grid-area:r}
@media (min-width:720px){.hero-row{grid-template-columns:1fr 340px;grid-template-areas:'t r' 's s';align-items:end;column-gap:28px;row-gap:16px}.hero-row>div{margin:0}}

.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 16px 6px;margin:0 -16px;scrollbar-width:none;scroll-snap-type:x proximity}
.chips::-webkit-scrollbar{display:none}
@media (min-width:720px){.chips{margin:0 -32px;padding:20px 32px 6px;flex-wrap:wrap;overflow:visible}}
.chip{flex:none;height:38px;padding:0 15px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);font-size:15px;font-weight:600;color:var(--ink-2);white-space:nowrap;scroll-snap-align:start;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--sel)}
.chip.sep{margin-left:6px}

.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:30px 0 14px}
.sec-h h2{font:400 26px/1.1 var(--serif);margin:0;letter-spacing:-.01em}
.sec-h span{color:var(--ink-3);font-size:15px;font-weight:600}

.feature{display:block;position:relative;border-radius:var(--r-photo);overflow:hidden;text-decoration:none;color:#fff;aspect-ratio:5/4;background:var(--ink);box-shadow:var(--shadow)}
@media (min-width:720px){.feature{aspect-ratio:21/9}}
.feature img{width:100%;height:100%;object-fit:cover}
.feature .cap{position:absolute;inset:auto 0 0 0;padding:60px 18px 18px;background:linear-gradient(transparent,rgba(8,20,32,.82))}
.feature .kicker{display:inline-block;background:var(--cire);color:var(--cire-ink);font-weight:700;font-size:13px;padding:4px 10px;border-radius:99px;margin-bottom:10px}
.feature h3{font:400 clamp(1.9rem,7vw,3rem)/1 var(--serif);margin:0 0 6px;letter-spacing:-.01em}
.feature p{margin:0;font-size:15px;opacity:.9;max-width:52ch;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 12px}
@media (min-width:620px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:26px 18px}}
@media (min-width:980px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.card{text-decoration:none;display:block;position:relative;min-width:0}
.card .ph{aspect-ratio:4/5;border-radius:var(--r-photo);overflow:hidden;background:var(--sunk);position:relative}
.card .ph img{width:100%;height:100%;object-fit:cover;transition:transform .4s ease}
@media (hover:hover){.card:hover .ph img{transform:scale(1.03)}}
.card .emo{width:100%;height:100%;display:grid;place-items:center;font-size:clamp(56px,16vw,84px)}
.card .emo span{filter:drop-shadow(0 8px 12px rgba(0,0,0,.18))}
.card h3{font:650 16px/1.25 var(--sans);margin:10px 2px 3px;letter-spacing:-.005em}
.card .meta{font-size:14px;color:var(--ink-3);margin:0 2px;display:flex;gap:8px;align-items:center}
.card .fav-dot{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;color:#D63A2A}
.card .fav-dot svg{width:16px;height:16px}
.tint-Plat{background:#F6E2C8}.tint-Entrée{background:#DDEEDF}.tint-Dessert{background:#F7DCE2}.tint-Base{background:#E2E6F3}.tint-Sandwich{background:#F3EBC9}.tint-Sauce{background:#F4D9CF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) [class*="tint-"]{background:#1C3348}}
:root[data-theme="dark"] [class*="tint-"]{background:#1C3348}
.dot{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.5}
.empty{text-align:center;padding:40px 16px;color:var(--ink-2)}
.empty b{display:block;font:400 26px/1.15 var(--serif);color:var(--ink);margin-bottom:8px}
.empty .big{font-size:44px;margin-bottom:8px}
.foot{margin-top:56px;padding:28px 0 8px;border-top:1px solid var(--line);color:var(--ink-3);font-size:14px;display:grid;gap:6px}
.foot a{color:var(--ink-2)}

/* ---------- recette ---------- */
.rc-hero{position:relative;margin:0 -16px;background:var(--sunk)}
.rc-hero img{width:100%;aspect-ratio:4/3;object-fit:cover}
.rc-hero .emo{aspect-ratio:16/10;display:grid;place-items:center;font-size:110px}
@media (min-width:720px){.rc-hero{margin:8px 0 0;border-radius:24px;overflow:hidden}.rc-hero img{aspect-ratio:21/9;max-height:420px}.rc-hero .emo{aspect-ratio:21/7}}
.rc-bar{position:absolute;top:0;left:0;right:0;display:flex;gap:8px;padding:12px 12px 0}
.rc-bar .icon-btn{background:rgba(255,255,255,.94);color:#12304A;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.rc-bar .sp{flex:1}
.rc-fixedbar{position:fixed;top:0;left:0;right:0;z-index:35;padding:calc(8px + var(--safe-t)) 12px 8px;display:flex;gap:8px;align-items:center;background:color-mix(in srgb,var(--sel) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transform:translateY(-110%);transition:transform .25s ease;border-bottom:1px solid var(--line)}
.rc-fixedbar.on{transform:none}
.rc-fixedbar b{flex:1;font:400 20px/1.1 var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.on-recipe .top{display:none}
.icon-btn.faved{color:var(--homard)}
.icon-btn.faved svg{fill:currentColor}

.rc-head{padding:22px 0 0}
.rc-head h1{font:400 clamp(2.3rem,9vw,3.8rem)/1 var(--serif);letter-spacing:-.02em;margin:0 0 16px;text-wrap:balance}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px;padding:0;list-style:none}
.facts li{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:14px;font-weight:600;color:var(--ink-2)}
.facts li.season{background:var(--algue-soft);border-color:transparent;color:var(--algue)}
.facts li.pan{background:var(--cire-soft);border-color:transparent;color:var(--ink)}
.intro{font-size:18px;line-height:1.6;color:var(--ink);margin:0 0 18px;max-width:62ch}
.tip{background:var(--surface);border-radius:var(--r-box);padding:16px 18px 16px 18px;border-left:5px solid var(--cire);margin:0 0 8px;box-shadow:var(--shadow);max-width:62ch}
.tip h2{font:700 13px/1 var(--sans);margin:0 0 8px;color:var(--ink-2);letter-spacing:.01em}
.tip p{margin:0;font-size:16px}
.made-count{font-size:14px;color:var(--ink-3);margin:12px 0 0}

.rc-body{display:grid;gap:8px}
@media (min-width:900px){.rc-body{grid-template-columns:360px 1fr;gap:48px;align-items:start;margin-top:24px}.ingr-col{position:sticky;top:20px}}
.blk-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:32px 0 12px}
.blk-h h2{font:400 28px/1 var(--serif);margin:0}
@media (min-width:900px){.ingr-col .blk-h{margin-top:8px}}
.stepper{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:99px;height:42px}
.stepper button{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;font-size:22px;font-weight:500}
.stepper button:disabled{opacity:.3}
.stepper output{min-width:70px;text-align:center;font-weight:700;font-size:15px;white-space:nowrap}
.serves-note{font-size:14px;color:var(--ink-3);margin:-4px 0 10px}
.ig-group{font-weight:700;font-size:14px;color:var(--ink-2);margin:18px 0 4px}
.ig{list-style:none;margin:0;padding:0}
.ig li{border-bottom:1px solid var(--line)}
.ig li:last-child{border-bottom:0}
.ig label{display:flex;gap:12px;align-items:flex-start;padding:11px 2px;cursor:pointer;font-size:16.5px;line-height:1.4}
.ig input{appearance:none;-webkit-appearance:none;width:22px;height:22px;border:2px solid var(--ink-3);border-radius:7px;flex:none;margin:0;display:grid;place-items:center;background:var(--surface)}
.ig input:checked{background:var(--algue);border-color:var(--algue)}
.ig input:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.ig input:checked+span{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--ink-3)}
.q{font-weight:700}
.ig a,.steps a,.notes a,.intro a,.tip a{color:var(--ink);text-decoration-color:var(--cire);text-decoration-thickness:3px;text-underline-offset:3px;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 20px;border-radius:14px;font-weight:700;font-size:16px;text-decoration:none;white-space:nowrap}
.btn svg{width:20px;height:20px}
.btn-line{border:1.5px solid var(--ink);color:var(--ink)}
.btn-ink{background:var(--ink);color:var(--sel)}
.btn-cire{background:var(--cire);color:var(--cire-ink)}
.btn-wide{width:100%}
.btn-soft{background:var(--surface);border:1px solid var(--line)}
.add-c{margin-top:16px}
.add-c.done{border-color:var(--algue);color:var(--algue)}

.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{display:grid;grid-template-columns:34px 1fr;gap:8px;padding:16px 0;border-bottom:1px solid var(--line);counter-increment:s}
.steps li:last-child{border-bottom:0}
.steps li::before{content:counter(s);font:400 32px/1 var(--serif);color:var(--ink-3);padding-top:2px}
.steps p{margin:0;font-size:17px;line-height:1.6;max-width:62ch}
.steps b,.cook-step b{font-weight:750}
.timer-chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;margin:10px 8px 0 0;border-radius:99px;background:var(--cire-soft);color:var(--ink);font-weight:700;font-size:14px;border:1.5px solid transparent}
.timer-chip svg{width:16px;height:16px}
.timer-chip.running{border-color:var(--cire)}
.cook-cta{position:fixed;left:0;right:0;bottom:calc(66px + var(--safe-b));z-index:30;padding:10px 16px;pointer-events:none;transition:transform .25s ease,opacity .25s}
.cook-cta .btn{pointer-events:auto;width:100%;max-width:520px;margin:0 auto;display:flex;height:56px;font-size:17px;box-shadow:0 10px 30px -8px rgba(18,48,74,.5)}
.cook-cta.hide{transform:translateY(30px);opacity:0;pointer-events:none}
.cook-cta.hide .btn{pointer-events:none}
.cook-inline{display:none;height:44px;font-size:15px}
@media (min-width:900px){.cook-cta{display:none}.cook-inline{display:inline-flex}}

.notes{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.notes li{background:var(--surface);border-radius:var(--r-box);padding:14px 16px;font-size:16px;border:1px solid var(--line)}
.shop{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-box);padding:16px;display:flex;gap:12px;align-items:center;text-decoration:none;margin-top:12px}
.shop .em{font-size:28px}
.shop small{display:block;color:var(--ink-3);font-size:14px}
.done-box{margin-top:36px;background:#12304A;color:#F2F4F3;border-radius:24px;padding:24px 20px;display:grid;gap:14px}
.done-box h2{font:400 30px/1.05 var(--serif);margin:0}
.done-box p{margin:0;opacity:.85}
.done-box .row{display:flex;gap:10px;flex-wrap:wrap}
.done-box .btn-line{border-color:#F2F4F3;color:#F2F4F3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .done-box{background:#1D3A55}}
.done-box .btn.ok{background:var(--algue);color:#fff;border-color:var(--algue)}
.breton{margin:36px auto 0;text-align:center;max-width:36ch}
.breton small{display:block;color:var(--ink-3);font-size:13px;font-weight:600;margin-bottom:6px}
.breton q{display:block;font:400 30px/1.1 var(--serif);quotes:"« " " »"}
.breton p{margin:8px 0 0;color:var(--ink-2);font-size:15px}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:42%;gap:12px;overflow-x:auto;margin:0 -16px;padding:0 16px 6px;scrollbar-width:none;scroll-snap-type:x mandatory}
.rail::-webkit-scrollbar{display:none}
.rail .card{scroll-snap-align:start}
@media (min-width:720px){.rail{grid-auto-flow:row;grid-template-columns:repeat(4,1fr);overflow:visible;margin:0;padding:0}}

/* ---------- mode cuisine ---------- */
.cook{position:fixed;inset:0;z-index:60;background:#12304A;color:#F2F4F3;display:flex;flex-direction:column;padding:calc(10px + var(--safe-t)) 0 calc(14px + var(--safe-b))}
.cook[hidden]{display:none}
.cook-top{display:flex;align-items:center;gap:8px;padding:0 12px}
.cook-top b{flex:1;font:400 19px/1.1 var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.85}
.cook .icon-btn{color:#F2F4F3}
.prog{display:flex;gap:4px;padding:10px 16px 0}
.prog i{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.18)}
.prog i.on{background:#FFC72C}
.cook-main{flex:1;overflow-y:auto;padding:24px 22px 16px;display:flex;flex-direction:column;-webkit-overflow-scrolling:touch}
.cook-main .wrapc{max-width:680px;width:100%;margin:auto 0;margin-inline:auto}
.cook-k{font-weight:700;color:#FFC72C;font-size:15px;margin-bottom:12px}
.cook-step{font-size:clamp(23px,6.4vw,34px);line-height:1.38;margin:0;letter-spacing:-.005em}
.cook-step a{color:#FFC72C}
.cook .timer-chip{background:#FFC72C;color:#12304A;height:46px;font-size:17px;padding:0 18px;margin-top:22px}
.cook .timer-chip svg{width:20px;height:20px}
.cook .ig label{font-size:19px;padding:13px 2px}
.cook .ig li{border-color:rgba(255,255,255,.14)}
.cook .ig input{border-color:rgba(255,255,255,.5);background:transparent}
.cook .ig input:checked{background:#2F9A6A;border-color:#2F9A6A}
.cook .ig input:checked+span{color:rgba(255,255,255,.5)}
.cook .ig-group{color:#FFC72C}
.cook h2{font:400 clamp(34px,9vw,52px)/1 var(--serif);margin:0 0 14px}
.cook-nav{display:flex;gap:10px;padding:10px 16px 0;max-width:720px;width:100%;margin:0 auto}
.cook-nav .btn{height:60px;font-size:18px;flex:1}
.cook-nav .prev{flex:0 0 60px;padding:0;border:1.5px solid rgba(255,255,255,.35);color:#F2F4F3}
.cook-nav .prev:disabled{opacity:.3}
.cook-end .row{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.cook-end .btn-line{border-color:#F2F4F3;color:#F2F4F3}
.cook-end .breton q{color:#F2F4F3}
.cook-end .breton p,.cook-end .breton small{color:rgba(242,244,243,.7)}

/* ---------- minuteurs ---------- */
.timers{position:fixed;z-index:70;left:50%;transform:translateX(-50%);bottom:calc(76px + var(--safe-b));display:flex;flex-direction:column;gap:8px;width:min(92vw,420px);pointer-events:none}
body.on-recipe .timers{bottom:calc(140px + var(--safe-b))}
body.cooking .timers{bottom:calc(96px + var(--safe-b))}
@media (min-width:720px){.timers{bottom:24px}body.on-recipe .timers{bottom:96px}}
.tm{pointer-events:auto;display:flex;align-items:center;gap:12px;background:var(--surface);color:var(--ink);border-radius:16px;padding:10px 10px 10px 16px;box-shadow:0 12px 32px -10px rgba(0,0,0,.45);border:1px solid var(--line)}
.tm .t{font:400 26px/1 var(--serif);font-variant-numeric:tabular-nums;min-width:78px}
.tm .l{flex:1;font-size:14px;color:var(--ink-2);line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tm.ring{background:var(--cire);color:#12304A;border-color:var(--cire);animation:ring 1s ease-in-out infinite}
.tm.ring .l{color:#12304A}
@keyframes ring{50%{transform:scale(1.03)}}
.tm button{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--sunk)}
.tm.ring button{background:rgba(18,48,74,.15)}
.tm button svg{width:18px;height:18px}

/* ---------- courses ---------- */
.page-h{padding:24px 0 6px}
.page-h h1{font:400 clamp(2.4rem,9vw,3.6rem)/1 var(--serif);margin:0 0 8px;letter-spacing:-.02em}
.page-h p{margin:0;color:var(--ink-2)}
.c-recs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 6px}
.c-rec{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px 4px 4px 12px;font-size:14px;font-weight:600}
.c-rec a{text-decoration:none}
.c-rec button{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--ink-3)}
.c-rec button svg{width:14px;height:14px}
.rayon{margin-top:24px}
.rayon h2{font:700 15px/1 var(--sans);color:var(--ink-2);margin:0 0 6px;display:flex;gap:8px;align-items:center}
.rayon .ig{background:var(--surface);border-radius:var(--r-box);padding:2px 14px;border:1px solid var(--line)}
.rayon .ig small{display:block;font-size:13.5px;color:var(--ink-3);font-weight:400;text-decoration:none}
.add-item{display:flex;gap:8px;margin-top:18px}
.add-item input{flex:1;height:50px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);padding:0 14px;font-size:16px;min-width:0}
.add-item input:focus{outline:none;border-color:var(--ink)}
.c-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}

/* ---------- feuilles ---------- */
.sheet-bg{position:fixed;inset:0;z-index:80;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:10px 20px calc(22px + var(--safe-b));animation:up .28s cubic-bezier(.2,.9,.3,1);max-height:92vh;overflow-y:auto}
@media (min-width:720px){.sheet-bg{align-items:center}.sheet{border-radius:24px;padding-bottom:24px}}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sheet h2{font:400 28px/1.1 var(--serif);margin:0 0 6px}
.sheet p{margin:0 0 16px;color:var(--ink-2)}
.sheet .opts{display:grid;gap:10px}
.sheet .opt{display:flex;align-items:center;gap:14px;padding:14px;border-radius:14px;background:var(--sel);font-weight:650;text-align:left;width:100%;text-decoration:none}
.sheet .opt .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--surface);flex:none;font-size:20px}
.sheet .opt .ic svg{width:22px;height:22px}
.sheet .opt small{display:block;font-weight:500;color:var(--ink-3);font-size:13.5px}
.qr{display:grid;place-items:center;background:#fff;border-radius:16px;padding:14px;margin:4px auto 10px;width:min(100%,280px)}
.qr svg{width:100%;height:auto}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:0}}

.toast{position:fixed;z-index:90;left:50%;top:calc(14px + var(--safe-t));transform:translate(-50%,-20px);background:var(--ink);color:var(--sel);padding:12px 18px;border-radius:14px;font-weight:600;font-size:15px;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center;box-shadow:0 10px 30px -10px rgba(0,0,0,.5)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.install{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 12px 12px 14px;margin-top:16px}
.install img{width:44px;height:44px;border-radius:11px}
.install div{flex:1;font-size:15px;line-height:1.3}
.install b{display:block}
.install .btn{height:40px;padding:0 14px;font-size:15px}
.install .x{width:36px;height:36px;display:grid;place-items:center;color:var(--ink-3)}

.view{animation:viewin .22s ease}
@keyframes viewin{from{opacity:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

<script>
const DATA = {"recettes":[{"id":"aubergine-rotie-miel-harissa","t":"Aubergine rôtie miel harissa","e":"🍆","type":"Entrée","base":["Veggie"],"orig":["Moyen-Orient"],"saison":["Été","Automne"],"effort":"Normal","pantheon":false,"intro":"","tip":"Saler dans les entailles avant de laquer, et aller jusqu'à l'affaissement franc — 40 min plutôt que 30. Une aubergine sous-cuite reste spongieuse.","serves":"4 en entrée","n":4,"ingr":[{"group":null,"items":["2 grosses aubergines","4 c. à soupe d'huile d'olive","2 c. à café de harissa","2 c. à soupe de miel","1 citron (jus et zeste)","4 c. à soupe de yaourt grec","½ bouquet de persil plat","1 gousse d'ail","Sel, poivre"]}],"steps":["**Préchauffer à 200 °C**, chaleur tournante.","**Entailler.** Couper les aubergines en deux dans la longueur, inciser la chair en croisillons profonds sans percer la peau. Saler généreusement en faisant pénétrer le sel dans les entailles.","**Laquer.** Mélanger huile d'olive, harissa, miel, sel et poivre. En badigeonner la chair au pinceau, en réservant une cuillère pour la fin. Le quadrillage sert à ça : il fait entrer la sauce au cœur.","**Rôtir 30 à 40 min**, chair vers le haut, jusqu'à ce qu'elles soient fondantes, caramélisées et un peu collantes sur les bords.","**Monter la sauce.** Yaourt grec, ail râpé, jus et zeste de citron, sel.","**Servir tiède.** Un trait du laquage réservé, la sauce au yaourt à côté ou en virgule, le persil ciselé par-dessus."],"notes":["Le sel dans les entailles fait sortir l'eau de l'aubergine : elle rôtit au lieu de cuire à la vapeur.","Sous-cuit, c'est spongieux. Il faut aller jusqu'à l'affaissement franc, quitte à pousser à 45 min.","Se mange aussi froid, préparé la veille."],"courses":[["Aubergine","fl",[0]],["Huile d'olive","se",[1]],["Harissa","se",[2]],["Miel","se",[3]],["Citron","fl",[4]],["Yaourt grec","fr",[5]],["Persil plat","fl",[6]],["Ail","fl",[7]],["Sel","ep",[8]],["Poivre","ep",[8]]],"shop":null,"img":{"s":"img/aubergine-rotie-miel-harissa-s-af4e49.webp","l":"img/aubergine-rotie-miel-harissa-af4e49.webp","c":"#706a5b"}},{"id":"bagel-poulet-bacon-avocat","t":"Bagel poulet bacon avocat","e":"🥯","type":"Sandwich & snack","base":["Poulet","Pain & pâte"],"orig":["Amériques"],"saison":["Toute saison"],"effort":"Express","pantheon":false,"intro":"","tip":"Le bagel toasté côté mie et le bacon vraiment croustillant : ce sont les deux textures qui tiennent le sandwich.","serves":"2 bagels","n":2,"ingr":[{"group":null,"items":["2 bagels nature","1 blanc de poulet","4 tranches de bacon","1 avocat mûr","½ citron (jus)","1 poignée de pousses d'épinards","1 tomate","¼ de concombre","2 c. à soupe de mayonnaise","1 c. à café de moutarde","1 c. à soupe d'huile d'olive","Sel, poivre"]}],"steps":["**Cuire le poulet.** Aplatir légèrement le blanc, saler, poivrer, poêle chaude avec l'huile d'olive, 5 à 6 min par face. Laisser reposer 5 min puis trancher.","**Griller le bacon** à sec dans la même poêle jusqu'à ce qu'il soit bien croustillant. Égoutter sur papier.","**Avocat.** L'écraser grossièrement à la fourchette avec le jus de citron, sel, poivre.","**Mayo moutarde.** Mélanger mayonnaise et moutarde.","**Toaster les bagels** coupés en deux, côté mie.","**Monter.** Base : mayo moutarde, épinards, bacon, poulet. Puis tomate, concombre, avocat écrasé sur le chapeau. Refermer."],"notes":["Joue pas au boulanger, va chez lui prendre le pain.","Le repos du poulet évite qu'il rende son jus dans le pain.","Un reste de [[Poulet rôti]] effiloché remplace très bien le blanc grillé."],"courses":[["Bagels","au",[0]],["Blanc de poulet","fr",[1]],["Bacon","fr",[2]],["Avocat","fl",[3]],["Épinards","fl",[5]],["Tomate","fl",[6]],["Concombre","fl",[7]],["Moutarde","se",[9]],["Mayonnaise","se",[8]],["Citron","fl",[4]],["Huile d'olive","se",[10]],["Sel","ep",[11]],["Poivre","ep",[11]]],"shop":null,"img":{"s":"img/bagel-poulet-bacon-avocat-s-484b1e.webp","l":"img/bagel-poulet-bacon-avocat-484b1e.webp","c":"#7c695d"}},{"id":"base-de-curry-japonais","t":"Base de curry japonais","e":"🥄","type":"Base","base":[],"orig":["Asie"],"saison":["Toute saison"],"effort":"Express","pantheon":false,"intro":"","tip":"Les épices vont dans le roux déjà cuit, juste le temps qu'elles embaument : elles brûlent vite. Le bouillon s'ajoute petit à petit jusqu'à une pâte bien épaisse.","serves":"4 portions","n":4,"ingr":[{"group":null,"items":["60 g de beurre","60 g de farine","2 c. à soupe de curry en poudre","1 c. à café de cumin moulu","150 à 200 ml de bouillon de volaille chaud"]}],"steps":["**Faire le roux.** Fondre le beurre à feu doux, ajouter la farine d'un coup et remuer sans arrêt pour cuire le roux quelques minutes.","**Ajouter les épices.** Verser le curry et le cumin dans le roux et cuire encore en remuant, le temps qu'ils embaument.","**Délayer au bouillon.** Verser le bouillon de volaille petit à petit en fouettant, jusqu'à obtenir une pâte bien épaisse.","**Lier le curry.** Ajouter cette base dans les légumes et la viande qui cuisent au bouillon : elle épaissit la sauce et donne le goût du [[Curry japonais]]."],"notes":["Roux « temps pour temps » : autant de beurre que de farine, en poids.","La base se prépare à l'avance et se garde quelques jours au frigo ; elle fige en refroidissant, elle se détend à la chaleur du curry.","Elle se congèle en portions, par exemple dans un bac à glaçons : il n'y a plus qu'à mettre les cubes dans le curry et les diluer."],"courses":[["Beurre","fr",[0]],["Farine","se",[1]],["Cumin","ep",[3]],["Curry","ep",[2]],["Bouillon de volaille","se",[4]]],"shop":null,"img":null},{"id":"bechamel","t":"Béchamel","e":"🥛","type":"Base","base":[],"orig":["France"],"saison":["Toute saison"],"effort":"Express","pantheon":false,"intro":"","tip":"Le bouillon cube de poule sale déjà : ne pas resaler avant d'avoir goûté.","serves":"1 L de sauce","n":1,"ingr":[{"group":null,"items":["60 g de beurre","60 g de farine","1 L de lait entier","1 bouillon cube de poule","Noix de muscade râpée","Poivre"]}],"steps":["**Faire le roux.** Faire fondre le beurre, ajouter la farine d'un coup et remuer. Laisser cuire 2 min à feu moyen, sans colorer, pour enlever le goût de farine crue.","**Ajouter le lait** petit à petit en fouettant, jusqu'à épaississement.","**Assaisonner.** Émietter le bouillon cube de poule, ajouter la muscade et le poivre."],"notes":["Pas de sel : le bouillon cube suffit.","Adapter l'épaisseur : 60 g de beurre et de farine par litre pour une sauce nappante (lasagnes), 80 g pour une béchamel épaisse (croque-monsieur, gratin qui doit tenir)."],"courses":[["Beurre","fr",[0]],["Farine","se",[1]],["Lait entier","fr",[2]],["Bouillon de volaille","se",[]],["Noix de muscade","ep",[4]],["Poivre","ep",[5]]],"shop":null,"img":null},{"id":"bouillon-de-volaille","t":"Bouillon de volaille","e":"🍲","type":"Base","base":["Poulet"],"orig":["France"],"saison":["Toute saison"],"effort":"Plus d'1 h","pantheon":false,"intro":"","tip":"Tout le goût vient de la coloration : colorer très fort les os, puis surtout déglacer à l'eau ou au bouillon bien froid (voire avec des glaçons si t'es chaud) en grattant bien les sucres. Ajuster à la sauce soja à la fin.","serves":"2 litres","n":2,"ingr":[{"group":null,"items":["1 carcasse de poulet avec les os (reste d'un poulet du dimanche), ou les os, cartilages, peau et un peu de viande d'un poulet désossé","2 c. à soupe d'huile neutre","1 oignon","4 gousses d'ail","3 cm de gingembre","1 carotte","1 c. à café de poivre en grains","2 feuilles de laurier","Sauce soja, pour ajuster l'assaisonnement à la fin","1 verre d'eau froide pour déglacer, puis de l'eau jusqu'aux deux tiers de la cocotte (environ 2,5 litres)"]}],"steps":["**Chauffer très fort.** Une cocotte ou une grosse casserole bien chaude, avec un fond d'huile neutre.","**Colorer la volaille.** Mettre les os, cartilages, peau et viande, et laisser colorer très fort d'un premier côté sans toucher : on va chercher les sucres. Une fois que ça a bien pris, mélanger pour colorer un peu partout. C'est ça qui donne le goût.","**Ajouter légumes et aromates.** Ail, oignon, gingembre, carotte, poivre en grains, laurier. Laisser chauffer jusqu'à avoir de beaux sucres au fond.","**Déglacer.** Verser un bon verre d'eau froide : ça fume et ça décolle les sucres. Gratter vraiment le fond pour tous les récupérer.","**Couvrir d'eau.** Remplir largement, jusqu'aux deux tiers de la cocotte.","**Porter à ébullition et écumer.** Retirer la petite mousse qui remonte.","**Cuire à feu très doux.** Aussi longtemps que tu veux : 2 à 3 heures donnent un bouillon léger, toute une nuit un bouillon qui a beaucoup plus de goût.","**Ajuster à la sauce soja.** Assaisonner le bouillon à la sauce soja plutôt qu'au sel : l'association soja, poulet, gingembre, c'est top."],"notes":["C'est une base : les aromates s'adaptent à ce que tu veux en faire. Ce qui compte, c'est la volaille bien colorée.","Réduit, réduit, réduit puis monté au beurre, il fait une sauce.","Gardé léger, il sert à cuire des légumes pour un velouté, comme le [[Velouté de butternut]] : on cuit la butternut dedans et on mixe."],"courses":[["Poulet entier","fr",[]],["Huile neutre","se",[1]],["Ail","fl",[3]],["Oignon","fl",[2]],["Gingembre","fl",[4]],["Carotte","fl",[5]],["Poivre","ep",[6]],["Laurier","ep",[7]],["Sauce soja","se",[8]]],"shop":null,"img":null},{"id":"celeri-roti","t":"Céleri rôti","e":"🥔","type":"Entrée","base":["Veggie"],"orig":["France"],"saison":["Hiver"],"effort":"Plus d'1 h","pantheon":false,"intro":"","tip":"Cuit entier dans sa peau et arrosé de beurre : se fier au couteau, pas au minuteur.","serves":"4 portions","n":4,"ingr":[{"group":null,"items":["1 céleri-rave (~1 kg)","2 c. à soupe d'huile d'olive","80 g de beurre","4 gousses d'ail, écrasées","6 branches de thym","40 g de noisettes","30 g de parmesan","½ citron (jus)","Sel, poivre"]}],"steps":["**Préparer le céleri.** Le brosser sous l'eau sans l'éplucher, couper les radicelles. Le frotter d'huile d'olive et de sel.","**Première cuisson.** Dans un plat, four à 180 °C, 1 h 30, en l'arrosant de temps en temps avec le jus du plat.","**Arroser au beurre.** Ajouter le beurre, l'ail et le thym dans le plat. Poursuivre 45 min à 1 h en arrosant de beurre toutes les 15 min. Il est prêt quand un couteau s'enfonce sans résistance jusqu'au cœur.","**Torréfier les noisettes** à sec, les concasser.","**Beurre noisette.** Récupérer le beurre du plat, le chauffer dans une casserole jusqu'à ce qu'il mousse et sente la noisette, ajouter le jus de citron.","**Servir.** Couper le céleri en tranches épaisses ou en quartiers, napper de beurre noisette, parsemer de noisettes, de copeaux de parmesan, de feuilles de thym et de poivre."],"notes":["La peau protège la chair et la fait cuire à l'étouffée : on ne la mange pas, ou seulement là où elle est bien caramélisée.","Temps très variable selon la taille : se fier au couteau, pas à la montre."],"courses":[["Céleri-rave","fl",[0]],["Huile d'olive","se",[1]],["Beurre","fr",[2]],["Ail","fl",[3]],["Thym","ep",[4]],["Noisettes","se",[5]],["Parmesan","fr",[6]],["Citron","fl",[7]],["Sel","ep",[8]],["Poivre","ep",[8]]],"shop":null,"img":null},{"id":"chakchouka-verte-ou-rouge","t":"Chakchouka verte ou rouge","e":"🍳","type":"Plat","base":["Veggie"],"orig":["Moyen-Orient"],"saison":["Toute saison"],"effort":"Express","pantheon":false,"intro":"","tip":"Réduire la base 15-20 min à découvert avant de casser les œufs. Trop liquide, les œufs se noient et ne prennent jamais correctement.","serves":"4 personnes","n":4,"ingr":[{"group":"Base commune","items":["6 œufs","1 oignon","3 gousses d'ail","3 c. à soupe d'huile d'olive","1 c. à café de cumin","1 c. à café de paprika fumé","1 bouquet de coriandre","Sel, poivre"]},{"group":"Version rouge","items":["2 poivrons rouges","800 g de tomates concassées","1 c. à café de harissa"]},{"group":"Version verte","items":["2 courgettes","1 poivron vert","200 g d'épinards","150 g de feta"]}],"steps":["**Suer l'oignon** en lamelles dans l'huile d'olive, 8 min à feu moyen, jusqu'au fondant. Ajouter l'ail émincé et les épices, 1 min de plus — les épices doivent grésiller dans le gras, pas être noyées.","**Les légumes.** Rouge : poivrons en lanières, 10 min, puis les tomates concassées. Verte : courgettes en demi-lunes et poivron vert, 10 min, puis les épinards jusqu'à ce qu'ils tombent.","**Réduire 15 à 20 min** à découvert. C'est l'étape où on a envie d'aller vite : prends ton temps, la sauce doit être épaisse, pas liquide, sinon les œufs se noient et ne prennent jamais.","**Assaisonner** — harissa pour la rouge, feta émiettée pour la verte — et goûter maintenant, pas après.","**Creuser des puits** à la cuillère et y casser les œufs. Saler les jaunes.","**Couvrir et cuire 6 à 8 min** à feu doux. Blancs pris, jaunes encore coulants.","**Coriandre ciselée**, du pain, et on sert dans la poêle."],"notes":["Le tout se joue sur la réduction. Une base trop liquide donne des œufs qui flottent et une chakchouka qui rend de l'eau dans l'assiette.","Casser chaque œuf dans un ramequin avant de le glisser dans son puits : un jaune percé se remarque tout de suite.","La base se prépare la veille et se réchauffe. On n'ajoute les œufs qu'au moment de servir."],"courses":[["Œufs","fr",[0]],["Oignon","fl",[1]],["Ail","fl",[2]],["Huile d'olive","se",[3]],["Cumin","ep",[4]],["Paprika fumé","ep",[5]],["Coriandre","fl",[6]],["Poivron","fl",[8,12]],["Tomates concassées","se",[9]],["Harissa","se",[10]],["Courgette","fl",[11]],["Épinards","fl",[13]],["Feta","fr",[14]],["Sel","ep",[7]],["Poivre","ep",[7]]],"shop":null,"img":null},{"id":"chou-farci","t":"Chou farci","e":"🥬","type":"Plat","base":["Poulet"],"orig":["Fusion maison"],"saison":["Hiver"],"effort":"Plus d'1 h","pantheon":false,"intro":"","tip":"Serrer au maximum dans le film, chasser l'air à l'aiguille, puis faire une deuxième couche. Cuire à frémissement, 20 à 25 min.","serves":"6 choux individuels","n":6,"ingr":[{"group":null,"items":["1 chou vert (frisé) : les plus belles feuilles vertes + une petite partie du cœur","Bouillon de volaille : pour l'eau de cuisson et pour le jus","Sel","1 noix de beurre, pour finir le jus","Film alimentaire spécial cuisson"]},{"group":"Farce (celle des raviolis wonton)","items":["1 kg de hauts de cuisse de poulet (≈ 750 g désossés, sans peau)","2 c. à soupe d'huile de sésame","3 c. à soupe de sauce soja","1 bouquet de coriandre","4 ou 5 cébettes","3 gousses d'ail","5 cm de gingembre frais"]}],"steps":["**Blanchir les feuilles.** Détacher les plus belles feuilles vertes, les blanchir, puis les plonger dans l'eau glacée. Égoutter et sécher.","**Cuire une partie du cœur.** Une petite partie seulement, puis la concasser.","**Faire la farce.** Poulet mixé par à-coups avec le sésame et le soja, puis coriandre, cébette, ail et gingembre mélangés à la main. Incorporer le cœur de chou concassé. Pocher une boulette témoin pour rectifier l'assaisonnement.","**Monter en louche.** Tapisser une louche de film, y disposer les feuilles vertes bien collées, remplir de farce bien pressée, puis refermer avec les feuilles.","**Serrer.** Refermer le film et tourner pour serrer au maximum. En serrant, piquer quelques fois à l'aiguille pour chasser les bulles d'air, puis faire un nœud et ajouter une deuxième couche de film pour que ce soit étanche.","**Cuire.** Dans un bouillon salé, à frémissement plutôt qu'à gros bouillon, 20 à 25 min. Ou à la vapeur.","**Faire le jus.** Réduire du bouillon dans une poêle, y poser les choux déballés sur leur base pour les finir, monter avec une noix de beurre et napper.","**Servir** coupés en deux."],"notes":["Pas de trous dans le film pour la cuisson : l'eau entrerait et détremperait le chou. Les piqûres d'aiguille servent seulement à chasser l'air avant la deuxième couche.","La volaille est crue : vérifier la cuisson à cœur la première fois (en ouvrir un, ou 74 °C au thermomètre)."],"courses":[["Chou vert","fl",[0]],["Hauts de cuisse de poulet","fr",[5]],["Huile de sésame","se",[6]],["Sauce soja","se",[7]],["Coriandre","fl",[8]],["Cébette","fl",[9]],["Ail","fl",[10]],["Gingembre","fl",[11]],["Bouillon de volaille","se",[1]],["Beurre","fr",[3]],["Sel","ep",[2]]],"shop":null,"img":{"s":"img/chou-farci-s-c823ff.webp","l":"img/chou-farci-c823ff.webp","c":"#746c5a"}},{"id":"chou-fleur-roti","t":"Chou-fleur rôti","e":"🥦","type":"Entrée","base":["Veggie"],"orig":["Moyen-Orient"],"saison":["Automne","Hiver"],"effort":"Normal","pantheon":false,"intro":"","tip":"220 °C et une plaque non surchargée, sinon ça vapote au lieu de rôtir. La sauce tahini se fige quand on ajoute le citron : c'est l'émulsion, l'eau froide la rattrape.","serves":"4 en entrée","n":4,"ingr":[{"group":null,"items":["1 chou-fleur","4 c. à soupe d'huile d'olive","1 c. à café de cumin","1 c. à café de paprika fumé","3 c. à soupe de tahini","1 citron","1 gousse d'ail","3 c. à soupe d'eau froide","2 c. à soupe d'amandes effilées","½ bouquet de persil plat","Sel, poivre"]}],"steps":["**Préchauffer à 220 °C.** Bien chaud : c'est la température qui fait dorer le chou-fleur.","**Détailler.** Retirer les feuilles, couper le chou-fleur en bouquets épais, garder le trognon coupé en tranches — il rôtit très bien et beaucoup le jettent.","**Enrober.** Huile d'olive, cumin, paprika fumé, sel, poivre. Bien masser pour que chaque bouquet soit huilé.","**Rôtir 25 à 30 min** en une seule couche, sans se chevaucher, en retournant à mi-cuisson. Les pointes doivent être brunes, presque noires par endroits.","**Sauce tahini.** Fouetter tahini, jus de citron, ail râpé et sel, puis détendre à l'eau froide cuillère par cuillère. Elle va d'abord se figer, puis redevenir lisse — c'est normal, il faut insister.","**Griller les amandes** à sec dans une poêle, 2 min.","**Servir.** Chou-fleur chaud, sauce en dessous ou à côté, amandes et persil par-dessus."],"notes":["Une plaque surchargée fait vapoter le chou-fleur. Deux plaques valent mieux qu'une trop pleine.","Le trognon a le meilleur goût une fois rôti. À ne pas jeter."],"courses":[["Chou-fleur","fl",[0]],["Huile d'olive","se",[1]],["Cumin","ep",[2]],["Paprika fumé","ep",[3]],["Tahini","se",[4]],["Citron","fl",[5]],["Ail","fl",[6]],["Amandes effilées","se",[8]],["Persil plat","fl",[9]],["Sel","ep",[10]],["Poivre","ep",[10]]],"shop":null,"img":null},{"id":"croissant-aplati-grille-au-miel","t":"Croissant aplati grillé au miel","e":"🥐","type":"Sandwich & snack","base":["Pain & pâte"],"orig":["Fusion maison"],"saison":["Toute saison"],"effort":"Express","pantheon":false,"intro":"","tip":"Un croissant de la veille, bien écrasé, et un feu moyen : le miel brûle vite.","serves":"2 croissants","n":2,"ingr":[{"group":null,"items":["2 croissants au beurre (de la veille, c'est parfait)","20 g de beurre","2 c. à soupe de miel","1 c. à soupe de sucre","Fleur de sel"]}],"steps":["**Aplatir.** Poser le croissant entre deux feuilles de papier cuisson et l'écraser au rouleau à pâtisserie (ou avec une casserole) jusqu'à 1 cm d'épaisseur.","**Badigeonner.** Faire fondre le beurre avec la moitié du miel, en badigeonner les deux faces du croissant. Saupoudrer de sucre.","**Griller.** Poêle à feu moyen, poser le croissant et le presser avec une autre poêle ou une spatule, 2 min par face, jusqu'à ce qu'il soit doré et caramélisé.","**Finir.** Arroser du reste de miel, une pincée de fleur de sel, et manger tout de suite, encore croustillant."],"notes":["Surveiller le feu : le miel et le sucre brûlent vite.","Un croissant rassis marche mieux qu'un frais : il s'aplatit sans se déchirer."],"courses":[["Croissants","au",[0]],["Beurre","fr",[0,1]],["Miel","se",[2]],["Sucre","se",[3]],["Sel","ep",[4]]],"shop":null,"img":null},{"id":"croque-au-bleu-et-tomate-confite","t":"Croque au bleu et tomate confite","e":"🥪","type":"Sandwich & snack","base":["Porc","Fromage","Pain & pâte"],"orig":["Fusion maison"],"saison":["Toute saison"],"effort":"Express","pantheon":false,"intro":"","tip":"Un feu moyen et la poêle pressée : le bleu doit fondre avant que le pain ne brûle. Avec une salade acidulée à côté pour trancher le gras.","serves":"2 croques","n":2,"ingr":[{"group":null,"items":["4 tranches de pain de mie","4 tranches de jambon blanc","100 g de fromage bleu (fourme d'Ambert ou gorgonzola)","6 tomates confites à l'huile","20 g de beurre","Poivre"]},{"group":"Salade","items":["2 poignées de roquette","8 tomates cerises","¼ d'oignon rouge","Quelques feuilles de persil plat","2 c. à soupe d'huile d'olive","1 c. à café de vinaigre balsamique"]}],"steps":["**Garnir.** Sur deux tranches : jambon plié, bleu émietté, tomates confites égouttées et coupées en lanières, poivre. Refermer.","**Beurrer l'extérieur** des tranches.","**Cuire à la poêle**, feu moyen, 3 à 4 min par face en pressant avec une spatule ou une casserole, jusqu'à ce que le pain soit bien doré et que le bleu coule.","**Salade.** Roquette, tomates cerises coupées en deux, oignon rouge émincé, persil, huile d'olive et balsamique.","**Couper en deux** en diagonale et servir avec la salade."],"notes":["Le bleu sale déjà : pas de sel dans le croque."],"courses":[["Pain de mie","au",[0]],["Jambon blanc","fr",[1]],["Bleu","fr",[2]],["Tomates confites","se",[3]],["Beurre","fr",[4]],["Roquette","fl",[6]],["Tomate","fl",[3,7]],["Oignon rouge","fl",[8]],["Persil plat","fl",[9]],["Huile d'olive","se",[10]],["Vinaigre balsamique","se",[11]],["Poivre","ep",[5]]],"shop":null,"img":{"s":"img/croque-au-bleu-et-tomate-confite-s-13d666.webp","l":"img/croque-au-bleu-et-tomate-confite-13d666.webp","c":"#a68463"}},{"id":"cuisson-du-riz","t":"Cuisson du riz","e":"🍚","type":"Base","base":["Pâtes & riz"],"orig":["Asie"],"saison":["Toute saison"],"effort":"Express","pantheon":false,"intro":"On va éviter d'acheter un cuiseur à riz de con à 100 balles. Tu gardes ta casserole, tu laves ton riz, tu ne soulèves pas le couvercle, et on est bons.","tip":"Ne jamais soulever le couvercle ni mélanger : 12 min feu mini, puis 10 min hors du feu.","serves":"2 portions","n":2,"ingr":[{"group":null,"items":["150 g de riz parfumé (thaï / jasmin en général, mais n'importe quel riz long marche)","Eau : juste un peu plus que le riz (règle de la phalange)"]}],"steps":["**Laver le riz.** Le rincer une, deux, trois, quatre fois, jusqu'à ce que l'eau devienne à peu près claire. Tous les riz se lavent, sauf le riz rond pour un risotto ou un riz au lait.","**Couvrir d'eau.** Mettre le riz dans la casserole et le recouvrir d'un tout petit peu plus d'eau qu'il y a de riz. Règle de la phalange : en posant le doigt sur le riz, l'eau doit dépasser un peu.","**Porter à ébullition.**","**Feu au minimum, couvrir.** Dès l'ébullition, baisser le feu au minimum et mettre le couvercle.","**Cuire 12 minutes.** Mettre un timer (10 minutes minimum, 12 c'est mieux).","**Reposer 10 minutes hors du feu.** Retirer la casserole du feu, sans ouvrir, et attendre encore 10 minutes. Le riz est prêt."],"notes":["Pendant toute la cuisson et le repos : ne jamais mélanger, ne pas lever le couvercle, ne pas toucher. C'est ça qui fait un riz parfait.","Le riz rond (risotto, riz au lait) ne se lave pas : on garde son amidon.","Compter environ 70 à 80 g de riz cru par personne."],"courses":[["Riz jasmin","se",[0]]],"shop":null,"img":null},{"id":"curry-japonais","t":"Curry japonais","e":"🍛","type":"Plat","base":["Poulet","Pâtes & riz"],"orig":["Asie"],"saison":["Automne","Hiver"],"effort":"Normal","pantheon":false,"intro":"","tip":"Diluer la base un peu plus liquide que voulu : ça épaissit à la cuisson. Trop épais, on ajoute du bouillon ; pas assez, un peu plus de base.","serves":"4 portions","n":4,"ingr":[{"group":null,"items":["600 g de hauts de cuisse de poulet","3 pommes de terre","¼ de potimarron (≈ 300 g), avec la peau","1 oignon","3 gousses d'ail","3 cm de gingembre","1 c. à soupe d'huile neutre","800 ml de [[Bouillon de volaille]], plus un peu pour ajuster","1 fournée de [[Base de curry japonais]], fraîche ou en cubes congelés","300 g de riz blanc ([[Cuisson du riz]])","2 cébettes","1 c. à soupe de graines de sésame"]}],"steps":["**Saisir le poulet.** Le marquer des deux côtés sans le cuire jusqu'au bout, puis le couper en bons morceaux, pas trop petits.","**Couper les légumes.** Pommes de terre et potimarron en morceaux, de la même taille que le poulet.","**Faire revenir les aromates.** Dans un faitout, râper l'ail et le gingembre avec l'oignon, et les faire revenir quelques minutes dans l'huile chaude.","**Ajouter le reste.** Pommes de terre, potimarron et poulet, puis couvrir de bouillon à hauteur, voire un peu plus.","**Lier à la base de curry.** Ajouter la base de curry : fraîche, elle est pâteuse et se met pâte par pâte ; congelée en cubes, il n'y a plus qu'à les mettre dedans. La diluer jusqu'à la consistance voulue, entre la béchamel et la soupe, plutôt un peu plus liquide car ça épaissit à la cuisson.","**Cuire en ajustant.** Laisser cuire jusqu'à ce que les légumes et le poulet soient cuits. Pas assez épais : un peu plus de base. Trop épais : un peu de bouillon.","**Servir.** Avec un riz blanc, de la cébette ciselée et du sésame dessus."],"notes":["Le potimarron se garde avec sa peau : il fond un peu et épaissit la sauce.","Encore meilleur le lendemain ; détendre d'un peu de bouillon au réchauffage."],"courses":[["Hauts de cuisse de poulet","fr",[0]],["Pommes de terre","fl",[1]],["Potimarron","fl",[2]],["Oignon","fl",[3]],["Ail","fl",[4]],["Gingembre","fl",[5]],["Huile neutre","se",[6]],["Bouillon de volaille","se",[7]],["Beurre","fr",[]],["Farine","se",[]],["Curry","ep",[]],["Cumin","ep",[]],["Riz jasmin","se",[]],["Cébette","fl",[10]],["Graines de sésame","se",[11]]],"shop":null,"img":{"s":"img/curry-japonais-s-bbf81e.webp","l":"img/curry-japonais-bbf81e.webp","c":"#9a8762"}},{"id":"donburi-asperge","t":"Donburi asperge","e":"🥢","type":"Plat","base":["Veggie","Pâtes & riz"],"orig":["Asie"],"saison":["Printemps"],"effort":"Express","pantheon":false,"intro":"","tip":"Les asperges se saisissent à feu vif, sans trop remuer pour qu'elles colorent, puis se laquent hors du feu. Le jaune d'œuf cru se pose au dernier moment : c'est lui la sauce.","serves":"2 portions","n":2,"ingr":[{"group":null,"items":["150 g de riz jasmin","1 botte d'asperges vertes (≈ 500 g)","2 gousses d'ail","1 c. à soupe d'huile neutre","2 c. à soupe de sauce soja","1 c. à soupe de mirin","1 c. à café de sucre","1 c. à café d'huile de sésame","1 pincée de piment en flocons","2 jaunes d'œufs très frais","½ botte de ciboulette","1 c. à soupe de graines de sésame","½ citron vert (zeste)"]}],"steps":["**Lancer le riz.** Cuit et gardé au chaud.","**Préparer les asperges.** Casser les talons là où ils cèdent, couper les tiges en tronçons de 4 cm en biais, garder les pointes entières.","**Mélanger la sauce.** Soja, mirin, sucre, huile de sésame.","**Saisir.** Poêle ou wok très chaud avec l'huile neutre, les asperges en une couche, 3 à 4 min sans trop remuer pour qu'elles colorent. Ajouter l'ail émincé et le piment 30 secondes.","**Laquer.** Verser la sauce, remuer 30 secondes jusqu'à ce qu'elle enrobe, et retirer du feu.","**Monter le bol.** Riz, asperges par-dessus, un puits au centre avec le jaune d'œuf cru. Ciboulette, sésame et zeste de citron vert."],"notes":["Des asperges fines cuisent en 2 min ; des grosses peuvent demander 1 min de plus à couvert."],"courses":[["Asperges vertes","fl",[1]],["Ail","fl",[2]],["Huile de friture","se",[]],["Sauce soja","se",[4]],["Mirin","se",[5]],["Sucre","se",[6]],["Huile de sésame","se",[7]],["Piment en flocons","ep",[8]],["Œufs","fr",[9]],["Ciboulette","fl",[10]],["Graines de sésame","se",[11]],["Citron vert","fl",[12]],["Riz jasmin","se",[0]]],"shop":null,"img":{"s":"img/donburi-asperge-s-bedac6.webp","l":"img/donburi-asperge-bedac6.webp","c":"#816c40"}},{"id":"flan-vanille","t":"Flan vanille","e":"🍮","type":"Dessert","base":[],"orig":["France"],"saison":["Toute saison"],"effort":"Plus d'1 h","pantheon":false,"intro":"","tip":"Mixer la crème pâtissière au mixeur plongeant avant d'enfourner : elle devient bien lisse, et c'est ça qui donne la bonne texture au flan.","serves":"8 parts (cercle de 22 cm, 5 cm de haut)","n":8,"ingr":[{"group":null,"items":["700 g de lait entier","300 g de crème liquide entière","1 gousse de vanille","4 œufs","150 g de sucre","90 g de maïzena","1 pâte feuilletée pur beurre"]}],"steps":["**Foncer le cercle** avec la pâte feuilletée, en la laissant dépasser un peu. Piquer, filmer, réserver au congélateur 30 min.","**Infuser la vanille.** Porter le lait, la crème, la gousse fendue et grattée à ébullition. Laisser infuser 15 min hors du feu, retirer la gousse.","**Cuire l'appareil.** Fouetter œufs, sucre et maïzena. Verser le lait chaud dessus en fouettant, remettre le tout dans la casserole et cuire en fouettant sans arrêt jusqu'à épaississement, puis 1 min après les premiers bouillons.","**Garnir.** Préchauffer à 170 °C. Verser l'appareil chaud dans le fond de pâte et lisser.","**Cuire** 55 min à 1 h à 170 °C, jusqu'à ce que le dessus soit bien brun et que le centre tremble encore légèrement.","**Refroidir** à température ambiante, puis au moins 6 h au frigo (idéalement une nuit) avant de démouler et de couper."],"notes":["La coupe se fait au couteau trempé dans l'eau chaude, essuyé entre chaque part.","Chaud, il ne se tient pas encore : après une nuit au frigo, il se coupe tout seul."],"courses":[["Sucre","se",[4]],["Crème liquide","fr",[1]],["Lait entier","fr",[0]],["Gousse de vanille","se",[2]],["Œufs","fr",[3]],["Maïzena","se",[5]],["Pâte feuilletée","fr",[6]]],"shop":null,"img":{"s":"img/flan-vanille-s-70dff1.webp","l":"img/flan-vanille-70dff1.webp","c":"#665645"}},{"id":"focaccia","t":"Focaccia","e":"🫓","type":"Base","base":["Pain & pâte"],"orig":["Italie"],"saison":["Toute saison"],"effort":"Plus d'1 h","pantheon":true,"intro":"Si t'as la flemme, file chez [Novettino](https://www.novettino.com) : je te conseille la Campagnolo.","tip":"Une fermentation longue au frigo et beaucoup d'huile dans la plaque : c'est ce qui fait le dessous croustillant.","serves":"1 plaque (~30 × 40 cm)","n":1,"ingr":[{"group":null,"items":["500 g de farine (T65 ou tipo 0)","400 g d'eau tiède (80 % d'hydratation)","4 g de levure boulangère sèche (ou 10 g fraîche)","12 g de sel","30 g d'huile d'olive dans la pâte","50 g d'huile d'olive pour la plaque et le dessus","2 branches de romarin","Fleur de sel"]}],"steps":["**Mélanger.** Délayer la levure dans l'eau, ajouter la farine, mélanger jusqu'à ce qu'il n'y ait plus de farine sèche. Repos 20 min (autolyse).","**Ajouter sel et huile.** Pétrir à la main mouillée, en pinçant la pâte, jusqu'à ce que tout soit absorbé.","**Rabats.** 4 séries de rabats toutes les 30 min : saisir un bord, l'étirer vers le haut, le rabattre, tourner le bol d'un quart. La pâte devient lisse et élastique.","**Fermentation froide.** Couvrir et mettre au frigo 12 à 24 h.","**Mettre en plaque.** Huiler généreusement la plaque, y verser la pâte, l'étirer doucement vers les bords. Laisser pousser 2 à 3 h à température ambiante, jusqu'à ce qu'elle double et fasse des bulles.","**Alvéoler.** Arroser d'huile d'olive, enfoncer les doigts jusqu'au fond partout. Parsemer de romarin et de fleur de sel.","**Cuire** à 240 °C, 20 à 25 min, jusqu'à ce que ce soit bien doré. Démouler tout de suite sur une grille pour que le dessous reste croustillant."],"notes":["Plus la fermentation au frigo est longue, plus la mie est goûteuse et alvéolée.","La pâte colle : c'est normal. On la travaille avec les mains mouillées, jamais en ajoutant de la farine.","Se congèle très bien en parts, à réchauffer 5 min au four."],"courses":[["Farine","se",[0]],["Levure boulangère","se",[2]],["Sel","ep",[3,7]],["Huile d'olive","se",[4,5]],["Romarin","fl",[6]]],"shop":null,"img":{"s":"img/focaccia-s-978aa5.webp","l":"img/focaccia-978aa5.webp","c":"#9f9383"}},{"id":"grilled-cheese","t":"Grilled cheese","e":"🧀","type":"Sandwich & snack","base":["Fromage","Pain & pâte"],"orig":["Amériques"],"saison":["Toute saison"],"effort":"Express","pantheon":false,"intro":"","tip":"Feu doux, 10 min en tout. Et de la mayonnaise à l'extérieur plutôt que du beurre : ça dore plus régulièrement sans brûler.","serves":"2 sandwichs","n":2,"ingr":[{"group":null,"items":["4 tranches de pain de mie épaisses","150 g de cheddar râpé","2 c. à soupe de mayonnaise","20 g de beurre","Poivre"]}],"steps":["**Râper le fromage.** En tranches, il fond mal et glisse ; râpé, il fond uniformément et fait joint entre les deux pains.","**Tartiner la mayonnaise sur les faces extérieures** des tranches. Le corps gras de la mayo tient une chaleur plus haute que le beurre et dore sans brûler.","**Monter** : pain face mayo vers l'extérieur, fromage généreux, poivre, deuxième tranche.","**Cuire à feu doux**, 4 à 5 min par face, avec une noisette de beurre dans la poêle pour le goût. Presser légèrement à la spatule.","**Vérifier** que le fromage a coulé avant de retourner une dernière fois. Feu trop vif : pain noir, fromage intact.","**Couper en diagonale** et manger tout de suite."],"notes":["Le secret, c'est le feu doux : une dizaine de minutes, le temps que le fromage fonde avant que le pain brûle.","Un mélange de fromages fond mieux qu'un seul : cheddar pour le goût, un fromage plus gras type comté ou gruyère pour le filant.","Un pain de mie épais et un peu rassis tient mieux qu'un pain frais et mou."],"courses":[["Pain de mie","au",[0]],["Cheddar","fr",[1]],["Mayonnaise","se",[2]],["Beurre","fr",[3]],["Poivre","ep",[4]]],"shop":null,"img":null},{"id":"gua-bao-au-porc-braise","t":"Gua bao au porc braisé","e":"🥟","type":"Sandwich & snack","base":["Porc","Pain & pâte"],"orig":["Asie"],"saison":["Toute saison"],"effort":"Plus d'1 h","pantheon":false,"intro":"","tip":"Le porc braisé se prépare à l'avance : le jour J, il ne reste que le montage.","serves":"8 gua bao","n":8,"ingr":[{"group":null,"items":["8 pains gua bao du commerce","~350 g de [[Porc braisé au soja]] (soit 500 g de poitrine crue), ~45 g par bao","60 g de mayonnaise","20 g de sriracha","½ concombre en julienne (~150 g)","40 g de cacahuètes concassées","20 g d'oignons frits","½ botte de coriandre fraîche"]}],"steps":["**Préparer le porc braisé** selon sa fiche : [[Porc braisé au soja]].","**Réchauffer les pains** (vapeur ou micro-ondes, selon le paquet).","**Étaler un fond de mayo sriracha** (mayonnaise + sriracha mélangées) dans chaque pain.","**Garnir** : concombre en julienne, puis le porc braisé.","**Finir** avec les cacahuètes, les oignons frits et la coriandre. Servir aussitôt."],"notes":["Par bao, compter environ 45 g de porc, 10 g de mayo sriracha, 20 g de concombre, 5 g de cacahuètes et 2-3 g d'oignons frits."],"courses":[["Pains gua bao","au",[0]],["Mayonnaise","se",[2]],["Sriracha","se",[3]],["Concombre","fl",[4]],["Cacahuètes","se",[5]],["Oignons frits","se",[6]],["Coriandre","fl",[7]],["Poitrine de porc","fr",[]],["Ail","fl",[]],["Gingembre","fl",[]],["Sauce soja","se",[]],["Sucre","se",[]],["Cannelle","ep",[]],["Badiane","ep",[]]],"shop":null,"img":null},{"id":"huile-pimentee-mala","t":"Huile pimentée mala","e":"🌶️","type":"Sauce & condiment","base":["Veggie"],"orig":["Asie"],"saison":["Toute saison"],"effort":"Express","pantheon":false,"intro":"","tip":"Ne la fais pas. Va l'acheter chez Chen Market à Belleville : c'est meilleur et ça va plus vite.","serves":"1 pot","n":1,"ingr":[{"group":null,"items":["1 ticket de métro","Quelques euros"]}],"steps":["**Ne la fais pas.** Sérieux, ça sert à rien. Torréfier le poivre de Sichuan, infuser les épices, filtrer l'huile, tout ça pour un résultat moins bon que ce qu'on trouve en rayon.","**File chez Chen Market** à Belleville. Le bouton Itinéraire t'y emmène.","**Prends un pot.** Celui à l'étiquette rouge, avec le panda karatéka dessus. Prends-en deux tant que t'y es.","**Rentre et mets-en partout** : nouilles, raviolis, œufs, riz."],"notes":[],"courses":[],"shop":{"name":"Chen Market Belleville","address":"120 rue du Faubourg du Temple, 75011 Paris","hint":"métro Belleville"},"img":null},{"id":"karaage","t":"Karaage","e":"🍗","type":"Plat","base":["Poulet"],"orig":["Asie"],"saison":["Toute saison"],"effort":"Normal","pantheon":false,"intro":"Si tu l'as foiré, tu peux toujours commander chez [Karaage-ya](https://deliveroo.fr/fr/menu/paris/2eme-bourse/karaage-ya-bourse) ou aller chez [Haikara Deep Fried](https://www.google.com/maps/dir/?api=1&destination=Haikara+Deep+Fried%2C+60+Bd+Voltaire%2C+75011+Paris).","tip":"Double friture 160 °C puis 180 °C, avec 5 min de repos entre les deux. Et enrober de fécule au dernier moment, sur des morceaux égouttés mais pas essuyés.","serves":"4 personnes","n":4,"ingr":[{"group":null,"items":["800 g de hauts de cuisse de poulet désossés, avec la peau","3 c. à soupe de sauce soja","2 c. à soupe de saké","1 c. à soupe de mirin","4 cm de gingembre frais","2 gousses d'ail","1 œuf","100 g de fécule de pomme de terre","Huile de friture","1 citron","Poivre"]}],"steps":["**Couper le poulet** en bouchées de 3 à 4 cm, peau comprise. Des morceaux réguliers, sinon les petits sont secs quand les gros sont crus.","**Mariner.** Soja, saké, mirin, gingembre et ail râpés, poivre, l'œuf battu. Mélanger à la main et laisser 30 min au frais, jusqu'à 2 h.","**Enrober au dernier moment.** Égoutter sans essuyer — la marinade résiduelle fait accrocher la fécule. Rouler chaque morceau dans la fécule, secouer l'excédent. Une couche fine et non tassée : c'est ce qui donne la croûte aérée.","**Première friture, 160 °C, 3 à 4 min.** Peu de morceaux à la fois. La croûte doit rester pâle — on cuit le cœur, pas la couleur.","**Repos 5 min** sur une grille. La chaleur résiduelle finit la cuisson et la surface sèche.","**Seconde friture, 180 °C, 1 à 2 min**, jusqu'au doré franc et craquant.","**Égoutter sur grille**, jamais sur papier — le dessous ramollit. Servir avec des quartiers de citron."],"notes":["De la cuisse, pas du blanc. Le blanc ressort sec et filandreux à la friture, quoi qu'on fasse.","Ne pas surcharger le bain : la température chute, le poulet pompe l'huile et devient gras.","La fécule de pomme de terre (katakuriko) donne une croûte plus dentelée que la maïzena. La maïzena dépanne très bien, la croûte est juste un peu moins dentelée.","Les 5 min de repos entre les deux bains, c'est ce qui garde le croustillant longtemps."],"courses":[["Hauts de cuisse de poulet","fr",[0]],["Sauce soja","se",[1]],["Saké","se",[2]],["Mirin","se",[3]],["Gingembre","fl",[4]],["Ail","fl",[5]],["Œufs","fr",[6]],["Fécule de pomme de terre","se",[7]],["Huile de friture","se",[8]],["Citron","fl",[9]],["Poivre","ep",[10]]],"shop":null,"img":{"s":"img/karaage-s-e59898.webp","l":"img/karaage-e59898.webp","c":"#937b68"}},{"id":"krapao","t":"Krapao","e":"🌶️","type":"Plat","base":["Poulet","Pâtes & riz"],"orig":["Asie"],"saison":["Toute saison"],"effort":"Express","pantheon":false,"intro":"","tip":"Le basilic thaï se met hors du feu, et l'œuf se frit dans beaucoup d'huile très chaude pour des bords croustillants.","serves":"2 portions","n":2,"ingr":[{"group":null,"items":["300 g de hauts de cuisse de poulet, hachés au couteau","4 gousses d'ail","2 à 4 piments oiseaux, selon ta tolérance","1 c. à soupe de sauce d'huître","1 c. à café de sauce soja","1 c. à café de nuoc-mâm","1 c. à café de sucre","2 c. à soupe d'eau","1 grosse poignée de basilic thaï (ou sacré)","Huile neutre","2 œufs","Riz jasmin"]}],"steps":["**Lancer le riz.** Riz jasmin cuit, gardé au chaud.","**Piler ail et piments** ensemble au mortier, grossièrement (ou hachés fin au couteau).","**Saisir.** Poêle ou wok très chaud avec un peu d'huile : ail-piment 20 secondes, puis le poulet. Le laisser saisir sans trop remuer, en le cassant en petits morceaux.","**Saucer.** Ajouter la sauce d'huître, la soja, le nuoc-mâm, le sucre et l'eau. Laisser réduire 1 minute : ça doit napper, pas baigner.","**Basilic hors du feu.** Le jeter à la fin et mélanger : il flétrit juste dans la chaleur.","**Œuf frit croustillant.** Dans un bon fond d'huile très chaude, arroser le blanc jusqu'à ce que les bords soient dorés et croustillants, jaune coulant.","**Servir.** Riz, krapao à côté, œuf posé dessus."],"notes":["Le basilic fait le plat : basilic thaï ou sacré (épicerie asiatique, comme [Chen Market à Belleville](https://www.google.com/maps/dir/?api=1&destination=Chen+Market%2C+120+rue+du+Faubourg+du+Temple%2C+75011+Paris)), c'est mieux, mais ça marche aussi avec du basilic normal.","La viande hachée au couteau plutôt qu'au robot : on garde des morceaux qui accrochent la sauce.","Goûter après la sauce : trop salé, un trait d'eau ; plat, un peu plus de nuoc-mâm."],"courses":[["Hauts de cuisse de poulet","fr",[0]],["Ail","fl",[1]],["Piment oiseau","fl",[2]],["Sauce huître","se",[3]],["Sauce soja","se",[4]],["Nuoc-mâm","se",[5]],["Sucre","se",[6]],["Basilic thaï","fl",[8]],["Huile de friture","se",[]],["Œufs","fr",[10]],["Riz jasmin","se",[11]]],"shop":null,"img":{"s":"img/krapao-s-7df3f0.webp","l":"img/krapao-7df3f0.webp","c":"#7f7266"}},{"id":"lasagnes-a-la-bolognaise","t":"Lasagnes à la bolognaise","e":"🍝","type":"Plat","base":["Boeuf","Pâtes & riz"],"orig":["Italie"],"saison":["Automne","Hiver"],"effort":"Plus d'1 h","pantheon":false,"intro":"","tip":"Servir tiède : chaud, ça coule.","serves":"6 portions","n":6,"ingr":[{"group":null,"items":["1 [[Ragù à la bolognaise]] (recette complète)","1 L de [[Béchamel]]","~250 g de pâtes à lasagne","150 g de parmesan râpé"]}],"steps":["**Préparer le ragù** (voir [[Ragù à la bolognaise]]), à l'avance idéalement.","**Faire la béchamel le jour même**, juste avant de monter (voir [[Béchamel]]) : roux, lait, bouillon cube de poule, muscade, poivre.","**Monter les lasagnes.** Une fine couche de béchamel au fond du plat, pour que les premières pâtes l'absorbent et cuisent dedans. Puis : pâtes à lasagne, ragù, un peu de parmesan râpé, une couche de béchamel. Recommencer jusqu'en haut.","**Finir par la béchamel** et une belle, belle dose de parmesan râpé.","**Cuire** au four à 180 °C, 45 min à 1 h, jusqu'à ce que ce soit bien gratiné.","**Laisser tiédir avant de servir.** Chaud, ça coule partout ; tiède, ça se tient."],"notes":["Le ragù se fait à l'avance, la veille par exemple. La béchamel, jamais : elle se fait le jour J, juste avant de monter les lasagnes."],"courses":[["Pâtes à lasagne","se",[2]],["Parmesan","fr",[3]],["Viande hachée de bœuf","fr",[]],["Carotte","fl",[]],["Céleri branche","fl",[]],["Oignon","fl",[]],["Ail","fl",[]],["Huile d'olive","se",[]],["Vin blanc","se",[]],["Concentré de tomate","se",[]],["Tomates concassées","se",[]],["Bouillon de volaille","se",[]],["Laurier","ep",[]],["Beurre","fr",[]],["Farine","se",[]],["Lait entier","fr",[]],["Noix de muscade","ep",[]],["Sel","ep",[]],["Poivre","ep",[]]],"shop":null,"img":{"s":"img/lasagnes-a-la-bolognaise-s-b8ac1d.webp","l":"img/lasagnes-a-la-bolognaise-b8ac1d.webp","c":"#7d6e62"}},{"id":"lasagnes-vegetariennes","t":"Lasagnes végétariennes","e":"🥬","type":"Plat","base":["Veggie","Pâtes & riz"],"orig":["Italie"],"saison":["Toute saison"],"effort":"Plus d'1 h","pantheon":false,"intro":"","tip":"Pas de sel ajouté ni de bouillon cube : le citron confit, le gorgonzola et le parmesan salent déjà.","serves":"6 portions","n":6,"ingr":[{"group":"Farce","items":["3 pots de ricotta (≈ 750 g)","500 g d'épinards frais","2 courgettes, en petits dés","Blettes, selon le marché (facultatif)","1 citron confit au sel","2 œufs","1 petite poignée de menthe et 1 de basilic, ciselées","Poivre (sel seulement pour faire dégorger les légumes)"]},{"group":"Béchamel au gorgonzola","items":["60 g de beurre","60 g de farine","1 L de lait entier","Noix de muscade, poivre","150 g de gorgonzola en dés"]},{"group":"Montage","items":["≈ 250 g de pâtes à lasagne","150 g de parmesan râpé"]}],"steps":["**Cuire les légumes.** Épinards, courgettes en dés et blettes, avec juste un peu de sel pour les faire dégorger. Les cuire jusqu'à leur faire rendre le maximum d'eau.","**Les sécher.** Soit dans un torchon qu'on presse un peu, soit dans une passoire où on les laisse rendre leur eau une vingtaine de minutes. Il doit en rester le moins possible.","**Préparer le citron confit.** Le précuire à l'eau pour qu'il ne soit pas trop dur, puis le tailler en toute petite brunoise.","**Monter la farce.** Mélanger la ricotta, les légumes refroidis, le citron confit, les œufs, la menthe et le basilic. Poivrer, ne pas saler.","**Béchamel au gorgonzola.** Une [[Béchamel]] normale, **sans le bouillon cube**. Quand elle est quasiment prête, ajouter le gorgonzola en dés et le laisser fondre.","**Monter les lasagnes.** Une fine couche de béchamel au fond du plat, puis pâtes à lasagne, farce, béchamel au gorgonzola, un peu de parmesan. Recommencer jusqu'en haut.","**Finir** par la béchamel et une belle dose de parmesan.","**Gratiner** au four à 180 °C, environ 45 min."],"notes":["Le sel est déjà partout (citron confit, gorgonzola, parmesan) : pas de bouillon cube dans la béchamel, pas de sel dans la farce.","Sans le bouillon cube de poule, le plat est végétarien."],"courses":[["Ricotta","fr",[0]],["Épinards","fl",[1]],["Courgette","fl",[2]],["Citron confit","se",[4]],["Œufs","fr",[5]],["Menthe","fl",[6]],["Basilic","fl",[6]],["Gorgonzola","fr",[12]],["Beurre","fr",[8]],["Farine","se",[9]],["Lait entier","fr",[10]],["Noix de muscade","ep",[11]],["Pâtes à lasagne","se",[13]],["Parmesan","fr",[14]],["Sel","ep",[4,7]],["Poivre","ep",[7,11]]],"shop":null,"img":{"s":"img/lasagnes-vegetariennes-s-23f994.webp","l":"img/lasagnes-vegetariennes-23f994.webp","c":"#8c8578"}},{"id":"matcha-latte-maison","t":"Matcha latte maison","e":"🍵","type":"Dessert","base":["Veggie"],"orig":["Japon"],"saison":["Toute saison"],"effort":"Express","pantheon":false,"intro":"Crémeux comme au café, mousse comprise, en 5 minutes chrono. Le vrai matcha latte, celui qui te fait lâcher le coffee shop.","tip":"","serves":"1 tasse","n":1,"ingr":[],"steps":[],"notes":[],"courses":[],"shop":null,"img":{"s":"img/matcha-latte-maison-s-731f77.webp","l":"img/matcha-latte-maison-731f77.webp","c":"#7f8f6b"}},{"id":"nouilles-sautees-pak-choi-poulet","t":"Nouilles sautées pak choï poulet","e":"🍜","type":"Plat","base":["Poulet","Pâtes & riz"],"orig":["Asie"],"saison":["Toute saison"],"effort":"Express","pantheon":false,"intro":"","tip":"Tout préparer avant d'allumer le feu, et une poêle ou un wok très chaud, pas surchargé.","serves":"2 portions","n":2,"ingr":[{"group":null,"items":["200 g de nouilles aux œufs","300 g de hauts de cuisse de poulet désossés, en lamelles","3 pak choï (ou 2 gros)","2 gousses d'ail","3 cm de gingembre","2 cébettes","2 c. à soupe d'huile neutre"]},{"group":"Marinade du poulet","items":["1 c. à soupe de sauce soja","1 c. à café de fécule","1 c. à café d'huile de sésame"]},{"group":"Sauce","items":["2 c. à soupe de sauce soja","1 c. à soupe de sauce huître","1 c. à café de sucre","1 c. à café d'huile de sésame","1 c. à café de vinaigre de riz","3 c. à soupe d'eau","Sriracha, selon le goût"]}],"steps":["**Mariner le poulet** 15 min avec soja, fécule et huile de sésame.","**Préparer.** Mélanger les ingrédients de la sauce. Hacher ail et gingembre. Séparer les tiges et les feuilles de pak choï, couper les tiges en morceaux. Émincer les cébettes, en gardant le vert à part.","**Cuire les nouilles** 1 min de moins que le temps indiqué, les rincer à l'eau froide, égoutter et les enrober d'un filet d'huile.","**Saisir le poulet** à la poêle ou au wok très chaud dans 1 c. à soupe d'huile, sans trop remuer, jusqu'à ce qu'il soit doré. Réserver.","**Sauter les légumes.** Reste d'huile, ail, gingembre et blanc de cébette 30 s, puis tiges de pak choï 2 min, puis les feuilles.","**Tout réunir.** Nouilles, poulet et sauce dans la poêle ou le wok, sauter à feu vif 1-2 min jusqu'à ce que la sauce enrobe et commence à caraméliser.","**Servir** avec le vert de cébette et un trait de sriracha."],"notes":["Tout doit être prêt avant d'allumer le feu : la cuisson à feu vif va trop vite pour couper en même temps.","Des hauts de cuisse plutôt que du blanc : ils restent juteux à feu vif.","Poêle ou wok trop petit ? Cuire en deux fois, sinon ça bout au lieu de sauter."],"courses":[["Nouilles aux œufs","se",[0]],["Hauts de cuisse de poulet","fr",[1]],["Pak choï","fl",[2]],["Ail","fl",[3]],["Gingembre","fl",[4]],["Cébette","fl",[5]],["Huile de friture","se",[]],["Sauce soja","se",[7,10]],["Fécule de pomme de terre","se",[]],["Huile de sésame","se",[9,13]],["Sauce huître","se",[11]],["Sucre","se",[12]],["Vinaigre de riz","se",[14]],["Sriracha","se",[16]]],"shop":null,"img":{"s":"img/nouilles-sautees-pak-choi-poulet-s-6c7397.webp","l":"img/nouilles-sautees-pak-choi-poulet-6c7397.webp","c":"#6a5937"}},{"id":"papillotes-de-saumon-au-citron-confit","t":"Papillotes de saumon au citron confit","e":"🐟","type":"Plat","base":["Poisson"],"orig":["Moyen-Orient"],"saison":["Toute saison"],"effort":"Express","pantheon":false,"intro":"","tip":"Retirer la pulpe du citron confit et n'utiliser que l'écorce, sinon tout le plat est trop salé. Et 12 min montre en main : le saumon passe du nacré au sec très vite.","serves":"4 personnes","n":4,"ingr":[{"group":null,"items":["4 pavés de saumon de 150 g, avec la peau","1 citron confit","1 fenouil","1 courgette","2 c. à soupe d'huile d'olive","1 gousse d'ail","½ bouquet de coriandre","½ c. à café de cumin","1 citron frais","Sel, poivre"]}],"steps":["**Préchauffer à 200 °C.**","**Préparer le citron confit.** Le couper en deux, **retirer et jeter la pulpe** — c'est elle qui apporte le sel agressif. Tailler l'écorce en fines lanières.","**Émincer les légumes** très finement : fenouil à la mandoline, courgette en rubans ou demi-lunes fines. Ils n'ont que le temps de cuisson du poisson.","**Monter les papillotes.** Sur chaque grand carré de papier cuisson : un lit de légumes, huile d'olive, ail râpé, cumin, sel, poivre. Le pavé de saumon par-dessus, peau en dessous. Les lanières de citron confit sur le poisson, un filet d'huile.","**Fermer hermétiquement**, en pliant les bords plusieurs fois. Une papillote qui fuit ne fait plus rien.","**Cuire 12 à 15 min** selon l'épaisseur. Le saumon doit rester nacré au centre.","**Ouvrir à table**, coriandre ciselée et un trait de citron frais."],"notes":["Pense bien à retirer la pulpe du citron confit : c'est elle qui sale tout le plat.","Du papier cuisson plutôt que de l'aluminium : le citron et l'acidité attaquent l'alu.","Coupe les légumes bien fin : dans la papillote, ils n'ont que 12 min pour cuire."],"courses":[["Saumon","fr",[0]],["Citron confit","se",[1]],["Fenouil","fl",[2]],["Courgette","fl",[3]],["Huile d'olive","se",[4]],["Ail","fl",[5]],["Coriandre","fl",[6]],["Cumin","ep",[7]],["Citron","fl",[1,8]],["Sel","ep",[9]],["Poivre","ep",[9]]],"shop":null,"img":null},{"id":"parmigiana-d-aubergines","t":"Parmigiana d'aubergines","e":"🍆","type":"Plat","base":["Veggie","Fromage"],"orig":["Italie"],"saison":["Été"],"effort":"Plus d'1 h","pantheon":false,"intro":"","tip":"Rôtir les tranches d'aubergine avant de monter, et une sauce tomate bien réduite : sinon le plat baigne. Laisser reposer 20 min avant de couper.","serves":"6 portions","n":6,"ingr":[{"group":null,"items":["3 aubergines (≈ 1 kg)","800 g de tomates concassées","1 oignon","2 gousses d'ail","1 bouquet de basilic","250 g de mozzarella","80 g de parmesan râpé","6 c. à soupe d'huile d'olive","Sel, poivre"]}],"steps":["**Sauce tomate.** Suer l'oignon émincé dans 2 c. à soupe d'huile d'olive, ajouter l'ail, puis les tomates concassées. Réduire 30 min à feu doux jusqu'à ce que la sauce soit épaisse. Quelques feuilles de basilic à la fin, sel, poivre.","**Rôtir les aubergines.** Tranches de 1 cm dans la longueur, badigeonnées d'huile d'olive, salées. Four à 220 °C, 20 à 25 min, jusqu'à ce qu'elles soient dorées et fondantes.","**Monter.** Un fond de sauce dans le plat, puis aubergines, sauce, mozzarella en morceaux, parmesan, basilic. Recommencer, et finir par sauce et parmesan.","**Cuire** 35 à 40 min à 190 °C, jusqu'à ce que ça bouillonne et gratine.","**Reposer 20 min** ava
